function bossPercent(id){ return state.bossBoosts[id] || 0; }
function isBossDefeated(id){ return !!state.bossDefeated[id]; }
function bossLevel(boss){ return Math.ceil(boss.baseLevel * (1 + bossPercent(boss.id)/100)); }

function findLoc(id){ return state.locations.find(l=>l.id===id); }

/* Dupes-Clause gilt für die ganze Entwicklungsreihe, nicht nur identische Spezies (Standard-
   Nuzlocke-Regel: schon ein Glumanda gefangen -> auch Glutexo/Glurak zählen als Dupe). EVOLUTIONS
   bildet nur Eltern->Kinder ab (inkl. Verzweigungen wie Evoli); hier umgekehrt aufgelöst, um von
   jeder Spezies aus zur Basis der Reihe hochzulaufen - zwei Spezies sind ein Dupe, wenn sie zur
   selben Basis gehören. */
const EVOLUTION_PARENT_LOOKUP = new Map();
Object.entries(EVOLUTIONS).forEach(([parent, children])=>{
  children.forEach(child=>EVOLUTION_PARENT_LOOKUP.set(child.toLowerCase(), parent.toLowerCase()));
});
function evolutionFamilyRoot(speciesName){
  let cur = String(speciesName||"").trim().toLowerCase();
  let guard = 0;
  while(EVOLUTION_PARENT_LOOKUP.has(cur) && guard++ < 10) cur = EVOLUTION_PARENT_LOOKUP.get(cur);
  return cur;
}
function findDuplicateSpecies(species, excludeLocId){
  const targetRoot = evolutionFamilyRoot(species);
  return state.locations.find(l=>l.id!==excludeLocId && l.mon && evolutionFamilyRoot(l.mon.species)===targetRoot) || null;
}

/* Unter 24 Stunden relativ ("vor X Min./Std.", wie gehabt) - darüber statt "gestern"/"vor X
   Tagen" das genaue Datum + Uhrzeit, da eine reine Tagesangabe ab dann schnell ungenau wird
   (z.B. "vor 1 Tag" könnte je nach Tageszeit zwischen 24 und 48 Stunden zurückliegen). */
function formatRelativeTime(ts){
  if(!ts) return "nie";
  const diffMs = Date.now() - ts;
  const diffMin = Math.floor(diffMs/60000);
  if(diffMin < 1) return "gerade eben";
  if(diffMin < 60) return `vor ${diffMin} Min.`;
  const diffH = Math.floor(diffMin/60);
  if(diffH < 24) return `vor ${diffH} Std.`;
  const d = new Date(ts);
  return `${d.toLocaleDateString("de-DE")} ${d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" })}`;
}

/* Verlauf: chronologisches Log wichtiger Ereignisse (gefangen, gestorben, entwickelt, Boss
   besiegt, Duelle, Starter). Text wird beim Eintreten fertig formatiert gespeichert statt aus
   IDs rekonstruiert - einfacher und stabil auch wenn sich z.B. ein Spitzname später ändert.
   Cap bei 400 Einträgen, älteste zuerst raus, damit der Spielstand nicht unbegrenzt wächst. */
function logEvent(type, text){
  state.eventLog.push({ ts:Date.now(), type, text });
  if(state.eventLog.length > 400) state.eventLog.splice(0, state.eventLog.length - 400);
}

/* Kurzes haptisches Feedback bei Fang/Tod/Bosssieg - navigator.vibrate() existiert nicht auf allen
   Geräten/Browsern (u.a. iOS Safari komplett ohne Unterstützung), daher immer defensiv prüfen statt
   vorauszusetzen. Pro Ereignis ein eigenes, kurzes Muster statt eines einzigen generischen Zuckens,
   damit sich Fang/Tod/Sieg auch ohne Hinsehen unterscheiden lassen. */
function vibrateFeedback(pattern){
  if(state.vibrationEnabled===false) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
}

function teamCount(){ return state.locations.filter(l=>l.mon && l.mon.inTeam && !l.mon.dead).length; }
function aliveCount(){ return state.locations.filter(l=>l.mon && !l.mon.dead).length; }
function deadCount(){ return state.locations.filter(l=>l.mon && l.mon.dead).length; }

/* Abgegebene Pokémon (an den Duellpartner nach einer verlorenen Ruhmeshalle-Niederlage, siehe
   act==="give-to-friend") zählen bewusst NICHT in die Überlebensrate hinein - weder als "überlebt"
   noch als "gestorben", sie haben den Run einfach verlassen. Ohne diesen Ausschluss konnte die Rate
   nie auf 0% fallen, selbst wenn das komplette verbliebene Team gestorben war, weil abgegebene
   Pokémon (nicht tot, aber auch nicht mehr im Besitz) weiter als "lebend" mitgezählt wurden. */
function survivalRate(){
  const relevant = state.locations.filter(l=>l.mon && !l.mon.given);
  if(!relevant.length) return null;
  return Math.round(relevant.filter(l=>!l.mon.dead).length / relevant.length * 100);
}
function survivalRateTone(rate){
  if(rate===null || rate>=50) return "dot-good";
  if(rate>=25) return "dot-warn";
  return "dot-red";
}
function resolvedCount(){ return state.locations.filter(l=>l.status!=="pending").length; }

/* ---------- rendering ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function chipFor(loc){
  if(loc.status==="pending") return isAlmostDoneHighlight() ? '<span class="chip gold">✨ Fast geschafft</span>' : '<span class="chip silver">Offen</span>';
  if(loc.status==="failed") return '<span class="chip warn">Nicht gefangen</span>';
  if(loc.mon.given) return '<span class="chip accent">Abgegeben</span>';
  if(loc.mon.dead) return '<span class="chip red">Gestorben</span>';
  if(loc.mon.inTeam) return '<span class="chip good">Im Team</span>';
  return '<span class="chip gold">In der Box</span>';
}
function cardClass(loc){
  if(loc.status==="pending") return "st-pending" + (isAlmostDoneHighlight() ? " almost-done" : "");
  if(loc.status==="failed") return "st-failed";
  if(loc.mon.given) return "st-given";
  if(loc.mon.dead) return "st-dead";
  if(loc.mon.inTeam) return "st-team";
  return "st-box";
}

/* Im Einzelspieler-Modus trägt state.hallOfFame.result zwar "win" (siehe snapshotSoloHallOfFame),
   das ist aber kein Duell-Ergebnis gegen eine echte Person, sondern nur der Champion-Sieg als
   Abschlussmarkierung für die Ruhmeshalle - fließt daher bewusst NICHT in die Duell-Bilanz ein. */
function rivalDuelTally(){
  let wins = 0, losses = 0;
  Object.values(state.pvp).forEach(rec=>{
    if(rec.winner==="me") wins++;
    else if(rec.winner==="friend") losses++;
  });
  if(!state.soloMode){
    if(state.hallOfFame.result==="win") wins++;
    else if(state.hallOfFame.result==="loss") losses++;
  }
  return { wins, losses };
}

/* Im Einzelspieler-Modus zählt "duel-final" (das finale Rivalenduell gegen die echte Duellpartnerin/
   den echten Duellpartner) nirgends mit - dafür gibt es niemanden, es wird auch nie als besiegt
   markiert (siehe renderRoutes/locationTiles). Ohne diesen Ausschluss könnte ein Solo-Run nie
   100% erreichen und "Bosse besiegt" nie den vollen Nenner anzeigen. */
function activeBosses(){
  return currentGame().bosses.filter(b=>!(b.final && state.soloMode) && !bossRequiresOtherStarter(b, state.starterChoice));
}

/* Gesamtabschluss über alle fangbaren Standorte (noCatch-Orte ausgenommen, dort gibt es nie
   etwas zu tun) UND alle Bosse der aktuellen Edition - "duel-final" ist Teil dieser Boss-Liste,
   erreicht also erst 100%, wenn auch das finale Rivalenduell gegen den Duellpartner eingetragen
   wurde (Sieg oder Niederlage, siehe act==="save-final-rival"). */
function completionPercent(){
  const catchable = state.locations.filter(l=>!l.noCatch);
  const locsDone = catchable.filter(l=>l.status!=="pending").length;
  const bosses = activeBosses();
  const bossesDone = bosses.filter(b=>isBossDefeated(b.id)).length;
  const total = catchable.length + bosses.length;
  return total ? Math.round((locsDone+bossesDone)/total*100) : 0;
}

/* "Fast geschafft"-Hervorhebung: sobald insgesamt (Standorte + Bosse zusammen, wie in
   completionPercent()) nur noch ganz wenige offene Kacheln übrig sind, werden GENAU diese optisch
   hervorgehoben - da es per Definition nur noch <= ALMOST_DONE_THRESHOLD offene Kacheln geben kann,
   muss nicht extra ausgewählt werden "welche 3", jede noch offene Kachel qualifiziert sich. */
const ALMOST_DONE_THRESHOLD = 3;
function remainingOverallCount(){
  const catchable = state.locations.filter(l=>!l.noCatch);
  const locsLeft = catchable.filter(l=>l.status==="pending").length;
  const bossesLeft = activeBosses().filter(b=>!isBossDefeated(b.id)).length;
  return locsLeft + bossesLeft;
}
function isAlmostDoneHighlight(){
  const remaining = remainingOverallCount();
  return remaining>0 && remaining<=ALMOST_DONE_THRESHOLD;
}

/* Run-Dauer: grob aus dem Verlauf abgeleitet (erstes Ereignis bis jetzt bzw. bis zum übergebenen
   Endzeitpunkt) statt einer eigenen "Run gestartet am"-Zeitstempel-Property - der Verlauf beginnt
   ohnehin exakt beim ersten Fang/Ereignis, ein zusätzliches Feld wäre redundant. */
function formatDuration(startTs, endTs){
  if(!startTs) return "–";
  const days = Math.max(0, Math.floor(((endTs||Date.now())-startTs)/(1000*60*60*24)));
  if(days<1) return "<1 Tag";
  return days===1 ? "1 Tag" : `${days} Tage`;
}
function runDurationLabel(){
  return state.eventLog.length ? formatDuration(state.eventLog[0].ts, null) : "–";
}

function statTileHtml(tone, label, value){
  return `<div class="stat-tile ${tone||""}">
    <span class="stat-label">${escapeHtml(label)}</span>
    <span class="stat-value">${escapeHtml(String(value))}</span>
  </div>`;
}

function statsCardHtml(){
  const pct = completionPercent();
  const caught = aliveCount()+deadCount();
  const survival = survivalRate();
  const bosses = activeBosses();
  const bossesDefeated = bosses.filter(b=>isBossDefeated(b.id)).length;
  const duelTally = rivalDuelTally();
  const tiles = [
    // Reihenfolge: positiv (grün) -> neutral (weiß) -> negativ (rot) -> Fortschritt (gold)
    statTileHtml(survivalRateTone(survival), "Überlebensrate", survival===null?"–":survival+"%"),
    ...(state.soloMode ? [] : [statTileHtml("dot-good", "Duelle gewonnen", duelTally.wins)]),
    statTileHtml("", "Gefangen", caught),
    statTileHtml("", "Entwicklungen", state.evolutionCount||0),
    statTileHtml("dot-red", "Gestorben", deadCount()),
    statTileHtml("dot-red", "Kampfniederlagen", state.lossCount||0),
    ...(state.soloMode ? [] : [statTileHtml("dot-red", "Duelle verloren", duelTally.losses)]),
    statTileHtml("dot-gold", "Bosse besiegt", `${bossesDefeated}/${bosses.length}`),
    statTileHtml("", "Run-Dauer", runDurationLabel()),
  ].join("");
  return `<div class="card">
    <div class="loc-name" style="margin-bottom:10px;">Statistik</div>
    <div class="stat-grid">${tiles}</div>
    <div class="progress-label-row">
      <span>Gesamtabschluss</span>
      <span class="progress-pct">${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function renderHeaderTeam(){
  const row = document.getElementById("headerTeamRow");
  const slots = document.getElementById("headerTeamSlots");
  if(activeTab==="team" || activeTab==="settings"){ row.style.display = "none"; slots.innerHTML = ""; return; }
  row.style.display = "flex";
  const teamLocs = state.locations.filter(l=>l.mon && l.mon.inTeam && !l.mon.dead && !l.mon.given);
  let html = "";
  for(let i=0;i<6;i++){
    const loc = teamLocs[i];
    if(loc){
      const src = spriteFor(loc.mon.species);
      const cls = isLegacyPixelSprite(loc.mon.species) ? ' class="sprite-legacy"' : "";
      html += `<div class="header-team-slot filled">${src?`<img${cls} src="${src}" alt="" />`:""}</div>`;
    } else {
      html += `<div class="header-team-slot"></div>`;
    }
  }
  slots.innerHTML = html;
}

/* Erhaltene Orden rechts neben den Team-Slots im Header - zeigt bewusst nur bereits erhaltene
   Orden (kein leerer Platzhalter für unerhaltene), damit die Reihe bei Editionen mit vielen Orden
   (z.B. HGSS/GSC mit 16 statt 8, Johto+Kanto zusammen) einfach über mehrere Zeilen mitwächst statt
   eine feste Kachelzahl reservieren zu müssen. */
function renderHeaderOrden(){
  const tray = document.getElementById("headerOrdenTray");
  if(!tray) return;
  if(activeTab==="team" || activeTab==="settings"){ tray.innerHTML = ""; return; }
  const earned = ordenList().filter(o=>o.earned);
  tray.innerHTML = earned.map(o=>{
    const src = BADGE_SPRITES[o.badge] || "";
    return `<div class="header-orden-chip" data-badge="${escapeHtml(o.badge)}" title="${escapeHtml(o.badge)}"><img src="${src}" alt="${escapeHtml(o.badge)}" /></div>`;
  }).join("");
}

/* Kräftiger Feuerwerk-Funken-Ausbruch an einer festen Bildschirmposition - ein kurzer heller
   Blitz (.orden-firework-flash) markiert die "Explosion", danach fliegen viele große, bunt
   leuchtende Partikel (mit Glow per box-shadow) radial und über zwei Distanz-Ringe gestaffelt
   nach außen und verblassen, per reinem CSS-Keyframe (siehe .orden-firework-particle). Nutzt
   dieselbe editionsgekoppelte Farbpalette wie das Konfetti (CONFETTI_COLORS, siehe v1.8.40) -
   reine CSS-Variablen-Referenzen statt fixer Hex-Werte, damit das Feuerwerk automatisch im
   Farbschema der jeweils aktiven Edition erscheint statt immer gleich auszusehen. */
function spawnOrdenFirework(cx, cy){
  const flash = document.createElement("div");
  flash.className = "orden-firework-flash";
  flash.style.left = cx+"px"; flash.style.top = cy+"px";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 600);
  const count = 26;
  for(let i=0;i<count;i++){
    const p = document.createElement("div");
    p.className = "orden-firework-particle";
    const angle = (Math.PI*2*i/count) + (Math.random()*0.3-0.15);
    const dist = 85 + Math.random()*100;
    const size = 6 + Math.random()*7;
    const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    p.style.left = cx+"px"; p.style.top = cy+"px";
    p.style.width = size+"px"; p.style.height = size+"px";
    p.style.setProperty("--dx", (Math.cos(angle)*dist)+"px");
    p.style.setProperty("--dy", (Math.sin(angle)*dist)+"px");
    p.style.background = color;
    p.style.boxShadow = `0 0 10px 2px ${color}`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1200);
  }
}
/* Feierliche Orden-Animation: taucht groß in der Bildschirmmitte auf, bleibt dort knapp 2,5s gut
   sichtbar stehen (mit drei kräftigen Feuerwerk-Funkenausbrüchen währenddessen) und fliegt danach
   OHNE auszublenden zu seinem echten Platz im Header-Tray, während er sich dabei auf dessen
   tatsächliche Chip-Größe verkleinert (FLIP-artig: Zielposition/-größe per
   getBoundingClientRect() vom bereits durch render() aktualisierten, aber unsichtbaren echten
   Chip abgelesen) - bleibt bis zum letzten Frame voll deckend, damit es wirkt, als würde der
   Orden direkt an seinem Platz "abgesetzt" statt wegzublenden und der echte Chip würde separat
   davon einfach woanders auftauchen. Der echte Chip an seinem Platz im Header existiert dank
   render() vor diesem Aufruf bereits - er bleibt für die komplette Animationsdauer unsichtbar und
   wird erst im allerletzten Frame (deckungsgleich mit dem großen Orden) wieder eingeblendet,
   damit kein doppeltes Icon aufblitzt und der Header trotzdem synchron mit der Feier aktualisiert
   wirkt. */
function celebrateOrden(badgeName){
  const target = document.querySelector(`#headerOrdenTray .header-orden-chip[data-badge="${cssEscape(badgeName)}"]`);
  if(!target) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const src = BADGE_SPRITES[badgeName] || "";
  const targetRect = target.getBoundingClientRect();
  target.style.visibility = "hidden";
  const fly = document.createElement("div");
  fly.className = "orden-fly-badge";
  fly.innerHTML = `<img src="${src}" alt="" />`;
  document.body.appendChild(fly);
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const flySize = fly.getBoundingClientRect().width || 120;
  const deltaX = (targetRect.left + targetRect.width/2) - cx;
  const deltaY = (targetRect.top + targetRect.height/2) - cy;
  const finalScale = Math.max(targetRect.width / flySize, 0.05);
  const POP_IN = 350, HOLD = 2500, EXIT = 500;
  const total = POP_IN + HOLD + EXIT;
  const popInFrac = POP_IN/total, holdEndFrac = (POP_IN+HOLD)/total;
  const anim = fly.animate([
    { transform:"translate(-50%,-50%) translate(0,0) scale(.3)", opacity:0, offset:0 },
    { transform:"translate(-50%,-50%) translate(0,0) scale(1.08)", opacity:1, offset:popInFrac*0.7 },
    { transform:"translate(-50%,-50%) translate(0,0) scale(1)", opacity:1, offset:popInFrac },
    { transform:"translate(-50%,-50%) translate(0,0) scale(1)", opacity:1, offset:holdEndFrac },
    { transform:`translate(-50%,-50%) translate(${deltaX}px, ${deltaY}px) scale(${finalScale})`, opacity:1, offset:1 }
  ], { duration:total, easing:"ease-out", fill:"forwards" });
  setTimeout(()=>spawnOrdenFirework(cx, cy), POP_IN + 150);
  setTimeout(()=>spawnOrdenFirework(cx, cy), POP_IN + HOLD*0.42);
  setTimeout(()=>spawnOrdenFirework(cx, cy), POP_IN + HOLD*0.74);
  anim.onfinish = () => { fly.remove(); target.style.visibility = ""; };
}
/* Kleine Escape-Hilfe für CSS-Attributselektoren (Orden-Namen können z.B. Umlaute/Bindestriche
   enthalten) - nutzt die native CSS.escape() falls vorhanden, sonst ein einfacher Fallback. */
function cssEscape(s){
  return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&");
}

/* Standorte ohne Fangmöglichkeit galten früher automatisch als "erledigt", sobald sie gerendert
   wurden - dadurch klappten sie sofort ein, ohne dass man sie je gesehen/bestätigt hatte. Jetzt
   braucht es dafür die explizite "Als erledigt markieren"-Aktion (loc.visited), genau wie ein
   normaler Fang/Kein-Fang bei fangbaren Standorten. */
function isLocResolved(loc){ return loc.noCatch ? !!loc.visited : loc.status!=="pending"; }

/* Baut die flache, individuelle Kachel-Liste eines Standorts: der Standort selbst plus jeder an
   ihn angehängte Bosskampf als eigene Einheit (Boss+PvP-Karte zählen zusammen als eine Kachel, da
   isBossSettled beide zusammen abbildet). Jede Einheit trägt ihren eigenen "resolved"-Status, damit
   sie unabhängig von den anderen ein-/ausklappen kann (siehe renderRoutes) - ein an einem Standort
   hängender, bereits abgeschlossener Bosskampf muss so nicht mehr warten, bis auch der Standort
   selbst fangbar ist (z.B. weil dafür erst noch eine Angel fehlt), und umgekehrt. */
function locationTiles(loc, region, game, currentId){
  const tiles = [{ html: routeCard(loc, loc.id===currentId), resolved: isLocResolved(loc), kind:"loc", id: loc.id, name: loc.name }];
  const bossIds = game.bossAfter[region+"|"+loc.name];
  if(bossIds) bossIds.forEach(id=>{
    const boss=bossById(id); if(!boss) return;
    if(bossRequiresOtherStarter(boss, state.starterChoice)) return;
    /* "duel-final" ist ausschließlich das Rivalenduell gegen die echte Duellpartnerin/den echten
       Duellpartner nach dem Champion - im Einzelspieler-Modus gibt es niemanden dafür, die Kachel
       entfällt komplett (siehe isBossSettled: dort wird sie transparent als "erledigt" behandelt,
       damit sie die umgebenden Kacheln nicht dauerhaft am Einklappen hindert). */
    if(boss.final){ if(!state.soloMode) tiles.push({ html: finalRivalCardHtml(boss, boss.id===currentId), resolved: isBossSettled(boss), kind:"boss" }); return; }
    let h = bossCardHtml(boss, boss.id===currentId);
    if(boss.pvp && !state.soloMode) h += pvpCardHtml(boss);
    tiles.push({ html: h, resolved: isBossSettled(boss), kind:"boss" });
  });
  return tiles;
}

function collapseToggleHtml(segKey, count, expanded, bodyHtml){
  const toggle = `<button class="collapse-toggle" data-act="toggle-region-collapse" data-region="${segKey}" data-count="${count}">
    <svg class="collapse-chevron${expanded?" open":""}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    <span>${count} ${count===1?"erledigte Kachel":"erledigte Kacheln"} ${expanded?"ausblenden":"anzeigen"}</span>
  </button>`;
  const body = `<div class="collapsible-body${expanded?" expanded":""}" data-collapse-body="${segKey}"${expanded?"":" inert"}><div class="collapsible-body-inner">${bodyHtml}</div></div>`;
  return toggle + body;
}

/* Manuelles Einklappen NOCH NICHT abgeschlossener Kacheln (state.manualCollapsedLocs) - ursprünglich
   nur für Standorte gedacht, an denen zwar ein Fang möglich wäre, aber erst später im Run (z.B.
   fehlende Angel/VM); seit dem Bosskampf-Zurückstellen (s. bossCardHtml) genauso für Arenaleiter/
   Bosskämpfe nutzbar, denen man sich erst nach einem Umweg (Grinden auf einer anderen Route o.Ä.)
   stellen will - daher bewusst generischer Text ("Kacheln" statt "Standorte"). Anders als das
   automatische Einklappen erledigter Kacheln (collapseToggleHtml) sammelt dies bewusst ALLE so
   markierten, noch offenen Kacheln eines Abschnitts in EINER gemeinsamen Gruppe mit genau einem
   Auf-/Zuklapp-Button, statt für jede einzeln einen eigenen Button zu zeigen (auch wenn sie an
   verschiedenen, nicht benachbarten Stellen der Liste liegen) - sonst würde die Liste bei mehreren
   zurückgestellten Kacheln mit mehreren, kaum unterscheidbaren Buttons überladen. Optisch bewusst
   abgesetzt (Gold-Ton statt Neutral) von den grau gehaltenen "erledigt"-Gruppen, damit auf einen
   Blick klar ist: das hier ist Zurückgestelltes, kein abgehakter Fortschritt. */
function stashCollapseToggleHtml(segKey, count, expanded, bodyHtml){
  const toggle = `<button class="collapse-toggle stash" data-act="toggle-loc-stash-collapse" data-region="${segKey}" data-count="${count}">
    <svg class="collapse-chevron${expanded?" open":""}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    <span>${count} zurückgestellte ${count===1?"Kachel":"Kacheln"} ${expanded?"ausblenden":"anzeigen"}</span>
  </button>`;
  const body = `<div class="collapsible-body${expanded?" expanded":""}" data-collapse-body="${segKey}"${expanded?"":" inert"}><div class="collapsible-body-inner">${bodyHtml}</div></div>`;
  return toggle + body;
}

/* Flaggen ist nicht mehr auf Standort-Kacheln beschränkt - auch Boss- und Finale-Kacheln tragen
   eine eigene Boss-ID als state.currentLocId. isBossSettled() spiegelt für Bosse, was isLocResolved()
   für Standorte ist: erst wenn Bosskampf (und ein angehängter PvP-Kampf) abgeschlossen sind, gilt die
   Markierung als "erledigt" und wird beim nächsten Fortschritt automatisch ersetzt. */
function isBossSettled(boss){
  /* Im Einzelspieler-Modus wird "duel-final" nie gerendert/besiegt (siehe locationTiles) -
     zählt hier trotzdem als transparent erledigt, damit die Kachel davor trotzdem einklappen kann. */
  if(boss.final && state.soloMode) return true;
  if(!isBossDefeated(boss.id)) return false;
  if(boss.pvp && !state.soloMode && !state.pvp[pvpKey(boss.id)]) return false;
  return true;
}
function isCurrentTargetResolved(id){
  const loc = findLoc(id);
  if(loc) return isLocResolved(loc);
  const boss = bossById(id);
  if(boss) return isBossSettled(boss);
  return true;
}
/* Flache Reihenfolge aller Kacheln (Standorte + angehängte Bosse, region- und listenweise in
   Anzeige-Reihenfolge, eigene Fundorte am Ende) - Grundlage fürs Weiterspringen der Flagge um
   genau eine Kachel statt einer Suche "erster offener Standort" quer durch die ganze Liste. */
function allTileIdsInOrder(){
  const game = currentGame();
  const ids = [];
  game.regions.forEach(([region])=>{
    state.locations.filter(l=>l.region===region).forEach(loc=>{
      ids.push(loc.id);
      const bossIds = game.bossAfter[region+"|"+loc.name];
      if(bossIds) bossIds.forEach(bid=>{
        const boss = bossById(bid);
        if(boss && !bossRequiresOtherStarter(boss, state.starterChoice)) ids.push(bid);
      });
    });
  });
  state.locations.filter(l=>l.custom).forEach(loc=>ids.push(loc.id));
  return ids;
}
/* Nächste noch offene Kachel nach id in dieser Reihenfolge. undefined = id kommt in der aktuellen
   Kachel-Liste gar nicht (mehr) vor (z.B. gelöschter eigener Fundort) - Aufrufer soll dann auf den
   generischen Fallback zurückfallen statt die Flagge fälschlich verschwinden zu lassen. null = id
   gefunden, aber alles danach ist bereits erledigt. */
function nextUnresolvedAfter(id){
  const ids = allTileIdsInOrder();
  const idx = ids.indexOf(id);
  if(idx===-1) return undefined;
  for(let i=idx+1;i<ids.length;i++){
    if(!isCurrentTargetResolved(ids[i])) return ids[i];
  }
  return null;
}
/* Der Standort, zu dem der "Zum aktuellen Standort"-Button springt: die manuelle Markierung
   (state.currentLocId, per Flaggen-Icon auf jeder Kachel gesetzt - Standort, Boss oder Finale),
   sofern vorhanden und noch nicht erledigt. Wird die markierte Kachel erledigt, springt die Flagge
   zur nächsten noch offenen Kachel direkt danach (nicht zum ersten offenen Standort irgendwo in der
   Liste - verzweigt die Story an anderer Stelle weiter, setzt man die Flagge dort selbst manuell neu).
   Nur wenn noch nie geflaggt wurde (oder die Markierung auf eine inzwischen ungültige Kachel zeigt),
   dient "erster offener Standort in Regionen-Reihenfolge" als Startpunkt. */
function effectiveCurrentLocId(){
  if(state.currentLocId){
    if(!isCurrentTargetResolved(state.currentLocId)) return state.currentLocId;
    const next = nextUnresolvedAfter(state.currentLocId);
    if(next !== undefined) return next;
  }
  const game = currentGame();
  for(const [region] of game.regions){
    const found = state.locations.find(l=>l.region===region && !isLocResolved(l));
    if(found) return found.id;
  }
  return null;
}

function updateJumpButton(){
  const btn = document.getElementById("jumpFab");
  if(!btn) return;
  btn.dataset.target = effectiveCurrentLocId() || "";
  updateJumpButtonVisibility();
}
function updateJumpButtonVisibility(){
  const btn = document.getElementById("jumpFab");
  if(!btn || activeTab!=="routes" || !btn.dataset.target){ if(btn) btn.classList.remove("visible"); return; }
  const el = document.querySelector(`[data-loc="${btn.dataset.target}"], [data-boss="${btn.dataset.target}"]`);
  if(!el){ btn.classList.remove("visible"); return; }
  const rect = el.getBoundingClientRect();
  const inView = rect.top < innerHeight*0.85 && rect.bottom > innerHeight*0.15;
  btn.classList.toggle("visible", !inView);
  if(!inView) btn.classList.toggle("point-up", rect.bottom <= innerHeight*0.15);
}
document.getElementById("content").addEventListener("scroll", ()=>requestAnimationFrame(updateJumpButtonVisibility), {passive:true});

/* Beim (erneuten) Öffnen des Routen-Tabs direkt zur aktuellen Kachel springen, statt den
   "Zum aktuellen Standort"-Button jedes Mal manuell antippen zu müssen - siehe scrollToCurrentLocation()
   im Tab-Klick-Handler weiter unten. Bewusst kein "smooth" (Sprung statt Animation), da das bei
   jedem einzelnen Tab-Wechsel sonst unruhig wirken würde. */
function scrollToCurrentLocation(){
  const targetId = effectiveCurrentLocId();

/* Standort-Suche: springt direkt zu einer Kachel per Namenssuche, statt lange Listen (bei manchen
   Editionen 100+ Standorte) manuell durchzuscrollen. Durchsucht nur AKTUELL SICHTBARE Standorte
   (respektiert ausgeblendete Regionen/Postgame-Filter) - ein Treffer, den man wegen dieser Filter gar
   nicht anspringen könnte, wäre verwirrender als gar kein Treffer. */
let locationSearchQuery = "";
function locationSearchResultsHtml(query){
  const q = query.trim().toLowerCase();
  if(!q) return `<div class="loc-sub">Tippe einen Routen- oder Ortsnamen ein.</div>`;
  const game = currentGame();
  const visibleRegions = new Set(game.regions.map(([region])=>region).filter(region=>!(state.hiddenRegions||[]).includes(region)));
  const matches = state.locations.filter(l=>
    l.name.toLowerCase().includes(q) &&
    (l.custom || visibleRegions.has(l.region)) &&
    !(state.hidePostgame && /Postgame/.test(l.note||""))
  );
  if(!matches.length) return `<div class="loc-sub">Keine Treffer.</div>`;
  return matches.slice(0,30).map(l=>
    `<button class="sheet-option" data-act="jump-to-location-result" data-id="${l.id}">
      <div>${escapeHtml(l.name)}</div>
      <div class="loc-sub" style="margin:2px 0 0;">${escapeHtml(l.custom ? "Eigener Fundort" : l.region)}</div>
    </button>`
  ).join("");
}
function openLocationSearchSheet(){
  locationSearchQuery = "";
  openSheet(`
    <h3>Standort suchen</h3>
    <div class="field" style="margin-bottom:10px;">
      <input type="search" id="locationSearchInput" class="box-search-input" style="margin-bottom:0;" placeholder="Route oder Ort suchen..." autocomplete="off" />
    </div>
    <div id="locationSearchResults">${locationSearchResultsHtml(locationSearchQuery)}</div>
  `);
  setTimeout(()=>document.getElementById("locationSearchInput")?.focus(), 50);
}

/* Übersicht aller manuell zurückgestellten Kacheln auf einen Blick - Antippen springt wie bei der
   Standort-Suche direkt hin, statt erst die Region durchscrollen und dort den Stash-Toggle suchen zu
   müssen. Seit Bosskämpfe ebenfalls zurückstellbar sind (bossCardHtml) können die IDs in
   state.manualCollapsedLocs sowohl zu state.locations- als auch zu Boss-Einträgen gehören - erst
   Standort, dann Boss versuchen. */
function stashOverviewResultsHtml(){
  const ids = state.manualCollapsedLocs||[];
  const items = ids.map(id=>{
    const loc = state.locations.find(l=>l.id===id);
    if(loc) return { id: loc.id, name: loc.name, sub: loc.custom ? "Eigener Fundort" : loc.region };
    const boss = bossById(id);
    if(boss) return { id: boss.id, name: boss.name, sub: `${boss.cls} · ${boss.place}` };
    return null;
  }).filter(Boolean);
  if(!items.length) return `<div class="loc-sub">Keine Kacheln zurückgestellt.</div>`;
  return items.map(it=>
    `<button class="sheet-option" data-act="jump-to-location-result" data-id="${it.id}">
      <div>${escapeHtml(it.name)}</div>
      <div class="loc-sub" style="margin:2px 0 0;">${escapeHtml(it.sub)}</div>
    </button>`
  ).join("");
}
function openStashOverviewSheet(){
  openSheet(`
    <h3>Zurückgestellte Kacheln</h3>
    <div class="loc-sub" style="margin-bottom:10px;">Alle manuell zurückgestellten Standorte und Bosskämpfe auf einen Blick - antippen springt direkt hin.</div>
    ${stashOverviewResultsHtml()}
  `);
}

/* Beim manuellen Zurückstellen fliegt eine Kopie der Kachel sichtbar zum "später fangbar"-Button
   (Lesezeichen-FAB) - macht auf Anhieb klar, WOHIN die Kachel verschwindet, statt dass sie
   kommentarlos aus der Liste verschwindet und man erst den neuen Button entdecken muss. Analog zur
   Orden-Feier-Animation (celebrateOrden/FLIP-Technik: Start-/Zielposition per
   getBoundingClientRect(), dazwischen per Web-Animations-API interpoliert), aber bewusst kürzer und
   schlichter (kein Feier-Moment, nur eine kurze Bestätigung wohin es geht) - nur beim Zurückstellen
   selbst, nicht beim Wiederherstellen aus dem Stash heraus, da nur dort ein sinnvolles Flugziel
   existiert. */
function flyTileToStash(cardEl){
  if(!cardEl) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const stashFab = document.getElementById("stashFab");
  if(!stashFab) return;
  const startRect = cardEl.getBoundingClientRect();
  stashFab.style.display = "flex";
  const targetRect = stashFab.getBoundingClientRect();
  const clone = cardEl.cloneNode(true);
  clone.classList.add("stash-fly-tile");
  clone.style.left = startRect.left+"px";
  clone.style.top = startRect.top+"px";
  clone.style.width = startRect.width+"px";
  document.body.appendChild(clone);
  const deltaX = (targetRect.left + targetRect.width/2) - (startRect.left + startRect.width/2);
  const deltaY = (targetRect.top + targetRect.height/2) - (startRect.top + startRect.height/2);
  const finalScale = Math.max(targetRect.width / startRect.width, 0.08);
  const anim = clone.animate([
    { transform:"translate(0,0) scale(1)", opacity:1, offset:0 },
    { transform:`translate(${deltaX*0.65}px, ${deltaY*0.65}px) scale(${Math.max(finalScale,0.45)})`, opacity:.85, offset:.55 },
    { transform:`translate(${deltaX}px, ${deltaY}px) scale(${finalScale})`, opacity:0, offset:1 }
  ], { duration:520, easing:"cubic-bezier(.3,0,.55,1)" });
  anim.onfinish = () => {
    clone.remove();
    stashFab.classList.add("pulse");
    setTimeout(()=>stashFab.classList.remove("pulse"), 450);
  };
}
/* Klappt genau die Einklapp-Gruppe(n) auf, die die Ziel-Kachel gerade verstecken - dieselbe
   Segmentierungslogik wie in renderRoutes() (erledigte/zurückgestellte Kacheln als gemeinsamer Block
   pro Region), nur einmalig für die eine betroffene Region/den einen Standort statt für die ganze
   Liste ausgeführt. Sucht seit dem Bosskampf-Zurückstellen (s. bossCardHtml) über ALLE Regionen der
   aktuellen Edition, nicht mehr nur über die Region einer gefundenen state.locations-Kachel - eine
   Bosskampf-ID gehört zu keinem state.locations-Eintrag, ihre Region ergibt sich erst aus der
   locationTiles()-Zuordnung des Standorts, an dem sie über bossAfter hängt. */
function expandCollapseGroupsForLocation(targetId){
  const loc = state.locations.find(l=>l.id===targetId);
  if(loc && loc.custom){
    if(!isLocResolved(loc) && (state.manualCollapsedLocs||[]).includes(loc.id)) expandedStashRegions.add("eigene-fundorte-stash");
    return;
  }
  const game = currentGame();
  const currentId = effectiveCurrentLocId();
  for(const [region] of game.regions){
    const regionKey = slug(region);
    const locs = state.locations.filter(l=>l.region===region && !(state.hidePostgame && /Postgame/.test(l.note||"")));
    const tiles = [];
    locs.forEach(l=>{ tiles.push(...locationTiles(l, region, game, currentId)); });
    const targetTile = tiles.find(t=>t.id===targetId);
    if(!targetTile) continue;
    if(targetTile.resolved){
      expandedRegions.add(`${regionKey}-done`);
    } else if((state.manualCollapsedLocs||[]).includes(targetId)){
      expandedStashRegions.add(`${regionKey}-stash`);
    }
    return;
  }
}

/* Kalibrierungsmodus (seit v1.9.56): Werkzeug für den Nutzer selbst, um die Klickpunkt-Koordinaten
   in REGION_MAPS[...].points von Hand zu setzen, statt sie erraten zu müssen - das Kartenbild trägt

   Recherche), die Punkte zuverlässig platzieren. Läuft NICHT über den normalen Speicherstand
   (state), sondern über ein eigenes localStorage-Fach pro Edition, damit ein Reload während der
   Kalibrierung keine Fortschritte verliert, ohne die Spielstand-Daten zu berühren. */
let calibrationActive = false;
let calibrationIndex = 0;
let calibrationPoints = {};
function refreshMapSheet(){
  sheetEl.innerHTML = `<div class="sheet-handle-bar"><div class="sheet-handle"></div></div><div class="sheet-body">${regionMapSheetHtml()}</div>`;
}
function mapCalibrationHtml(gameId){
  const map = REGION_MAPS[gameId];
  const names = Object.keys(map.points);
  const total = names.length;
  if(calibrationIndex >= total){
    const lines = names.map(n=>{
      const p = calibrationPoints[n] || map.points[n];
      return `      "${n}":[${p[0]},${p[1]}]`;
    }).join(",\n");
    return `
      <p class="loc-sub" style="margin-bottom:10px;">Alle ${total} Punkte gesetzt. Text unten kopieren und schicken - wird direkt in <code>REGION_MAPS</code> übernommen.</p>
      <textarea id="calibrationExport" readonly style="width:100%;min-height:240px;font-family:var(--font-mono);font-size:.7rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);">{\n${lines}\n    }</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-secondary" data-act="calibration-restart">Neu starten</button>
        <button class="btn btn-primary" data-act="calibration-exit">Fertig</button>
      </div>
    `;
  }

  const donePins = names.slice(0, calibrationIndex).map(n=>{

  const modeToggle = map ? `<div class="map-mode-toggle">
    <button class="btn ${mapViewMode==="artwork"?"btn-primary":"btn-secondary"}" data-act="set-map-mode" data-id="artwork">Kartengrafik</button>
    <button class="btn ${mapViewMode==="schema"?"btn-primary":"btn-secondary"}" data-act="set-map-mode" data-id="schema">Schema</button>
  </div>` : "";
  const note = map ? `<div class="loc-sub" style="margin-bottom:10px;">Prototyp: die Klickpunkte auf der Kartengrafik lassen sich jederzeit über „Punkte selbst kalibrieren" anpassen - wirken sie noch kreuz und quer (z.B. bei einem frisch hinzugefügten Kartenbild), einfach neu kalibrieren.</div>` : "";
  const body = (map && mapViewMode==="artwork") ? artworkMapHtml(game.id) : schemaMapHtml(region);
  const calibrateBtn = (map && mapViewMode==="artwork") ? `<button class="btn btn-ghost" data-act="calibration-start" style="margin-top:10px;">Punkte selbst kalibrieren</button>` : "";
  return `<h3>${escapeHtml(region||"")}-Karte</h3>${note}${modeToggle}<div id="regionMapBody">${body}</div>${calibrateBtn}`;
}
function openRegionMapSheet(){
  openSheet(regionMapSheetHtml());
}

/* Einklappen läuft pro einzelner Kachel (Standort- oder Bosskarte), nicht mehr pro Standort samt
   angehängter Bosse als gemeinsamem Block: ein Bosskampf, der bereits abgeschlossen ist, klappt so
   auch dann ein, wenn der zugehörige Standort selbst noch nicht fangbar ist (z.B. weil dafür erst
   noch eine Angel fehlt) - und umgekehrt. Konsekutive erledigte Kacheln werden zu einem gemeinsamen
   Einklapp-Block zusammengefasst, eine einzelne noch offene Kachel unterbricht diesen Block, bleibt
   selbst aber immer sichtbar. */
function renderRoutes(){
  let html = "";
  const game = currentGame();
  const pct = completionPercent();
  html += `<div class="mini-progress-sticky">
    <div class="mini-progress-row"><span>Gesamtabschluss</span><span class="progress-pct">${pct}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
  html += genderCardHtml();
  html += starterCardHtml();
  const currentId = effectiveCurrentLocId();
  game.regions.forEach(([region])=>{
    if((state.hiddenRegions||[]).includes(region)) return;
    const locs = state.locations.filter(l=>l.region===region && !(state.hidePostgame && /Postgame/.test(l.note||"")));
    if(!locs.length) return;
    html += `<div class="region-header">${escapeHtml(region)}</div>`;
    const regionKey = slug(region);

    const tiles = [];
    locs.forEach(loc=>{ tiles.push(...locationTiles(loc, region, game, currentId)); });

    /* Bewusst EIN Sammel-Toggle für ALLE erledigten Kacheln der Region, nicht mehr ein Toggle pro
       zusammenhängendem Block (Nutzerfeedback: mehrere offene Standorte zwischen erledigten rissen
       vorher mehrere kleine, separate "erledigt"-Blöcke auseinander statt sie wie beim "später
       fangbar"-Stash konsequent an einer Stelle zu bündeln). Erledigte und noch offene, manuell
       zurückgestellte Kacheln werden deshalb unabhängig von ihrer Position in der Liste eingesammelt;
       nur noch offene, nicht zurückgestellte Kacheln bleiben inline in ihrer natürlichen Reihenfolge -
       beide Sammel-Toggles erscheinen dadurch konsistent am Ende der Region. */
    const resolvedTiles = [];
    const stashedTiles = [];
    tiles.forEach(tile=>{
      if(tile.resolved){
        resolvedTiles.push(tile);
      } else if((state.manualCollapsedLocs||[]).includes(tile.id)){
        stashedTiles.push(tile);
      } else {
        html += tile.html;
      }
    });
    if(resolvedTiles.length){
      const segKey = `${regionKey}-done`;
      const expanded = expandedRegions.has(segKey);
      let body = "";
      resolvedTiles.forEach(t=>{ body += t.html; });
      html += collapseToggleHtml(segKey, resolvedTiles.length, expanded, body);
    }
    if(stashedTiles.length){
      const stashKey = `${regionKey}-stash`;
      const stashExpanded = expandedStashRegions.has(stashKey);
      let stashBody = "";
      stashedTiles.forEach(t=>{ stashBody += t.html; });
      html += stashCollapseToggleHtml(stashKey, stashedTiles.length, stashExpanded, stashBody);
    }
  });
  const customs = state.locations.filter(l=>l.custom);
  if(customs.length){
    html += `<div class="region-header">Eigene Fundorte</div>`;
    const stashedCustoms = [];
    customs.forEach(loc=>{
      if(!isLocResolved(loc) && (state.manualCollapsedLocs||[]).includes(loc.id)) stashedCustoms.push(loc);
      else html += routeCard(loc, loc.id===currentId);
    });
    if(stashedCustoms.length){
      const stashKey = "eigene-fundorte-stash";
      const stashExpanded = expandedStashRegions.has(stashKey);
      let stashBody = "";
      stashedCustoms.forEach(loc=>{ stashBody += routeCard(loc, loc.id===currentId); });
      html += stashCollapseToggleHtml(stashKey, stashedCustoms.length, stashExpanded, stashBody);
    }
  }
  document.getElementById("content").innerHTML = html || emptyState("Keine Standorte","Füge über + einen eigenen Fundort hinzu.");
  updateJumpButton();
}

function routeCard(loc, isCurrent){
  const currentAttr = isCurrent ? ` data-current="true"` : "";
  const flagBtn = iconBtn(isCurrent?"tone-good":"tone-neutral","toggle-current-loc",loc.id,isCurrent?ICON_FLAG_FILLED:ICON_FLAG,isCurrent?"Nicht mehr aktueller Standort":"Als aktuellen Standort markieren",false,true);
  const hasNote = !!(loc.customNote||"").trim();
  const noteBtn = iconBtn(hasNote?"tone-gold":"tone-neutral","open-location-note",loc.id,hasNote?ICON_NOTE_FILLED:ICON_NOTE,hasNote?"Notiz bearbeiten":"Notiz hinzufügen",false,true);
  const noteHtml = hasNote ? `<div class="loc-note">${escapeHtml(loc.customNote)}</div>` : "";
  /* Manuelles Einklappen ist nur für noch offene (unresolved) Standorte sinnvoll - siehe
     stashCollapseToggleHtml/renderRoutes. Erledigte Standorte werden ohnehin schon automatisch als
     Block eingeklappt. */
  if(loc.noCatch){
    const visited = !!loc.visited;
    const collapseBtn = visited ? "" : iconBtn("tone-neutral","toggle-loc-manual-collapse",loc.id,ICON_COLLAPSE,"Später erledigen - Kachel einklappen",false,true);
    return `<div class="card st-nocatch${visited?" st-nocatch-done":""}" data-loc="${loc.id}"${currentAttr}>
      <div class="card-top">
        <div><div class="loc-name">${escapeHtml(loc.name)}</div></div>
        <div style="display:flex; align-items:center; gap:6px; flex:none;">
          <span class="chip ${visited?"gold":"silver"}">${visited?"Erledigt":"Kein Wildfang"}</span>
          ${noteBtn}
          ${flagBtn}
          ${collapseBtn}
        </div>
      </div>
      <div class="loc-sub">${escapeHtml(loc.note || "Keine wilden Pokémon hier.")}</div>
      ${noteHtml}
      <div class="card-actions" style="margin-top:10px;">
        <button class="btn ${visited?"btn-secondary":"btn-primary"} btn-block" data-act="toggle-loc-visited" data-id="${loc.id}">${visited?"Erledigt zurücknehmen":"Als erledigt markieren"}</button>
      </div>
    </div>`;
  }
  let body = "";
  if(loc.status==="pending"){
    body = `<div class="card-actions">
      <button class="btn btn-primary" data-act="open-catch" data-id="${loc.id}">Gefangen</button>
      <button class="btn btn-secondary" data-act="mark-failed" data-id="${loc.id}">Kein Fang</button>
    </div>`;
  } else if(loc.status==="failed"){
    body = `<div class="mon-block">
      <span class="loc-sub">Kein Pokémon gefangen</span>
      <div class="mon-actions">${iconBtn("tone-neutral","reset-loc",loc.id,ICON_UNDO,"Rückgängig machen",false,false)}</div>
    </div>`;
  } else if(loc.mon){
    const flash = loc.id === lastEvolvedId;
    body = `<div class="mon-block">
      ${monLinkHtml("mon-line", loc.mon.species, `
        ${spriteImgHtml(loc.mon.species, 64, flash)}
        <div>
          <div class="mon-name">${escapeHtml(loc.mon.nickname || loc.mon.species)}</div>
          ${loc.mon.nickname ? `<div class="mon-species">${escapeHtml(loc.mon.species)}</div>` : ""}
        </div>
      `)}
    </div>
    ${monActionsHtml(loc)}`;
  }
  const collapseBtn = loc.status==="pending" ? iconBtn("tone-neutral","toggle-loc-manual-collapse",loc.id,ICON_COLLAPSE,"Später fangbar - Kachel einklappen",false,true) : "";
  return `<div class="card ${cardClass(loc)}" data-loc="${loc.id}"${currentAttr}>
    <div class="card-top">
      <div>
        <div class="loc-name">${escapeHtml(loc.name)}</div>
        ${loc.note ? `<div class="loc-sub">${escapeHtml(loc.note)}</div>` : ""}
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex:none;">
        ${chipFor(loc)}
        ${noteBtn}
        ${flagBtn}
        ${collapseBtn}
        ${loc.custom ? iconBtn("tone-red","delete-location",loc.id,ICON_TRASH,"Fundort löschen",false,true) : ""}
      </div>
    </div>
    ${noteHtml}
    ${body}
  </div>`;
}

/* ---------- Starterwahl: Pflanze schlägt Wasser, Feuer schlägt Pflanze, Wasser schlägt Feuer ---------- */
const STARTER_TYPES = ["grass","fire","water"];
const STARTER_TYPE_LABELS = { grass:"Pflanze", fire:"Feuer", water:"Wasser" };
const STARTER_RIVAL_GETS = { grass:"fire", fire:"water", water:"grass" };

function mainRivalBoss(){ return currentGame().bosses.find(b=>b.group==="Rivale"); }
function rivalDisplayName(){
  const boss = mainRivalBoss();
  if(!boss) return "Rivale";
  return (state.rivalNickname||"").trim() || boss.name;
}
/* Editionen mit zwei Rivalen unterschiedlichen Namens (z.B. Schwarz/Weiß: Cheren + Bell) geben den
   Typnachteil-Starter an den zweiten Rivalen statt ihn beim Professor zu lassen. */
function secondRivalDisplayName(){
  const main = mainRivalBoss();
  if(!main) return null;
  const other = currentGame().bosses.find(b=>b.group==="Rivale" && b.name!==main.name);
  return other ? other.name : null;
}
function starterNamesSet(){
  const s = state.starterNames || {};
  return STARTER_TYPES.every(t=>(s[t]||"").trim());
}
function removeStarterMon(){ state.locations = state.locations.filter(l=>!l.starter); }

function starterCardHtml(){
  const gameStarters = currentGame().starters;
  if(!gameStarters) return "";
  /* Editionen ohne echte Dreier-Starterwahl (z.B. Gelb: Pikachu ist fix vorgegeben) nutzen
     starters:{fixed,rivalGets} statt {grass,fire,water} - eigener, deutlich einfacherer Kartentyp
     mit nur einem Pokémon statt drei Auswahlknöpfen. Bleibt trotzdem ein eigener, vom
     Standort-Fang getrennter Eintrag (starter-mon), damit z.B. Alabastia weiterhin unabhängig
     für einen normalen wilden Fang (Angeln) nutzbar bleibt. */
  if(gameStarters.fixed){
    /* fixed bleibt der Edition-Standard (z.B. "Pikachu"), state.starterNames.fixed die tatsächlich
       verwendete Art - trennt beides, damit ein Randomizer-Run (andere Startart als vorgegeben)
       über den Bearbeiten-Stift überschreibbar ist, ohne die Editionsdaten selbst anzufassen. */
    const species = (state.starterNames && state.starterNames.fixed) || gameStarters.fixed;
    if(state.starterChoice){
      return `<div class="card starter-card starter-resolved">
        <div class="card-top">
          <div class="mon-line">
            ${spriteImgHtml(species, 64)}
            <div>
              <div class="loc-name">Dein Starter: ${escapeHtml(species)}</div>
              <div class="loc-sub">Kein Auswahlmenü in dieser Edition.</div>
            </div>
          </div>
          ${iconBtn("tone-neutral","undo-starter-choice",null,ICON_UNDO,"Rückgängig machen",false,true)}
        </div>
        ${gameStarters.rivalGets ? `<div class="loc-sub" style="margin-top:10px;">${escapeHtml(rivalDisplayName())} erhält: ${escapeHtml(gameStarters.rivalGets)} (kein Wahlrecht).</div>` : ""}
      </div>`;
    }
    return `<div class="card starter-card">
      <div class="card-top">
        <div><div class="loc-name">Dein Starter</div><div class="loc-sub">Kein Auswahlmenü in dieser Edition - bestätige den Fang.</div></div>
        ${iconBtn("tone-neutral","open-starter-setup",null,ICON_EDIT,"Starter bearbeiten (z.B. Randomizer)",false,true)}
      </div>
      <div class="starter-pick-row">
        <button class="starter-pick-btn" data-act="choose-starter" data-type="fixed">
          ${spriteImgHtml(species, 56)}
          <span>${escapeHtml(species)}</span>
        </button>
      </div>
    </div>`;
  }
  const names = state.starterNames || { grass:"", fire:"", water:"" };
  if(!starterNamesSet()){
    return `<div class="card starter-card">
      <div class="card-top"><div><div class="loc-name">Starterwahl</div></div></div>
      <div class="loc-sub">Trage die drei möglichen Starter dieser Edition ein.</div>
      <div class="card-actions"><button class="btn btn-primary btn-block" data-act="open-starter-setup">Starter eintragen</button></div>
    </div>`;
  }
  if(!state.starterChoice){
    const opts = STARTER_TYPES.map(t=>`
      <button class="starter-pick-btn" data-act="choose-starter" data-type="${t}">
        ${spriteImgHtml(names[t], 56)}
        <span>${escapeHtml(names[t])}</span>
        <span class="starter-type">${STARTER_TYPE_LABELS[t]}</span>
      </button>`).join("");
    return `<div class="card starter-card">
      <div class="card-top">
        <div><div class="loc-name">Starterwahl</div><div class="loc-sub">Welchen hast du gewählt?</div></div>
        ${iconBtn("tone-neutral","open-starter-setup",null,ICON_EDIT,"Starter bearbeiten",false,true)}
      </div>
      <div class="starter-pick-row">${opts}</div>
    </div>`;
  }
  const chosen = state.starterChoice;
  const rivalType = STARTER_RIVAL_GETS[chosen];
  const leftoverType = STARTER_TYPES.find(t=>t!==chosen && t!==rivalType);
  return `<div class="card starter-card starter-resolved">
    <div class="card-top">
      <div class="mon-line">
        ${spriteImgHtml(names[chosen], 64)}
        <div>
          <div class="loc-name">Dein Starter: ${escapeHtml(names[chosen])}</div>
          <div class="loc-sub">${STARTER_TYPE_LABELS[chosen]}</div>
        </div>
      </div>
      ${iconBtn("tone-neutral","undo-starter-choice",null,ICON_UNDO,"Rückgängig machen",false,true)}
    </div>
    <div class="loc-sub" style="margin-top:10px;">${escapeHtml(rivalDisplayName())} erhält: ${escapeHtml(names[rivalType])} (${STARTER_TYPE_LABELS[rivalType]})</div>
    <div class="loc-sub">${secondRivalDisplayName() ? `${escapeHtml(secondRivalDisplayName())} erhält: ${escapeHtml(names[leftoverType])} (${STARTER_TYPE_LABELS[leftoverType]})` : `${escapeHtml(names[leftoverType])} (${STARTER_TYPE_LABELS[leftoverType]}) bleibt beim Professor`}.</div>
  </div>`;
}

/* Levelcap-Regel (verbreitete Nuzlocke-Hausregel: Team darf das Level des nächsten Bosses nicht
   überschreiten) - reine Info-Anzeige, keine Markierung einzelner Team-Mitglieder, da die App das
   Level der eigenen Pokémon nirgends erfasst (nur Fangort/Status/Team-Zugehörigkeit). Bewusst nur
   an den Kämpfen ausgerichtet, die üblicherweise als Levelcap zählen - Arenaleiter, Top Vier und
   Champion - statt an jedem einzelnen Bosskampf (Rivale, Team-Bosse, optionale Nebenkämpfe wie
   Wally/Cynthia-Cameo, finales Duell). Verschwindet entsprechend nach dem Champion-Sieg wieder,
   auch wenn danach noch ein finales Duell folgt. */
function nextLevelCapBoss(){
  return currentGame().bosses.find(b=>!isBossDefeated(b.id) && typeof b.baseLevel==="number" && (/^Arenaleiter/.test(b.cls) || b.cls==="Top Vier" || b.cls==="Champ") && !bossRequiresOtherStarter(b, state.starterChoice)) || null;
}
function levelCapCardHtml(){
  const boss = nextLevelCapBoss();
  if(!boss) return "";
  return `<div class="card levelcap-card">
    <div class="card-top">
      <div>
        <div class="loc-name">Levelcap</div>
        <div class="loc-sub">${escapeHtml(boss.name)} · ${escapeHtml(boss.place)}</div>
      </div>
      <span class="chip accent">Lv. ${bossLevel(boss)}</span>
    </div>
  </div>`;
}

function typeCoverageButtonHtml(){
  return `<button class="card type-coverage-btn" type="button" data-act="open-type-coverage" title="Typabdeckung anzeigen">
    <span class="type-coverage-icon" aria-hidden="true"></span>
    <span class="type-coverage-label">Typen</span>
  </button>`;
}

/* Team-Reihenfolge: state.teamOrder hält eine Liste von Standort-IDs in gewünschter Anzeige-
   reihenfolge. Nur die aktuell im Team befindlichen IDs daraus werden verwendet (tote/abgegebene/
   entfernte IDs bleiben zwar ungenutzt im Array liegen, werden aber nirgends mehr angezeigt) -
   neu hinzugekommene Team-Mitglieder, die noch nicht in teamOrder stehen, hängen sich hinten an. */
function orderedTeamLocs(){
  const teamLocs = state.locations.filter(l=>l.mon && l.mon.inTeam && !l.mon.dead && !l.mon.given);
  const order = state.teamOrder || [];
  const byId = new Map(teamLocs.map(l=>[l.id, l]));
  const ordered = order.map(id=>byId.get(id)).filter(Boolean);
  const remaining = teamLocs.filter(l=>!order.includes(l.id));
  return ordered.concat(remaining);
}

function teamSlotHtml(loc, flash){
  const isEditingNick = editingTeamNickId === loc.id;
  const nameHtml = isEditingNick
    ? `<input class="mon-name-input" id="teamNickInline" data-id="${loc.id}" value="${escapeHtml(loc.mon.nickname||"")}" placeholder="${escapeHtml(loc.mon.species)}" maxlength="30" autocomplete="off" />`
    : `<div class="mon-name" data-act="edit-team-nick" data-id="${loc.id}">${escapeHtml(loc.mon.nickname||loc.mon.species)}</div>`;
  const typeStyle = typeGradientStyle(typesFor(loc.mon.species));
  return `<div class="slot filled" data-loc-id="${loc.id}" style="${typeStyle}">
    <button class="slot-drag-handle" data-drag-id="${loc.id}" aria-label="Ziehen zum Umsortieren" title="Ziehen zum Umsortieren">${ICON_DRAG}</button>
    <button class="slot-menu-btn" data-act="open-team-actions" data-id="${loc.id}" aria-label="Aktionen">${ICON_KEBAB}</button>
    ${monLinkHtml("slot-sprite-wrap", loc.mon.species, spriteImgHtml(loc.mon.species, 120, flash))}
    <div class="slot-info">
      ${nameHtml}
      ${loc.mon.nickname? `<div class="mon-species">${escapeHtml(loc.mon.species)}</div>`:""}
      <div class="loc-sub">${escapeHtml(loc.name)}</div>
    </div>
  </div>`;
}

/* Orden-Sammlung: fasst pro Edition alle Arenaleiter-Bosse mit badge-Feld zu ihren eindeutigen
   Orden zusammen (mehrere Bosse - z.B. das Orion-City-Trio oder Schwert/Schild-Versionswechsel -
   koennen denselben Orden teilen, siehe badge-Zuordnung an den jeweiligen *_BOSSES-Arrays) und
   zeigt sie in Ordensreihenfolge (erste Verwendung im bosses-Array) als Reihe an: erhalten sobald
   irgendeiner der zugehoerigen Bosse besiegt ist (auch bei einer als abgeschlossen gezaehlten
   Niederlage, wie beim bestehenden Sieg-Haken). */
function ordenList(){
  const g = currentGame();
  const seen = new Map();
  g.bosses.forEach(b=>{
    if(!b.badge) return;
    const earned = !!state.bossDefeated[b.id];
    if(!seen.has(b.badge)) seen.set(b.badge, earned);
    else if(earned) seen.set(b.badge, true);
  });
  return [...seen.entries()].map(([badge,earned])=>({badge,earned}));
}
