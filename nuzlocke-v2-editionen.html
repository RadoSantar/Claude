      <div class="entry-head"><span class="ver">v1.9.9</span><span class="tag tag-fix">Politur</span></div>
      <h3>Moderne Arten-Sprites: schärfer statt künstlich verpixelt</h3>
      <p>Nutzerfeedback: die seit Kalos verwendeten modernen Offizial-Artwork-Sprites wirkten unscharf/verpixelt - Ursache war eine CSS-Regel (<code>image-rendering:pixelated</code>), die eigentlich nur für den knackigen Retro-Look der alten, echten Pixel-Sprites (Gen&nbsp;1-5) gedacht war, aber versehentlich auf alle Arten-Sprites app-weit griff und damit auch das glatt gezeichnete moderne Artwork künstlich blockig skalierte. Jetzt nur noch für echte Pixel-Sprites aktiv, moderne Artworks skalieren normal weich. Zusätzlich alle 875 modernen Arten-Sprites von 80×80px-PNG auf 160×160px-WebP neu aufbereitet (deutlich mehr Bilddetail bei gleichzeitig kleinerer Dateigröße dank WebP-Kompression) - die bereits lokal vorliegenden Originalquellen aus der bisherigen Sprite-Recherche kamen dafür erneut zum Einsatz, keine neue Beschaffung nötig. Alte Gen&nbsp;1-5-Pixel-Sprites bleiben unverändert im Retro-Stil.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.8</span><span class="tag tag-feat">Feature</span></div>
      <h3>Regionalformen: die 18 Alola-Formen als eigene fangbare Arten</h3>
      <p>Direkter Folgeschritt nach Alola: Rattfratz, Sandan, Vulpix, Digda, Mauzi, Kleinstein, Sleima und ihre jeweiligen Entwicklungen sowie Raichu, Kokowei und Knogga bekommen ihre Alola-Form (z.&nbsp;B. Alola-Vulpix, Eis statt Feuer) als vollwertige, einzeln auswählbare Art samt eigenem Typ, Sprite und Entwicklungslinie - analog zum bewährten Muster der Mega-Entwicklungen. Alola-Raichu, Alola-Kokowei und Alola-Knogga entstehen als zusätzlicher Entwicklungszweig neben der regulären Form (z.&nbsp;B. Pikachu → Raichu oder Alola-Raichu), die übrigen acht haben eigene durchgehende Ketten (z.&nbsp;B. Alola-Kleinstein → Alola-Georok → Alola-Geowaz). Der Pokédex-Link folgt auf Nutzerwunsch demselben Formular-Muster wie bei Megas: Basis-Dex-Nummer plus Formular-Slug (Alola-Vulpix → <code>?pokemon=37&amp;form=vulpix-alola</code>). Die zugrundeliegende Verlinkungsfunktion wurde dabei gleich verallgemeinert, damit sich künftige Regionalformen (Galar, Hisui, Paldea) rein über neue Daten einklinken.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.7</span><span class="tag tag-feat">Feature</span></div>
      <h3>Alola: Sonne/Mond + Ultrasonne/Ultramond - erste echte Generation-7-Region</h3>
      <p>19./20. Edition, erste Region, die selbst neu für Generation 7 gebaut wurde (kein Remake wie Omega Rubin/Alpha Saphir). Statt Arenaleitern gibt es Inselprüfungen (Prüfungskapitän + Totem-Kampf) und danach je Insel eine Großprüfung gegen den Inselkönig - alle mit den tatsächlich in Gen7-Editionen verwendeten deutschen Namen (u.&nbsp;a. Ilima→Elima, Lana→Tracy, Mallow→Maho, Sophocles→Chrys, Acerola→Lola). Sonne/Mond als ein gemeinsamer Eintrag (identische Prüfungen/Top Vier/Champion Kukui in beiden Versionen), Ultrasonne/Ultramond als eigene Edition mit eigener Postgame-Kampagne "Team Rainbow Rocket" (Rückkehr früherer Team-Bosse aus Parallelwelten - Archie, Maxie, Zyrus, Flordelis, G-Cis, Showdown gegen Giovanni) sowie einem Top-Vier-Tausch (Molayne ersetzt Hala) und Minas erst dort existierender eigener Prüfung. Alle 88 neuen Alola-Arten ergänzt (Dex #722-809) inkl. Typen und Entwicklungslinien, dazu 22 neue Trainer-Sprites im Pokémon-Masters-EX-Chibi-Stil. Nebenbei auf Nutzerwunsch: der Pokédex-Link einer gefangenen Mega-Entwicklung springt jetzt direkt zum passenden Mega-Formular-Eintrag (z.&nbsp;B. Mega-Garados → <code>?pokemon=130&amp;form=gyarados-mega</code>) statt nur zur Basis-Art.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.6</span><span class="tag tag-feat">Feature</span></div>
      <h3>Omega Rubin / Alpha Saphir - erste Schritte Richtung v2.0 (volle Gen 1-9)</h3>
      <p>17./18. Edition, zweite in Generation 6: das 3DS-Remake von Rubin/Saphir, weiterhin als zwei eigenständige Editionen (Team Magma in Omega Rubin, Team Aqua in Alpha Saphir - dieselbe Aufteilung wie im Original). Champion bleibt Steven, nicht Wallace (anders als Smaragd). Level durchgehend gegen ORAS-spezifische Werte aktualisiert (meist niedriger als das Original), dazu die von ORAS eingeführte Umstrukturierung der Team-Magma/-Aqua-Vorstandskämpfe (u.&nbsp;a. ein zusätzliches frühes Trio-Antreffen an den Meteorfällen, das im Original nicht existierte). Neu gegenüber dem Original: ein fünfter, optionaler Rivalenkampf im Postgame (Mega-entwickelter Starter) sowie ein Delta-Episode-Kampf - beide an eigens angehängten Postgame-Standorten, damit sie nicht fälschlich ganz oben in der Routen-Liste erscheinen. Route/Standort-Daten größtenteils von den bestehenden Rubin/Saphir-Editionen übernommen (ORAS ändert an der Hoenn-Karte selbst nichts), neue Arten gibt es als reines Remake ebenfalls keine. Wie Kalos nutzt ORAS ab jetzt den modernen Sprite-Stil (Pokémon-Masters-EX-Chibi für Trainer) - mit einer Ausnahme: Wattson hat als einziger Hoenn-Arenaleiter keinen Auftritt in Pokémon Masters EX, hier kam stattdessen offizielles ORAS-Artwork zum Einsatz.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.5</span><span class="tag tag-fix">Korrektur</span></div>
      <h3>Hoenn: Rivale jetzt auch geschlechtsabhängig (Brix/Maike)</h3>
      <p>Nutzerfrage aufgedeckt, dass Rubin/Saphir/Smaragd denselben geschlechtsabhängigen Rivalen-Mechanismus wie Kalos haben (siehe v1.9.3), dort aber der Rivale bisher hart auf „Maike" kodiert war, ohne Geschlechtswahl - stichprobenartig gegen alle anderen Editionen mit Geschlechtswahl geprüft (Kristall, HG/SS, FeuerRot/BlattGrün, Diamant-Perl/Platin, Schwarz/Weiß): dort bleibt der Rivale tatsächlich immer gleich, nur Hoenn und Kalos haben den Wechsel-Mechanismus. Jetzt nachgerüstet - der bereits für Kalos gebaute, wiederverwendbare Mechanismus (nameByGender/spriteByGender, zentral in currentGame() aufgelöst) kam dafür unverändert zum Einsatz, nur die passenden deutschen Namen (Brix/Maike) und ein neu recherchierter Sprite für Brix im bestehenden Emerald-Pixel-Stil kamen dazu.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.4</span><span class="tag tag-feat">Feature</span></div>
      <h3>Mega-Entwicklungen als eigene fangbare Arten</h3>
      <p>Alle 48 echten, offiziellen Mega-Entwicklungen (Kalos/ORAS-Ära) als eigene Arten ergänzt - nicht als Battle-Mechanik, sondern weil ein Randomizer ein bereits dauerhaft mega-entwickeltes Wildpokémon erzeugen kann, das sich nach dem Kampf nicht zurückverwandelt und deshalb als eigene fangbare Art loggbar sein muss. Typen einzeln recherchiert statt von der Basisform übernommen, da viele Megas ihren Typ ändern (z.&nbsp;B. Mega-Glurak X wird Feuer/Drache statt Feuer/Flug, Mega-Stolloss verliert seine Gestein-Resistenz komplett). Der externe Pokédex-Link verweist bei Megas sinnvollerweise auf den Eintrag der Basis-Art, da sie selbst keine eigene Pokédex-Nummer haben. Bewusst keine Verknüpfung im normalen Entwickeln-Menü - eine Mega-Entwicklung "erspielt" man sich hier nicht, man fängt sie fertig vor. Kleiner Bugfix nebenbei: Arten ohne alten Pixel-Sprite (Kalos-Arten, jetzt auch Megas) zeigen jetzt auch in Gen1-5-Editionen einen Sprite (Fallback auf den modernen Stil), statt bei einem entsprechenden Randomizer-Fang leer zu bleiben.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.3</span><span class="tag tag-feat">Feature</span></div>
      <h3>Kalos (X/Y) - erste Generation-6-Edition</h3>
      <p>15. Edition, erste außerhalb Generation 1-5: X und Y als ein gemeinsamer Eintrag (identische Arenaleiter/Top Vier/Champion/Team Flare in beiden Versionen, wie schon bei Rot/Blau oder HG/SS). Neue Geschlechtswahl der Spielfigur zu Rundenbeginn (Calem/Kalem oder Serena) - der Rivale ist automatisch die jeweils andere Figur, inklusive eigenem Name/Sprite an jeder Stelle (Routen-Karte, Bosskampf, Ereignis-Log, Rivalenduell). 8 Arenaleiter, Team Flare um Flordelis (Lysandre), Top Vier und Champion Diantha, alle mit den in Gen6-Editionen tatsächlich verwendeten deutschen Namen (u.&nbsp;a. Grant→Lino, Korrina→Connie, Malva→Pachira - teils deutlich anders als die englischen Originalnamen). Alle 72 neuen Kalos-Arten ergänzt (Dex #650-721) inkl. Typen und Entwicklungslinien. Ab dieser Edition greift automatisch der Fee-Typ (siehe v1.9.2) sowie ein neuer, einheitlicher Sprite-Stil (Pokémon-Masters-EX-Chibi für Trainer, offizielles Artwork für alle Pokémon-Arten - auch für altbekannte Gen1-5-Arten, damit in Kalos gefangene Pokémon nicht wie ein Stilbruch neben den neuen Arten wirken).</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.2</span><span class="tag tag-note">Vorbereitung</span></div>
      <h3>Generationsabhängige Typen als Basis für Generation 6+</h3>
      <p>Erster Baustein, um die App künftig auf Kalos und weitere Editionen ab Generation 6 zu erweitern: der Fee-Typ (eingeführt in Generation 6) wird jetzt korrekt nur für Editionen ab Generation 6 angewendet - die betroffenen ~20 Arten (u.&nbsp;a. Fluffeluff, Pixi, Marill, Togepi, Ralts/Kirlia/Guardevoir, Flunkifer) behalten in allen 14 bestehenden Gen1-5-Editionen exakt ihre damaligen, historisch korrekten Typen. Auch die Typ-Effektivitätstabelle (u.&nbsp;a. für die Typabdeckungs-Analyse) ist jetzt generationsabhängig, inklusive der alten Stahl-Resistenz gegen Geist/Unlicht, die erst mit Fee entfernt wurde. Rein intern, ohne sichtbare Änderung für bestehende Runs.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.1</span><span class="tag tag-feat">Feature</span></div>
      <h3>17 neue Typ-Sammel-Erfolge</h3>
      <p>Ein Erfolg pro Typ (Generation 1-5, kein Fee): 10 gefangene Pokémon eines Typs schalten einen thematischen Erfolg samt Titel frei - u.&nbsp;a. „Grounded" / „Landratte" (Boden), „Über den Wolken" / „Flieger-Ass" (Flug), „Schwimmer" / „Seepferdchen" (Wasser), „Fels in der Brandung" / „Geröllheimer" (Gestein), „Nachtschicht" / „Geisterjäger" (Geist) und zwölf weitere. Zählt die komplette Fang-Historie des Runs (unabhängig davon, ob das Pokémon noch lebt, im Team, in der Box oder abgegeben ist), Dual-Typen zählen für beide Typen mit - dieselbe Zählweise wie beim bestehenden Regenbogen-Team-Erfolg.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.0</span><span class="tag tag-feat">Feature</span></div>
      <h3>Tour-Feinschliff, animierte Demo-Sequenz, Team-Historie-Fix</h3>
      <p>Feedback zur neuen Tour (v1.8.68) umgesetzt: Der Wechsel zur nächsten Station blendet jetzt sanft aus und wieder ein statt hart zu springen. Die Fangen-Demo zeigt außerdem einen kompletten, animierten Ablauf statt nur eines einzelnen Hinweises: „Gefangen" → „Stirbt" → „Auf die Bank", weiterhin rein visuell simuliert ohne echten Zugriff auf den Spielstand. Dazu ein Bugfix: stirbt ein Team-Pokémon (egal ob im Bosskampf oder außerhalb), taucht das jetzt auch als „verließ das Team" in der Team-Rotation-Historie auf - bisher fehlte dieser Eintrag dort komplett, obwohl das Pokémon das Team ja tatsächlich verlässt.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.68</span><span class="tag tag-feat">Feature</span></div>
      <h3>Erste-Schritte-Tour überarbeitet: aktiv statt nur Info-Karten</h3>
      <p>Die bisherige 5-Seiten-Info-Tour (v1.8.33) war zu abstrakt - jetzt navigiert die Tour wirklich durch die echte Oberfläche: sie schaltet zwischen Routen-, Team- und Einstellungen-Tab um und hebt das jeweils erklärte Element per Spotlight hervor, statt nur davon zu erzählen. Beim Fangen-Schritt läuft zusätzlich eine simulierte Mini-Demo (Tap-Animation + kurze Einblendung) - bewusst rein visuell und ohne echten Zugriff auf den Spielstand, damit nie versehentlich echter Fortschritt eingetragen wird. Die Fortschrittsanzeige nutzt jetzt dieselben Tab-Icons wie die echte Tab-Leiste statt bloßer Punkte. Neu daneben: eine zweite, durchsuchbare „Ausführliche Tour" unter Einstellungen → Werkzeuge mit Detail-Erklärungen zu jedem Thema zum Nachschlagen, plus fünf neue „?"-Kontexthinweise direkt an den entsprechenden Stellen (Cloud-Sync, Duo-Vergleich, Soul-Link, Regelwerk-Checkliste, Schlüsselitems/VMs) - dieselbe Inhaltsquelle wie die Themen-Übersicht, nichts doppelt gepflegt.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.67</span><span class="tag tag-fix">Korrektur</span></div>
      <h3>Falsche VM-Namen in der Schlüsselitem-Checkliste korrigiert</h3>
      <p>Drei VM-Namen in der Fortschrittscheckliste (siehe v1.8.60) waren falsch übersetzt bzw. verwechselt, gegen PokéWiki geprüft: „Strudel" → korrekt <strong>Whirlpool</strong> (offizieller deutscher Name, kein deutsches Wort), „Wasserfall" → korrekt <strong>Kaskade</strong>, „Blitzschlag" → korrekt <strong>Blitz</strong> (Blitzschlag ist eine andere, eigenständige Attacke aus Gen 5). Betrifft alle Editionen, die diese drei VMs führen.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.66</span><span class="tag tag-fix">Korrektur</span></div>
      <h3>Soul-Link funktioniert jetzt auch zwischen Partnerversionen</h3>
      <p>Der Soul-Link-Modus (v1.8.65) verlangte bisher fälschlich exakt dieselbe Edition auf beiden Seiten - dabei sind Standort-IDs rein textbasiert (Region+Name) und damit unabhängig von der Editions-ID: Partnerversionen wie Schwarz/Weiß, Rubin/Saphir, Gold/Silber+Kristall oder Rot/Blau+Gelb teilen sich intern ohnehin denselben Standort-Datensatz (Diamant/Perl+Platin zu 81 von 83 Standorten). Genau das ist der klassische Soul-Link-Fall - zwei verschiedene, aber routenidentische Versionen gemeinsam spielen. Der Abgleich matcht jetzt einfach über gemeinsame Standort-IDs, unabhängig von der Editions-ID; nur bei wirklich unterschiedlichen Editionen (z.&nbsp;B. Kanto vs. Johto) gibt es weiterhin einen klaren Hinweis statt eines kaputten Vergleichs.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.65</span><span class="tag tag-feat">Feature</span></div>
      <h3>Soul-Link-Modus</h3>
      <p>Neuer Schalter „Soul-Link-Modus" in der Duo-Vergleich-Karte: koppelt eure Encounter 1:1 pro Standort (setzt dieselbe Edition wie der Partner voraus, da die Kopplung über die Standort-ID läuft). Stirbt dein Pokémon irgendwo, kommt ein Hinweis, falls das Partner-Pokémon an derselben Stelle laut letztem Abgleich noch lebt - und umgekehrt taucht der Fall als Diskrepanz in der Duo-Vergleichsansicht auf. Bewusst rein informativ: aus denselben Sicherheitsgründen wie beim Duo-Vergleich selbst (nur Lesezugriff über den Cloud-Sync-Code) schreibt die App nie in den Spielstand der Partner-Person - das eigentliche Aufgeben muss jede Seite selbst auf dem eigenen Gerät vornehmen.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.64</span><span class="tag tag-feat">Feature</span></div>
      <h3>Duo-Vergleichsansicht</h3>
      <p>Neue Karte „Duo-Vergleich" unter „Spielstände": den Cloud-Sync-Code einer anderen Person eintragen, um den eigenen Fortschritt (Gesamtabschluss, Überlebensrate, besiegte Bosse) direkt neben ihrem zu sehen - rein lesend über den bestehenden Cloud-Sync-Mechanismus, ohne die eigene Sync-Verknüpfung zu berühren oder den fremden Spielstand zu verändern. Außerdem: die geplanten editionsübergreifenden Erfolge „Weltenbummler" und „Auferstanden" wieder aus dem Backlog gestrichen - auf Wunsch bewusst kein Fokus auf Cross-Save-Erfolge, sondern auf Erfolge pro einzelnem Run/Edition.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.63</span><span class="tag tag-fix">Zurückgenommen</span></div>
      <h3>Fangmethode-Icons wieder entfernt</h3>
      <p>Die in v1.8.62 hinzugefügten Fangmethode-Icons (Angeln, Surfen, Zertrümmerer, Kopfnuss-Bäume, Tauchen, Klettern) auf den Standort-Kacheln wurden auf Wunsch wieder entfernt - optisch nicht überzeugend. Die anderen drei Punkte aus derselben Version (PWA-Schnellzugriffe, Regenbogen-Team-Erfolg, Regelwerk-Checkliste) bleiben unverändert bestehen.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.62</span><span class="tag tag-feat">Feature</span></div>
      <h3>PWA-Schnellzugriffe, Fangmethode-Icons, Regenbogen-Team, Regelwerk-Checkliste</h3>
      <p><strong>PWA-Schnellzugriffe:</strong> per Rechtsklick/Lang-Drücken auf das Home-Bildschirm-Icon direkt „Fangen" oder „Team" öffnen, ohne erst die App zu starten und zu navigieren.</p>
      <p><strong>Fangmethode-Icons:</strong> Standort-Kacheln zeigen jetzt kleine Icons für die dort nötige Fangmethode (Angeln, Surfen, Zertrümmerer, Kopfnuss-Bäume, Tauchen, Klettern) - per Stichwort aus der ohnehin vorhandenen Standort-Notiz erkannt, kein neues, separat gepflegtes Datenfeld. Deckt deshalb nur ab, was die Notiz auch tatsächlich erwähnt.</p>
      <p><strong>Regenbogen-Team-Erfolg:</strong> neuer Erfolg für 6 verschiedene Typen gleichzeitig im Team, nutzt die seit v1.8.54 vorhandene Arten→Typ-Tabelle.</p>
      <p><strong>Regelwerk-Checkliste:</strong> neue Karte unter Einstellungen → Regeln mit den üblichen Nuzlocke-Hausregeln (Set-Modus, Species-Klausel, keine Items im Kampf, Level-Cap je Bosskampf) zum An-/Abhaken - rein zur Dokumentation, ohne Auswirkung auf die App-Logik (im Unterschied zu Dupes-Clause-Warnung und Level-Cap-Berechnung, die eigene, tatsächlich wirksame Einstellungen bleiben).</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.61</span><span class="tag tag-fix">Fix</span></div>
      <h3>Überlappende Überschriften in den Einstellungen</h3>
      <p>Beim Scrollen durch die Einstellungen blieben mehrere Abschnittsüberschriften gleichzeitig oben kleben (alle nutzten dieselbe "sticky"-Positionierung wie die Regionsüberschriften in der Routen-Liste) und überlagerten sich dadurch unleserlich. Die Routen-Liste profitiert vom Stehenbleiben der Regionsüberschrift beim Scrollen (wenige, lange Abschnitte) - in den Einstellungen mit vielen kurzen, einklappbaren Gruppen bringt das dagegen nichts außer dem Überlappungs-Bug. Sticky-Verhalten deshalb gezielt nur für die Einstellungen deaktiviert.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.60</span><span class="tag tag-feat">Feature</span></div>
      <h3>Schlüsselitems-Checkliste, Region-Ausblenden-Hinweis, „Fast geschafft"</h3>
      <p><strong>Schlüsselitems/VMs-Checkliste:</strong> neue Übersicht unter „Werkzeuge" listet die VMs der aktuellen Edition zum Abhaken - zeigt auf einen Blick, welche Hindernisse (Surfer, Zerschneider, Stärke, …) schon freigeschaltet sind. Editionsspezifisch hinterlegt, da sich das VM-Set je nach Spiel-Engine unterscheidet.</p>
      <p><strong>Proaktiver Hinweis „Region jetzt ausblenden?":</strong> sobald der letzte offene Standort einer Region eingetragen wird (Fang oder Kein Fang), fragt die App direkt, ob die jetzt komplette Region über die bestehende Ausblenden-Funktion aus der Routen-Liste genommen werden soll - statt das nur passiv in den Einstellungen anzubieten.</p>
      <p><strong>„Fast geschafft"-Hervorhebung:</strong> sind insgesamt (Standorte + Bosse zusammen) nur noch 1-3 offene Kacheln übrig, werden genau diese mit einem goldenen Rahmen und Hinweis-Chip hervorgehoben - kleiner Motivations-Kick kurz vor 100%.</p>
      <p><strong>Backlog aufgeräumt:</strong> „✓ abgeschlossen"-Badge im Regions-Header, Meilenstein-Feedback bei 25/50/75% und Sound-Feedback als Verworfen markiert - in Kombination mit den drei neuen Punkten hier wäre das an optischem/akustischem Feedback zu viel geworden. Das plattformübergreifende Speichersystem ist nachträglich als umgesetzt vermerkt (Cloud-Sync, siehe v1.8.56–1.8.59 oben).</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.59</span><span class="tag tag-feat">Feature</span></div>
      <h3>Cloud-Sync: Kopieren, Teilen, Verknüpfungslink, Konflikt-Vergleich</h3>
      <p>Der Sync-Code muss nicht mehr abgetippt werden: „Kopieren" legt ihn in die Zwischenablage, „Teilen" öffnet (wo verfügbar) das native Teilen-Menü des Geräts. Geteilt wird dabei auch ein Link, der beim Öffnen auf einem anderen Gerät das Code-Feld automatisch vorausfüllt - verknüpft wird trotzdem erst nach expliziter Bestätigung, nie automatisch beim bloßen Öffnen des Links. Der Konflikt-Dialog bei unterschiedlichen Ständen zeigt jetzt zusätzlich zum Zeitstempel eine grobe Kennzahl je Version (gefangen/gestorben/Bosse besiegt), um die Entscheidung zu erleichtern.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.58</span><span class="tag tag-feat">Feature</span></div>
      <h3>Anzeigename in Cloud-Sync integriert</h3>
      <p>Das Namensfeld aus v1.8.57 sitzt jetzt direkt in der Cloud-Sync-Karte statt separat bei „Mehrere Runs" - Name und Geräte-Abgleich gehören inhaltlich zusammen. Die Buttons heißen jetzt „Sync aktivieren" und „Code eines anderen Geräts eingeben" statt „Sync-Code erzeugen"/„Code eingeben", der zum Verknüpfen nötige Code bleibt dabei sichtbar (auch nachträglich in der Karte, nicht nur einmalig im Erfolgs-Sheet). Bewusst weiterhin ein separater Code statt des Namens selbst als Sync-Schlüssel: ein frei wählbarer Name wäre erratbar bzw. es könnten zwei Personen zufällig denselben wählen und sich so gegenseitig den Spielstand überschreiben - der Name bleibt rein lokale Kosmetik, der Code bleibt das eigentliche, unerratbare Sync-Geheimnis im Hintergrund.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.57</span><span class="tag tag-feat">Feature</span></div>
      <h3>Globaler Anzeigename im Header</h3>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.25</span><span class="tag tag-fix">Fix</span></div>
      <h3>iOS-Viewport-Lücke: viewport-fit=cover entfernt (v1.8.24 reichte noch nicht)</h3>
      <p>Nutzer-Feedback: die Lücke war auch nach v1.8.24 auf dem iPhone 17 Pro noch da. Vergleich mit einer anderen, dort einwandfrei skalierenden installierten Web-App des Nutzers zeigte den entscheidenden Unterschied: deren Seite nutzt gar kein <code>viewport-fit=cover</code> und dementsprechend auch kein einziges <code>env(safe-area-inset-*)</code> in ihrem CSS. Diese App hatte <code>viewport-fit=cover</code> gesetzt, um Inhalte bis an die Bildschirmkanten (unter Notch/Dynamic Island/Home-Indicator) zu zeichnen - genau der Modus, in dem Safaris dvh/vh-Berechnung nachweislich am unzuverlässigsten ist.</p>
      <p><code>viewport-fit=cover</code> aus dem Viewport-Meta-Tag entfernt: Safari begrenzt den Viewport dadurch automatisch auf den sicheren Bereich, ganz ohne manuelle <code>safe-area-inset</code>-Berechnung nötig. Die bestehenden <code>env(safe-area-inset-*)</code>-Aufrufe in Kopf-/Fußleiste bleiben unschädlich im Code stehen (lösen ohne Cover-Modus einfach zu 0 auf), müssen aber nicht entfernt werden.</p>
      <p>Wichtiger Hinweis: dieser Fix ließ sich in der Sandbox nicht gegen echtes Safari/iOS-Verhalten testen (Chromium bildet <code>viewport-fit</code>/<code>env(safe-area-inset-*)</code> nicht identisch nach). Update: auf dem echten iPhone 17 Pro bestätigt - die Lücke ist weg.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.24</span><span class="tag tag-fix">Fix</span></div>
      <h3>iOS-Viewport-Lücke robuster gefixt (Safari-spezifisch, v1.8.20 reichte nicht)</h3>
      <p>Nutzer-Feedback: die in v1.8.20 gefixte Lücke zwischen Tab-Bar und Bildschirmrand trat auf einem iPhone 17 Pro weiterhin auf - sowohl im Browser als auch in der installierten App, und nur in Safari, nicht in Chrome (das auf iOS ebenfalls WebKit nutzt, aber ein anderes Browser-Chrome/eigene Viewport-Meldung hat). Das bestätigt: die Ursache liegt in Safaris eigenen, seit Jahren dokumentierten Ungenauigkeiten bei vh/dvh/visualViewport-Höhenberechnung - der JS-Messungs-Fix aus v1.8.20 (<code>window.visualViewport.height</code>) hing am Ende genau von der gleichen unzuverlässigen Quelle ab und konnte die Lücke deshalb nicht zuverlässig schließen.</p>
      <p>Robusterer Ansatz: <code>.app</code> nutzt jetzt <code>position:fixed; inset:0</code> statt <code>height:100dvh</code> - verankert alle vier Kanten direkt am tatsächlichen Viewport, unabhängig von jeder Höhen-Berechnung/-Messung. Das jetzt überflüssige JS (<code>--app-height</code>, Resize-/Orientation-/visualViewport-Listener) entfernt.</p>
    </div>

      <h3>Fabrizierten FRLG-Boss „Ingo" entfernt, mehrere Level-/Ortsfehler korrigiert</h3>
      <p>FeuerRot/BlattGrün hatte einen kompletten erfundenen Bosskampf: „Ingo" im Punktloch (Dotted Hole) existiert in FRLG nicht - der reale Charakter dort (Gideon) kämpft gar nicht, sondern gibt nur eines von zwei Passwörtern fürs Rocket-Lager. Boss entfernt, Notizen korrigiert. Das Punktloch selbst war zusätzlich der falschen Insel zugeordnet (Eiland Sieben statt Eiland Sechs) - gegengeprüft per Bulbapedia.</p>
      <p>HG/SS: Rockos Ass beim Kanto-Postgame-Rückkampf war Amoroso (Omastar, Lv.&nbsp;53) angegeben, obwohl sein tatsächlich stärkstes Pokémon Onix (Lv.&nbsp;54) ist. Der erste Rivalenkampf zeigte „Route 29" als Ort, findet aber am Ortseingang von Rosalia City statt (in Gold/Silber/Kristall bereits korrekt so hinterlegt).</p>
      <p>Diamant/Perl: Champion Cynthias und Herbaros (Aaron) Ass-Level waren zu niedrig angegeben (Cynthia 62→66, Herbaro 53→57) - gegen Bulbapedia verifiziert. Da Platins entsprechende Overrides ursprünglich auf der Annahme „Platin ist immer höher" beruhten, diese mit den jetzt korrigierten DP-Werten abgeglichen: Platins Cynthia-Kampf ist tatsächlich <em>niedriger</em> als in Diamant/Perl (Lv.&nbsp;62, andere Teamzusammensetzung), Herbaro identisch zur korrigierten DP-Basis (Lv.&nbsp;53).</p>
      <p>Ausgangspunkt: eine breite Recherche-Prüfung über alle 14 Editionen hinweg (Level, Namen, Übersetzungen). Weitere Funde (u.&nbsp;a. eine fehlende Arena in Schwarz 2/Weiß 2) werden noch geprüft, bevor sie umgesetzt werden.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.8.15</span><span class="tag tag-fix">Fix</span></div>
      <h3>Android-Touch-Fix für Sheet-Drag, Absicherung gegen Speicher-Fehler</h3>
      <p>Der Ziehgriff der Sheets (swipe-to-dismiss, seit v1.8.10) hatte kein <code>touch-action</code> gesetzt - auf Android Chrome konnte das dazu führen, dass der Browser parallel zur eigenen Drag-Logik sein natives Scroll-Gesten-Handling startet (ruckeliges Doppel-Scrollen). Jetzt <code>touch-action:none</code> auf dem Ziehgriff, damit die App die Geste komplett selbst steuert.</p>
      <p>Zusätzlich: die beiden zentralen Speicher-Schreibfunktionen fangen jetzt Fehler von <code>localStorage.setItem</code> ab, statt bei vollem/gesperrtem Speicher mit einer unbehandelten Exception mitten im Fang-/Speicher-Flow abzustürzen.</p>
    </div>

      <p>Der Berg mit Team Magmas erstem Versteck heißt in der deutschen Lokalisierung „Schlotberg" (Mt. Chimney), nicht „Feuerberg" (ein unverwandter Mystery-Dungeon-Ort) - falscher Name in Smaragd und Rubin/Saphir korrigiert, gegengeprüft per PokéWiki.</p>
      <p>Team Magmas 2. Begegnung (Marc/Kalle) war an Route 124 gehängt statt an ihr eigentliches Versteck bei Steilpass, die 3. Begegnung an Route 126 statt ans Raumfahrtzentrum bei Moosbach City - nach Spielkenntnis-Korrektur jetzt an die richtige Location gehängt (Smaragd).</p>

      <p>Dabei zusätzlich gefunden: Hartwig (Chuck) und Jasmin hatten in Gold/Silber/Kristall vertauschte Standort-Angaben (Chuck zeigte „Anemonia City" statt Oliviana City, Jasmin umgekehrt) - an HG/SS als Referenz angeglichen.</p>
      <p>Diamant/Perl/Platin: Veit (Roark), Lamina (Fantina), Frida (Candice) und Zyrus' erste Konfrontation waren ebenfalls an die vorgelagerte Route statt an Erzelingen/Herzhofen/Blizzach/Schleiede gehängt.</p>
      <p>Smaragd: Ben &amp; Svenja (Tate &amp; Liza) und Juan waren an Route 126/128 gehängt statt an Moosbach City/Xeneroville. Rubin/Saphir: Wassili (Wallace) ebenso an Xeneroville statt Route 128.</p>

      <p>Dieselbe Bugklasse wie bei Wibke (v1.8.11) betraf in Smaragd/Rubin/Saphir auch Felizia (Roxanne), Kamillo (Brawly), Walter (Wattson) und Flavia (Flannery) - alle an die ihrer Stadt vorgelagerte Route/Location gehängt statt an die Stadt selbst. Jetzt direkt an Metarost City, Faustauhaven, Malvenfroh City bzw. Bad Lavastadt verortet. Normans Kampf bei Steilpass bewusst unverändert gelassen - der spiegelt ein echtes Story-Gate wider (Rückkehr nach Blütenburg City erst später im Spiel möglich).</p>
      <p>Die Editionswahl bei „Neuer Spielstand" sortierte innerhalb einer Generation nach technischer Einfügereihenfolge statt nach echtem Erscheinungsjahr - ab Generation 3 dadurch durcheinander (z.&nbsp;B. Smaragd vor Rubin/Saphir). Jede Edition bekommt jetzt ein explizites Erscheinungsjahr-Feld für korrekte chronologische Sortierung innerhalb jeder Generation.</p>

      <p>Der Ziehgriff oben an jedem Sheet sah bisher aus wie ein Zieh-Handle, tat aber nichts - Schließen ging nur über Backdrop-Tap oder einen expliziten Button. Jetzt generisch für JEDES Sheet nachgerüstet, da alle über dieselbe <code>openSheet()</code>-Funktion laufen: Editionswahl, Spielstände-Verwaltung, Verlauf, Run-Rückblick, Fangen-Formular usw. eingeschlossen. Zieht man weit oder schnell genug, schließt das Sheet mit Restanimation; sonst schnappt es sauber zurück.</p>

      <p><code>finalStoryBoss()</code> suchte per exaktem String-Vergleich nach der ID „duel-final", um den letzten regulären Boss vor dem Abschluss zu finden. Editionen aus der Versions-Trio-Fabrik (Diamant/Perl/Platin, Rubin/Saphir, Schwarz/Weiß) hängen aber ein <code>{versionId}-</code>-Präfix an JEDE Boss-ID an, auch an „duel-final" selbst (z.&nbsp;B. „schwarz-duel-final") - der exakte Vergleich fand dort also nie einen Treffer, wodurch der in v1.8.3 eingeführte Champion-Screen in genau diesen sechs Editionen nie ausgelöst wurde (nur in den nicht über die Fabrik erzeugten Editionen wie Gelb funktionierte er). Jetzt per <code>endsWith()</code> geprüft, das beide Fälle abdeckt.</p>
      <p>Gefunden durch einen Report: Champion-Sieg in Schwarz (Lauro) zeigte nichts an, derselbe Test in Gelb funktionierte - genau der Unterschied zwischen Fabrik- und Einzeleditionen.</p>

  <div class="followups" id="offene-punkte">
    <h2>Offene Punkte, Ideen &amp; Optimierungen</h2>
    <div class="followup-item"><span class="tag tag-note" style="margin-right:8px;">Offen</span><strong>Postgame-Ausblenden erfasst nicht alle Postgame-Inhalte (Nutzerfeedback v1.9.46).</strong> Der Schalter „Postgame-Inhalte ausblenden" filtert nur ganze Standort-Kacheln anhand des <code>note</code>-Texts nach dem Wort „Postgame" - hängt ein Bosskampf per <code>bossAfter</code> an einem Standort, der selbst nicht als Postgame erkannt wird (z.&nbsp;B. weil er bewusst an einen bestehenden, auch nicht-Postgame-Standort gehängt wurde), bleibt der Bosskampf trotz aktiviertem Schalter sichtbar. Bestätigte Fälle: Bells und Cherens Rückkämpfe in Schwarz/Weiß (hängen an Avenitia/Siegesstraße, deren Notiztext das Wort „Postgame" nicht enthält), Rot am Silberberg in Gold/Silber/Kristall/HG/SS, Blaus Rückkampf nach den Sevii-Inseln in Feuerrot/Blattgrün sowie strukturell die komplette Region Galar (deren Standortliste als einzige gar keine <code>note</code>-Felder hat, siehe „Offene Datenkorrekturen" unten). Sauberer Fix bräuchte eine Postgame-Markierung direkt am Bosseintrag statt nur eine Texterkennung am Standort, damit einzelne Bosskacheln unabhängig vom Rest des Standorts ausgeblendet werden können.</div>
    <div class="followup-item"><span class="tag tag-note" style="margin-right:8px;">Offen</span><strong>Standorte automatisch einklappen, bis ihre Fang-Voraussetzung erfüllt ist.</strong> Seit v1.9.46 lassen sich noch offene Standorte manuell einklappen (siehe Eintrag oben) - das setzt aber eigenes Wissen voraus, welche Orte betroffen sind. Eine automatische Variante würde pro Standort strukturiert hinterlegen, welches Schlüsselitem/welche VM nötig ist (statt wie bisher nur als Fließtext in der Notiz), und mit der bereits bestehenden VM-Checkliste (<code>state.keyItemsChecked</code>) abgleichen: Standort automatisch eingeklappt, bis das Item angehakt ist, dann automatisch wieder sichtbar. Bräuchte eine eigene Recherche-/Dateneingaberunde über alle 23 Editionen hinweg, kein reiner Code-Fix.</div>
    <div class="followup-item"><span class="tag tag-note" style="margin-right:8px;">Offen</span><strong>Weitere Touchscreen-Bedienbarkeits-Ideen (Nutzerfeedback v1.9.46).</strong> Sammlung noch nicht umgesetzter Ideen aus derselben Rückmeldungsrunde wie die beiden Punkte oben: Mindest-Tapfläche von 44×44px auf allen Icon-Buttons durchsetzen (einige, z.&nbsp;B. das Kontextmenü-Icon in Team/Box, sind aktuell kleiner); sichtbare Tap-Zustände (Farb-/Schattenänderung, nicht nur Transform/Opacity) konsequent auf alle klickbaren Flächen ausweiten; Long-Press-Bestätigung für destruktive Aktionen dort ergänzen, wo sie noch fehlt (analog zu „Sieg zurücknehmen" seit v1.8.53); ein sichtbarer Erstnutzer-Hinweis auf die Swipe-Navigation zwischen Tabs, da Swipe-Only-Gesten sonst leicht unentdeckt bleiben.</div>
    <div class="followup-item"><span class="tag tag-feat" style="margin-right:8px;">Umgesetzt</span><strong>Plattformübergreifendes Speichersystem.</strong> Spielstände liegen bisher rein lokal (<code>localStorage</code>) im jeweiligen Browser/Gerät — der einzige Weg zwischen Geräten zu wechseln ist der manuelle JSON-Export/Import. Ein echter Sync (z.B. Konto-basiert oder über einen eigenen Cloud-Speicher) würde Spielstände automatisch zwischen Handy, Tablet und Desktop aktuell halten. → umgesetzt in v1.8.56–1.8.59 als Cloud-Sync über Supabase (Sync-Code statt Konto/Login)</div>
    <div class="followup-item"><span class="tag tag-feat" style="margin-right:8px;">Umgesetzt</span><strong>Achievement-System mit verliehenen Titeln.</strong> Für bestimmte Situationen/Meilensteine im Run Achievements freischalten, die einen Titel verleihen — z.&nbsp;B. „Legenden-Trainer" bei 3 Legendären gleichzeitig im Team, „Champ" nach Championsieg. Weitere Ideen für Auslöser/Titel noch offen. → umgesetzt in v1.8.34 mit 10 Erfolgen/Titeln als erste Runde (u.&nbsp;a. Teamvoll, Ironman, fehlerfreier Champion-Sieg, Solo-Modus, Dupes-Regelbruch) - weitere Erfolge (z.&nbsp;B. Legenden-Trainer, editionsübergreifende) können jederzeit ergänzt werden.</div>
    <div class="followup-item"><span class="tag tag-feat" style="margin-right:8px;">Umgesetzt</span><strong>Run-Rückblick ausbauen: erzählte Zusammenfassung + kleine Analyse.</strong> Statt nur Kennzahlen eine spannend geschriebene Zusammenfassung des Abenteuers anhand von Kennzahlen/Verlauf generieren, dazu kleine Analyse-Einsichten (z.&nbsp;B. „hauptsächlich Wasser-Pokémon im Team", auffällige Typverteilung, Fang-/Todesserien o.&nbsp;Ä.). → umgesetzt in v1.8.51 (Fließtext-Zusammenfassung + Analyse-Punkte zu Fangserie, härtestem Gegner, Erfolgen und ignorierten Dupes-Warnungen; Typverteilung bewusst ausgelassen, da dafür eine komplette Arten→Typ-Referenztabelle fehlt - siehe „Typabdeckungs-Analyse fürs Team" weiter unten)</div>

/* Übersprungene Standorte: gleiche Sichtbarkeits-Filter wie die Routen-Liste selbst (ausgeblendete
   Regionen, Postgame-Ausblendung), damit die Übersicht nur Standorte zeigt, die aktuell auch
   wirklich in der Routen-Liste auftauchen würden. */
function pendingLocationsList(){
  return state.locations.filter(l=>
    l.status==="pending" && !l.noCatch &&
    !(state.hiddenRegions||[]).includes(l.region) &&
    !(state.hidePostgame && /Postgame/.test(l.note||""))
  );
}

/* Pro Editions-Engine (nicht pro ursprünglicher Generation) - HG/SS nutzt trotz Johto-Setting das
   Gen4-VM-Set, da es technisch ein Gen4-Remake ist (siehe GAMES-Kommentar oben). Bewusst nur VMs,
   keine sonstigen Schlüsselitems (Rad, Angel, Story-Items) - die Liste soll eine schnelle
   "was brauche ich noch, um weiterzukommen"-Übersicht bleiben statt zu einer vollständigen
   Item-Datenbank zu wachsen. Nummerierung (VM01 usw.) bewusst weggelassen, da sie sich zwischen
   den Editionen unterscheidet und für die eigentliche Nutzung (Hindernis freigeschaltet?) nicht
   relevant ist - nur der Move-Name zählt. */
const KEY_ITEMS_BY_EDITION = {
  "rot-blau": ["Zerschneider","Fliegen","Surfer","Stärke","Blitz"],
  gelb: ["Zerschneider","Fliegen","Surfer","Stärke","Blitz"],
  "gold-silber": ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Whirlpool","Kaskade"],
  kristall: ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Whirlpool","Kaskade"],
  "feuerrot-blattgruen": ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Zertrümmerer","Kaskade","Tauchen"],
  smaragd: ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Zertrümmerer","Kaskade","Tauchen"],
  rubin: ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Zertrümmerer","Kaskade","Tauchen"],
  saphir: ["Zerschneider","Fliegen","Surfer","Stärke","Blitz","Zertrümmerer","Kaskade","Tauchen"],
  hgss: ["Zerschneider","Fliegen","Surfer","Stärke","Whirlpool","Zertrümmerer","Kaskade","Klettern"],
  "diamant-perl": ["Zerschneider","Fliegen","Surfer","Stärke","Nebelschwaden","Zertrümmerer","Kaskade","Klettern"],
  platin: ["Zerschneider","Fliegen","Surfer","Stärke","Nebelschwaden","Zertrümmerer","Kaskade","Klettern"],
  schwarz: ["Zerschneider","Fliegen","Surfer","Stärke","Kaskade","Zertrümmerer","Klettern"],
  weiss: ["Zerschneider","Fliegen","Surfer","Stärke","Kaskade","Zertrümmerer","Klettern"],
  "schwarz2-weiss2": ["Zerschneider","Fliegen","Surfer","Stärke","Kaskade","Zertrümmerer","Klettern"],
};
function currentKeyItems(){ return KEY_ITEMS_BY_EDITION[state.edition] || []; }

/* Rein dokumentarische Checkliste - im Unterschied zu Dupes-Clause-Warnung und Level-Cap (eigene,
   tatsächlich wirksame Funktionen) hat das An-/Abwählen hier keinerlei Effekt auf die App-Logik,
   hält nur fest, welche Hausregeln für diesen Run gelten sollten. */
const HOUSE_RULES = [
  { id:"setMode", label:"Set-Modus (kein Wechsel-Angebot bei gegnerischem Pokémon-Wechsel)" },
  { id:"speciesClause", label:"Species-Klausel (pro Art nur ein Fangversuch)" },
  { id:"noItems", label:"Keine Items im Kampf" },
  { id:"levelCap", label:"Level-Cap je Bosskampf" },
];
function houseRulesCardHtml(){
  const rows = HOUSE_RULES.map(r=>{
    const checked = !!state.houseRules[r.id];
    return `<label class="check-row${checked?" done":""}">
      <input type="checkbox" data-house-rule="${r.id}" ${checked?"checked":""} />
      <span>${escapeHtml(r.label)}</span>
    </label>`;
  }).join("");
  return `<div class="card">
    <div class="card-top">
      <div class="loc-name">Regelwerk-Checkliste</div>
      ${iconBtn("tone-neutral","open-setting-help","houserules",ICON_INFO,"Erklärung anzeigen",false,true)}
    </div>
    <div class="loc-sub" style="margin-bottom:6px;">Rein zur Dokumentation, welche Hausregeln für diesen Run gelten - ohne Auswirkung auf die App selbst (Dupes-Clause und Level-Cap-Berechnung sind eigene, tatsächlich wirksame Einstellungen).</div>
    ${rows}
  </div>`;
}

function openKeyItemsSheet(){
  const items = currentKeyItems();
  const checkedCount = items.filter(name=>state.keyItemsChecked[name]).length;
  const rows = items.map(name=>{
    const checked = !!state.keyItemsChecked[name];
    return `<label class="sheet-option check-row${checked?" done":""}">
      <input type="checkbox" data-key-item="${escapeHtml(name)}" ${checked?"checked":""} />
      <span>${escapeHtml(name)}</span>
    </label>`;
  }).join("");
  openSheet(`
    <h3>Schlüsselitems / VMs</h3>
    <div class="loc-sub" style="margin-bottom:14px;">${items.length ? `${checkedCount}/${items.length} eingesammelt - hilft zu sehen, welche Standorte schon erreichbar sind.` : "Für diese Edition sind hier keine VMs hinterlegt."}</div>
    ${rows}
    <div class="sheet-footer" style="margin-top:14px;">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

function openPendingLocationsSheet(){
  const list = pendingLocationsList();
  let rows;
  if(list.length){
    const byRegion = new Map();
    list.forEach(l=>{ if(!byRegion.has(l.region)) byRegion.set(l.region, []); byRegion.get(l.region).push(l); });
    rows = [...byRegion.entries()].map(([region, locs])=>`
      <div class="loc-sub" style="margin:14px 0 6px; font-weight:700;">${escapeHtml(region)}</div>
      ${locs.map(l=>`<button class="sheet-option" data-act="jump-to-pending-loc" data-id="${l.id}">${escapeHtml(l.name)}</button>`).join("")}
    `).join("");
  } else {
    rows = `<div class="loc-sub">Keine ausgelassenen Standorte - überall wurde schon ein Fangversuch eingetragen.</div>`;
  }
  openSheet(`
    <h3>Ausgelassene Routen</h3>
    <div class="loc-sub" style="margin-bottom:6px;">${list.length} Standort${list.length===1?"":"e"} ohne bisherigen Fangversuch.</div>
    ${rows}
    <div class="sheet-footer" style="margin-top:14px;">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

function openEventLogSheet(){
  const entries = state.eventLog.slice().reverse();
  const rows = entries.map(ev=>{
    const meta = EVENT_TYPE_META[ev.type] || EVENT_TYPE_META.catch;
    return `<div class="event-row">
      <div class="event-icon ${meta.tone}">${meta.icon}</div>
      <div>
        <div class="event-text">${escapeHtml(ev.text)}</div>
        <div class="event-time">${formatRelativeTime(ev.ts)}</div>
      </div>
    </div>`;
  }).join("");
  openSheet(`
    <h3>Verlauf</h3>
    <div class="loc-sub" style="margin-bottom:14px;">${entries.length ? `${entries.length} Ereignisse, neueste zuerst.` : ""}</div>
    ${rows || `<div class="loc-sub">Noch keine Ereignisse - fange dein erstes Pokémon oder besiege einen Boss.</div>`}
    <div class="sheet-footer">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

/* Team-Rotation-Historie: gefilterte Sicht auf denselben Verlauf statt einer eigenen Datenstruktur -
   "team"-Ereignisse werden bei jedem Team-Ein-/Austritt geloggt (siehe add-to-team/remove-from-team/
   do-team-swap/performCatch). */
function openTeamHistorySheet(){
  const entries = state.eventLog.filter(ev=>ev.type==="team").slice().reverse();
  const rows = entries.map(ev=>{
    const meta = EVENT_TYPE_META.team;
    return `<div class="event-row">
      <div class="event-icon ${meta.tone}">${meta.icon}</div>
      <div>
        <div class="event-text">${escapeHtml(ev.text)}</div>
        <div class="event-time">${formatRelativeTime(ev.ts)}</div>
      </div>
    </div>`;
  }).join("");
  openSheet(`
    <h3>Team-Rotation-Historie</h3>
    <div class="loc-sub" style="margin-bottom:14px;">${entries.length ? `${entries.length} Team-Wechsel, neueste zuerst.` : ""}</div>
    ${rows || `<div class="loc-sub">Noch keine Team-Wechsel - Pokémon, die neu ins Team kommen oder es verlassen, tauchen hier auf.</div>`}
    <div class="sheet-footer">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

/* Kurze Erklärtexte für Einstellungen, deren Wirkung über den einzeiligen Untertitel hinausgeht -
   öffnet ein simples Info-Sheet statt die Einstellungsliste dauerhaft mit Fließtext vollzustopfen. */
/* Dient zwei Zwecken: den einzelnen "?"-Hinweisen direkt an der jeweiligen Stelle (bewährtes Muster
   seit v1.8.33, siehe iconBtn(...,"open-setting-help",...)) UND als gemeinsame Datenquelle für die
   durchsuchbare "Ausführliche Tour" (siehe openFeatureIndexSheet) - ein Eintrag hier taucht deshalb
   automatisch an beiden Stellen auf, ohne Inhalte doppelt pflegen zu müssen. `category` gruppiert die
   Einträge in der Themen-Übersicht. Bewusst nicht für JEDE Einstellung ein Eintrag: nur für Stellen,
   die über ihren eigenen Kartentext hinaus wirklich vertiefte Erklärung brauchen (siehe Backlog-Notiz
   "Kontextuelle Hilfe-Icons ... bei weniger selbsterklärenden Optionen"). */
const SETTINGS_HELP = {
  bossboost: { category:"Duell & Bosse", title:"Level-Boost für Bosstrainer", text:"Erhöht die angezeigten Level aller Bosstrainer gemeinsam um den gewählten Prozentsatz - z. B. wird aus einem Basis-Level 50 bei +5% ein angezeigtes Level 53 (aufgerundet). Rein informativ für den Schwierigkeitsgrad eures Randomizers, ändert nichts an echten Spieldaten." },
  dupes: { category:"Regeln", title:"Dupes-Clause-Warnung", text:"Klassische Nuzlocke-Hausregel: pro Entwicklungsreihe darf meist nur ein Pokémon gefangen werden. Ist die Warnung aktiv, meldet sich die App beim Fangen, wenn die Art (oder eine verwandte Entwicklungsstufe) schon im Team, in der Box oder im Friedhof vorhanden ist - der Fang bleibt trotzdem möglich, es ist nur ein Hinweis, keine Sperre." },

/* "Ausführliche Tour": durchsuchbare, nach Themen gruppierte Übersicht über ALLE SETTINGS_HELP-
   Einträge - Ergänzung zur kurzen aktiven Erste-Schritte-Tour (siehe ONBOARDING_STEPS), für alle,
   die wirklich jedes Detail nachschlagen wollen, statt sich linear durch fünf Stationen zu klicken.
   Tippen auf einen Eintrag öffnet dieselbe Detail-Sheet wie der jeweilige "?"-Icon dort im Kontext
   (openSettingsHelpSheet, data-act bleibt identisch) - eine einzige Inhaltsquelle für beides. */
let featureIndexQuery = "";
function featureIndexResultsHtml(query){
  const q = query.trim().toLowerCase();
  const entries = Object.entries(SETTINGS_HELP).filter(([,info])=>
    !q || info.title.toLowerCase().includes(q) || info.text.toLowerCase().includes(q)
  );
  if(!entries.length) return `<div class="loc-sub">Keine Treffer.</div>`;
  const byCategory = new Map();
  entries.forEach(([key,info])=>{
    if(!byCategory.has(info.category)) byCategory.set(info.category, []);
    byCategory.get(info.category).push([key,info]);
  });
  return [...byCategory.entries()].map(([cat, items])=>`
    <div class="loc-sub" style="margin:14px 0 6px; font-weight:700;">${escapeHtml(cat)}</div>
    ${items.map(([key,info])=>`<button class="sheet-option" data-act="open-setting-help" data-id="${key}">${escapeHtml(info.title)}</button>`).join("")}
  `).join("");
}
function openFeatureIndexSheet(){
  featureIndexQuery = "";
  openSheet(`
    <h3>Ausführliche Tour</h3>
    <div class="loc-sub" style="margin-bottom:10px;">Alle Erklärungen zu einem Thema zum Nachschlagen - durchsuchbar, unabhängig von der kurzen Erste-Schritte-Tour.</div>
    <div class="field" style="margin-bottom:0;">
      <input type="search" id="featureIndexSearchInput" placeholder="Thema suchen..." autocomplete="off" />
    </div>
    <div id="featureIndexResults">${featureIndexResultsHtml(featureIndexQuery)}</div>
    <div class="sheet-footer" style="margin-top:14px;">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
  setTimeout(()=>document.getElementById("featureIndexSearchInput")?.focus(), 50);
}

function fitNames(){
  document.querySelectorAll(".mon-line .mon-name, .mon-line .loc-name").forEach(el=>{
    el.style.fontSize = "";
    const base = parseFloat(getComputedStyle(el).fontSize);
    const avail = el.clientWidth;
    const needed = el.scrollWidth;
    if(avail > 0 && needed > avail + 0.5){
      const min = Math.max(10, base*0.6);
      let size = base * (avail/needed) * 0.96;
      size = Math.max(min, Math.min(base, size));
      el.style.fontSize = size.toFixed(1)+"px";
    }
  });
}

/* Statusleiste (theme-color) folgt der aktuellen Edition statt eines fixen Werts - ein einzelnes
   Meta-Tag statt der früheren zwei media-query-gebundenen Varianten, da eine manuell über den
   Theme-Umschalter gewählte Vorliebe (data-theme) sonst vom Browser ignoriert würde (der wertet
   media="(prefers-color-scheme: ...)" strikt gegen die System-Einstellung aus, nicht gegen den
   App-internen Override). Liest den bereits aufgelösten CSS-Wert von --accent direkt aus, statt
   den Umweg über GAMES[...].theme zu gehen - HGSS hat z.B. gar kein eigenes theme-Objekt (nutzt
   die App-Basisfarbe aus :root), wäre über die GAMES-Struktur also ein Sonderfall gewesen. */
function updateThemeColorMeta(){
  const meta = document.getElementById("metaThemeColor");
  if(!meta) return;
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  if(accent) meta.setAttribute("content", accent);
}

/* Gestaffelte Eintritts-Animation der Kacheln (siehe CSS #content.tab-enter) - bewusst NICHT als
   Vergleich "hat sich activeTab seit dem letzten render() geändert" in render() selbst gelöst: kurz
   nach dem Start feuern etliche zusätzliche render()-Aufrufe aus freezeSpriteSrc()s img.onload
   (jedes Boss-Sprite wird einmal nachträglich "eingefroren"), die denselben Tab erneut rendern und
   die Klasse dadurch schon nach Millisekunden wieder entfernt hätten, bevor die Animation sichtbar
   werden konnte. Stattdessen wird das Hinzufügen nur an den echten Tab-Wechsel-Stellen ausgelöst.
   Das Entfernen hängt am tatsächlichen animationend-Event (mit kurzem Debounce, da mehrere Kacheln
   zeitversetzt enden) statt an einem festen Timeout - ein Timeout könnte bei Haupt-Thread-Last kurz
   nach dem Start (s.o., viele render()-Aufrufe direkt hintereinander) deutlich zu spät feuern. Ein
   Fallback-Timeout räumt zusätzlich auf, falls nie ein animationend kommt (z.B. leerer Zustand ohne
   Kacheln oder prefers-reduced-motion, wo die Animation komplett deaktiviert ist). */
let tabEnterCleanupTimer = null;
function triggerTabEnterAnim(){
  const el = document.getElementById("content");
  el.classList.add("tab-enter");
  clearTimeout(tabEnterCleanupTimer);
  tabEnterCleanupTimer = setTimeout(()=>el.classList.remove("tab-enter"), 1200);
}
document.getElementById("content").addEventListener("animationend", e=>{
  if(e.animationName !== "tileEnter") return;
  clearTimeout(tabEnterCleanupTimer);
  tabEnterCleanupTimer = setTimeout(()=>document.getElementById("content").classList.remove("tab-enter"), 60);
});

/* ---------- sheet ---------- */
const sheetBackdrop = document.getElementById("sheetBackdrop");
const sheetEl = document.getElementById("sheet");
/* Android/installierte PWA: die System-Zurück-Taste soll ein offenes Sheet schließen statt die App
   zu verlassen. Dafür beim ersten Öffnen EINEN History-Eintrag pushen (Sheets wechseln intern oft
   per erneutem openSheet()-Aufruf ohne Backdrop zu schließen, siehe sheetHistoryPushed-Flag - das
   verhindert doppelte Einträge bei reinem Inhaltswechsel). closeSheet() geht danach über
   history.back() statt direkt die Klasse zu entfernen, damit Zurück-Taste UND normales Schließen
   (Backdrop-Klick, Sheet-Griff, "Schließen"-Buttons) über denselben popstate-Pfad laufen und nie
   einen verwaisten History-Eintrag hinterlassen. */
let sheetHistoryPushed = false;
let sheetClosing = false; // während history.back() auf das popstate-Event wartet - verhindert einen doppelten history.back() bei schnellem Doppel-Antippen von Backdrop/Griff/"Schließen"
function openSheet(html){
  sheetEl.innerHTML = `<div class="sheet-handle-bar"><div class="sheet-handle"></div></div><div class="sheet-body">${html}</div>`;
  sheetBackdrop.classList.add("active");
  if(!sheetHistoryPushed){
    try{ history.pushState({__sheet:true}, ""); sheetHistoryPushed = true; }catch(e){}
  }
}
function closeSheet(){
  if(!sheetBackdrop.classList.contains("active") || sheetClosing) return;
  if(sheetHistoryPushed){
    sheetHistoryPushed = false;
    sheetClosing = true;
    try{ history.back(); return; }catch(e){ sheetClosing = false; }
  }
  sheetBackdrop.classList.remove("active");
}
window.addEventListener("popstate", ()=>{
  sheetClosing = false;
  if(sheetBackdrop.classList.contains("active")){
    sheetHistoryPushed = false;
    sheetBackdrop.classList.remove("active");
  }
});
sheetBackdrop.addEventListener("click", e=>{ if(e.target===sheetBackdrop) closeSheet(); });

/* Herunterziehen am Griff zum Schließen - gilt generisch für JEDES Sheet (Editionswahl,
   Spielstände, Verlauf, Run-Rückblick, Fangen, ...), da alle über openSheet() laufen. Der Griff
   selbst wird bei jedem openSheet()-Aufruf neu erzeugt (innerHTML-Ersatz), deshalb per Event-
   Delegation auf dem stabilen sheetEl statt einer direkten Referenz auf .sheet-handle. Während des
   Ziehens läuft die Transition bewusst aus (folgt dem Finger 1:1), erst beim Loslassen greift sie
   wieder - sowohl fürs Zurückschnappen als auch fürs Zuende-Schließen. */
(function(){
  const DISMISS_DISTANCE = 90, DISMISS_VELOCITY = 0.55;
  let dragging=false, startY=0, startTime=0, curDy=0;
  sheetEl.addEventListener("touchstart", e=>{
    if(!e.target.closest(".sheet-handle") || e.touches.length!==1) return;
    dragging = true; curDy = 0;
    startY = e.touches[0].clientY;
    startTime = Date.now();
    sheetEl.style.transition = "none";
  }, {passive:true});
  sheetEl.addEventListener("touchmove", e=>{
    if(!dragging) return;
    curDy = Math.max(0, e.touches[0].clientY - startY);
    sheetEl.style.transform = `translateY(${curDy}px)`;
  }, {passive:true});
  function release(){
    if(!dragging) return;
    dragging = false;
    sheetEl.style.transition = "";
    const elapsed = Math.max(1, Date.now()-startTime);
    const velocity = curDy/elapsed;
    if(curDy > DISMISS_DISTANCE || velocity > DISMISS_VELOCITY) closeSheet();
    sheetEl.style.transform = "";
  }
  sheetEl.addEventListener("touchend", release);
  sheetEl.addEventListener("touchcancel", release);
})();

/* Spielstände-Sheet: laufende Runs oben, abgeschlossene archivierte Runs (erfolgreich ODER
   gescheitert, siehe saveOutcome()) eingeklappt darunter - so bleibt die Hauptliste beim
   Wechseln zwischen aktiven Runs übersichtlich, alte Runs gehen aber nicht verloren. Nur
   abgeschlossene Runs lassen sich überhaupt archivieren (Button erscheint erst dann). */
function openSavesSheet(){
  const all = loadSavesIndex().slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const active = all.filter(s=>!s.archived);
  const archived = all.filter(s=>s.archived);
  const canDelete = all.length > 1;
  const rowHtml = (s, isArchived)=>{
    const isActive = s.id===activeSaveId;
    const game = GAMES[s.edition];
    const save = loadSaveState(s.id);
    const outcome = save ? saveOutcome(save) : null;
    const archiveBtn = !isArchived && outcome
      ? iconBtn("tone-neutral","archive-save",s.id,ICON_ARCHIVE,"Run archivieren",false,true)
      : isArchived
        ? iconBtn("tone-neutral","unarchive-save",s.id,ICON_UNDO,"Aus dem Archiv zurückholen",false,true)
        : "";
    return `<div class="save-row${isActive?" active":""}">
      <button class="save-row-main" data-act="switch-save" data-id="${s.id}">
        <div class="save-row-title">${escapeHtml(s.title||"Nuzlocke")}${isActive?` <span class="chip accent">Aktiv</span>`:""}${outcomeBadgeHtml(outcome)}</div>
        <div class="loc-sub">${escapeHtml(game?game.shortLabel:s.edition)} · ${formatRelativeTime(s.updatedAt)}</div>
      </button>
      ${archiveBtn}
      ${canDelete ? iconBtn("tone-red","delete-save",s.id,ICON_TRASH,"Spielstand löschen",false,true) : ""}
    </div>`;
  };
  const rows = active.map(s=>rowHtml(s,false)).join("") || `<div class="loc-sub">Keine laufenden Spielstände.</div>`;
  const archiveToggle = archived.length ? `<button class="region-header settings-group-header" data-act="toggle-saves-archive" style="margin-top:10px;">
    <span>Archiv (${archived.length})</span>
    <svg class="collapse-chevron${savesArchiveOpen?" open":""}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>${savesArchiveOpen ? archived.map(s=>rowHtml(s,true)).join("") : ""}` : "";
  openSheet(`
    <h3>Spielstände</h3>
    <div class="loc-sub" style="margin-bottom:14px;">Zwischen mehreren Runs wechseln, ohne dass Fortschritt verloren geht.</div>
    ${rows}
    <button class="btn btn-primary btn-block" style="margin-top:6px;" data-act="open-new-save">+ Neuer Spielstand</button>
    ${archiveToggle}
  `);
}

function openNewSaveSheet(){

      return `<button class="sheet-option${cls?" "+cls:""}" style="${style}" data-act="pick-new-save-edition" data-id="${g.id}">${escapeHtml(g.label)}</button>`;

    <div class="sheet-footer">

}

/* ---------- actions ---------- */
/* Generischer Lang-Drücken-Mechanismus für Aktionen, die ein "data-longpress-act" statt eines
   normalen "data-act" tragen - ein normaler Klick/Tap läuft dadurch ins Leere (kein [data-act]-
   Attribut, der Klick-Listener unten greift also nicht), erst 650ms Gedrückthalten lösen die
   Aktion aus (siehe LONGPRESS_ACTIONS). Über Pointer-Events statt touch-/mousedown getrennt
   implementiert, damit Maus und Touch einheitlich funktionieren. */
const LONGPRESS_MS = 650;
const LONGPRESS_ACTIONS = {
  "toggle-boss-defeat": id => toggleBossDefeat(id)
};
let longPressTimer = null, longPressEl = null;
function clearLongPress(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  if(longPressEl){ longPressEl.classList.remove("holding"); longPressEl = null; }
}
document.addEventListener("pointerdown", e=>{
  const btn = e.target.closest("[data-longpress-act]");
  if(!btn || btn.disabled) return;
  clearLongPress();
  longPressEl = btn;
  btn.classList.add("holding");
  longPressTimer = setTimeout(()=>{
    const handler = LONGPRESS_ACTIONS[btn.dataset.longpressAct];
    clearLongPress();
    if(handler) handler(btn.dataset.id);
  }, LONGPRESS_MS);
});
["pointerup","pointercancel","pointerleave"].forEach(evt=>{
  document.addEventListener(evt, ()=>clearLongPress(), true);
});

/* Team-Reihenfolge per Drag & Drop: Pointer-Events statt nativem HTML5-DnD (auf Touch-Geräten
   kaum brauchbar). Beim Ziehen entsteht ein frei schwebendes "Geister"-Element, das dem Finger/
   der Maus folgt - das Original bleibt an seiner (neuen) Grid-Position liegen und wird nur
   abgedunkelt (siehe .drag-source). Überquert der Zeiger eine andere Kachel, rückt die gezogene
   Kachel an deren Stelle (wie bei den meisten Reorder-Listen), der Rest verschiebt sich passend -
   erst beim Loslassen wird die neue Reihenfolge in state.teamOrder übernommen. */
let dragState = null;
document.addEventListener("pointerdown", e=>{
  const handle = e.target.closest(".slot-drag-handle");
  if(!handle) return;
  const slot = handle.closest(".slot[data-loc-id]");
  const grid = document.getElementById("teamGrid");
  if(!slot || !grid) return;
  e.preventDefault();
  const order = [...grid.querySelectorAll(".slot[data-loc-id]")].map(s=>s.dataset.locId);
  const rect = slot.getBoundingClientRect();
  const ghost = slot.cloneNode(true);
  ghost.classList.add("slot-drag-ghost");
  ghost.style.width = rect.width+"px";
  ghost.style.height = rect.height+"px";
  ghost.style.left = rect.left+"px";
  ghost.style.top = rect.top+"px";
  document.body.appendChild(ghost);
  slot.classList.add("drag-source");
  dragState = {
    id: slot.dataset.locId, order, ghost,
    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    pointerId: e.pointerId
  };
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e=>{
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  const { ghost, offsetX, offsetY } = dragState;
  ghost.style.left = (e.clientX - offsetX)+"px";
  ghost.style.top = (e.clientY - offsetY)+"px";
  const grid = document.getElementById("teamGrid");
  if(!grid) return;
  ghost.style.display = "none";
  const overEl = document.elementFromPoint(e.clientX, e.clientY);
  ghost.style.display = "";
  const overSlot = overEl && overEl.closest && overEl.closest(".slot[data-loc-id]");
  if(!overSlot) return;
  const overId = overSlot.dataset.locId;
  const order = dragState.order;
  const fromIdx = order.indexOf(dragState.id);
  const toIdx = order.indexOf(overId);
  if(fromIdx===-1 || toIdx===-1 || fromIdx===toIdx) return;
  order.splice(fromIdx,1);
  order.splice(toIdx,0,dragState.id);
  const byId = new Map(orderedTeamLocs().map(l=>[l.id,l]));
  [...grid.querySelectorAll(".slot")].forEach((el,i)=>{
    const loc = byId.get(order[i]);
    if(loc) el.outerHTML = teamSlotHtml(loc, false);
  });
  const newSourceSlot = grid.querySelector(`.slot[data-loc-id="${dragState.id}"]`);
  if(newSourceSlot) newSourceSlot.classList.add("drag-source");
});
function endTeamDrag(commit){
  if(!dragState) return;
  const { order, ghost } = dragState;
  ghost.remove();
  dragState = null;
  if(commit){ state.teamOrder = order; saveState(); }
  render();
}
document.addEventListener("pointerup", e=>{
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  endTeamDrag(true);
});
document.addEventListener("pointercancel", e=>{
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  endTeamDrag(false);
});

/* Spitzname inline auf der Team-Kachel (siehe renderTeam/editingTeamNickId): "focusout" statt
   "blur" für die Delegation, da blur nicht bubbelt - Enter schließt per .blur() den Kreis zum
   selben Speicherpfad, Escape bricht ohne zu speichern ab. */
document.addEventListener("focusout", e=>{
  if(e.target.id !== "teamNickInline" || !editingTeamNickId) return;
  const loc = findLoc(e.target.dataset.id);
  if(loc && loc.mon) loc.mon.nickname = e.target.value.trim().slice(0,30);
  editingTeamNickId = null;
  saveState(); render();
});
document.addEventListener("keydown", e=>{
  if(e.target.id !== "teamNickInline") return;
  if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); }
  else if(e.key==="Escape"){ e.preventDefault(); editingTeamNickId = null; render(); }
});

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(t.disabled) return;

  /* Allgemeiner Rückgängig-Toast: für eine kuratierte Liste "riskanter" Aktionen (siehe
     UNDOABLE_ACTIONS) wird VOR der eigentlichen Verarbeitung ein State-Snapshot gezogen - landet
     die Aktion in einem frühen "return" (z.B. Validierung schlägt fehl, oder es öffnet sich erst
     eine Zwischen-Sheet wie bei "mark-dead" mit aktivierter Todesursache-Abfrage), bleibt der
     Vergleich am Ende unten unverändert und es erscheint kein Toast - erst eine tatsächliche
     State-Änderung löst ihn aus. */
  const undoLabel = UNDOABLE_ACTIONS[act];
  const undoPreSnapshot = undoLabel ? JSON.stringify(state) : null;

  if(act==="open-catch") openCatchSheet(id);
  else if(act==="mark-failed"){
    const loc = findLoc(id);
    const wasComplete = isRegionFullyCaught(loc.region);
    loc.status="failed";
    saveState(); render();
    if(!wasComplete && isRegionFullyCaught(loc.region)) maybeOfferHideRegion(loc.region);
  }
  else if(act==="reset-loc"){ findLoc(id).status="pending"; saveState(); render(); }
  else if(act==="toggle-loc-visited"){
    const loc = findLoc(id);
    if(!loc) return;
    loc.visited = !loc.visited;
    saveState(); render();
  }
  else if(act==="toggle-loc-manual-collapse"){
    const list = state.manualCollapsedLocs || (state.manualCollapsedLocs=[]);
    const idx = list.indexOf(id);
    const collapsing = idx===-1;
    const cardEl = collapsing ? t.closest("[data-loc], [data-boss]") : null;
    if(collapsing) list.push(id); else list.splice(idx,1);
    saveState();
    if(cardEl) flyTileToStash(cardEl);
    render();
  }
  else if(act==="toggle-loc-stash-collapse"){
    const key = t.dataset.region;
    const willExpand = !expandedStashRegions.has(key);
    if(willExpand) expandedStashRegions.add(key); else expandedStashRegions.delete(key);
    const bodyEl = document.querySelector(`[data-collapse-body="${key}"]`);
    if(bodyEl){
      bodyEl.classList.toggle("expanded", willExpand);
      bodyEl.toggleAttribute("inert", !willExpand);
      updateJumpButtonVisibility();
      bodyEl.addEventListener("transitionend", updateJumpButtonVisibility, {once:true});
    }
    const chevron = t.querySelector(".collapse-chevron");
    if(chevron) chevron.classList.toggle("open", willExpand);
    const label = t.querySelector("span");
    const count = Number(t.dataset.count);
    if(label) label.textContent = `${count} zurückgestellte ${count===1?"Kachel":"Kacheln"} ${willExpand?"ausblenden":"anzeigen"}`;
  }
  else if(act==="close-sheet") closeSheet();
  else if(act==="save-catch"){
    const species = document.getElementById("inSpecies").value.trim();
    if(!species) return;
    const nickInput = document.getElementById("inNick");
    const nick = nickInput.value.trim().slice(0,30);
    if(state.nicknameRequired && !nick){
      nickInput.style.borderColor = "var(--red)";
      nickInput.placeholder = "Spitzname erforderlich";
      nickInput.focus();
      return;
    }
    if(state.dupesWarning){
      const dupe = findDuplicateSpecies(species, id);
      if(dupe){
        pendingCatchData = {id, species, nick};
        const where = dupe.mon.dead ? "im Friedhof" : dupe.mon.inTeam ? "im Team" : "in der Box";
        const sameSpecies = dupe.mon.species.trim().toLowerCase()===species.trim().toLowerCase();
        const msg = sameSpecies
          ? `${species} ist schon vorhanden (${dupe.name}, ${where}). Trotzdem fangen?`
          : `${species} gehört zur selben Entwicklungsreihe wie dein bereits gefangenes ${dupe.mon.species} (${dupe.name}, ${where}). Trotzdem fangen?`;
        openConfirmSheet("Bereits gefangen", msg, "Trotzdem fangen", "confirm-save-catch-dupe");
        return;
      }
    }
    performCatch(id, species, nick);
  }
  else if(act==="confirm-save-catch-dupe"){
    if(pendingCatchData){
      state.dupesIgnoredCount = (state.dupesIgnoredCount||0) + 1;
      performCatch(pendingCatchData.id, pendingCatchData.species, pendingCatchData.nick);
      pendingCatchData=null;
    }
  }
  else if(act==="open-rename") renameSheet(id);
  else if(act==="open-evolve") openEvolveSheet(id);
  else if(act==="do-evolve"){
    const species = t.dataset.species || (document.getElementById("inEvolve") ? document.getElementById("inEvolve").value : "");
    evolveMon(id, species);
  }
  else if(act==="open-team-picker") openTeamPicker();
  else if(act==="add-to-team"){
    if(teamCount()>=6){ openTeamSwapSheet(id); return; }
    const loc = findLoc(id);
    loc.mon.inTeam=true;
    logEvent("team", `${loc.mon.nickname || loc.mon.species} kam ins Team`);
    saveState(); closeSheet(); render();
  }
  else if(act==="do-team-swap"){
    const newLoc = findLoc(id);
    const swapLoc = findLoc(t.dataset.swap);
    if(!newLoc || !swapLoc) return;
    swapLoc.mon.inTeam = false;
    newLoc.mon.inTeam = true;
    logEvent("team", `${swapLoc.mon.nickname || swapLoc.mon.species} verließ das Team für ${newLoc.mon.nickname || newLoc.mon.species}`);
    saveState(); closeSheet(); render();
  }
  else if(act==="remove-from-team"){
    const loc = findLoc(id);
    loc.mon.inTeam=false;
    logEvent("team", `${loc.mon.nickname || loc.mon.species} verließ das Team`);
    saveState(); closeSheet(); render();
  }
  else if(act==="mark-dead"){
    if(state.trackDeathCause){ openDeathCauseSheet(id); return; }
    performMarkDead(id, "");
  }
  else if(act==="confirm-mark-dead"){
    const cause = (document.getElementById("inDeathCause")?.value||"").trim().slice(0,40);
    performMarkDead(id, cause);
  }
  else if(act==="revive"){
    const m = findLoc(id).mon;
    m.dead=false; delete m.deathCause;
    saveState(); closeSheet(); render();
  }
  else if(act==="pvp-win") openPvpWinSheet(id);
  else if(act==="pvp-lose") openPvpLoseSheet(id);
  else if(act==="save-pvp-win"){
    const species = document.getElementById("inPvpSpecies").value.trim();
    if(!species) return;
    const locId = "pvp-win-"+id+"-"+Date.now();
    state.locations.push({ id:locId, name:"PvP-Sieg", region:null, custom:true, status:"caught", mon:{ species, nickname:"", inTeam:false, dead:false, given:false, caughtAt:Date.now() } });
    state.pvp[id] = { winner:"me", wonSpecies:species, locId };
    logEvent("pvp", `Rivalenduell gewonnen - ${species} erhalten`);
    saveState(); closeSheet(); render();
  }
  else if(act==="save-pvp-lose"){
    const locId = t.dataset.loc;
    const loc = findLoc(locId);
    if(!loc || !loc.mon) return;
    loc.mon.given = true; loc.mon.inTeam = false;
    state.pvp[id] = { winner:"friend", givenLocId:locId };
    logEvent("pvp", `Rivalenduell verloren - ${loc.mon.nickname || loc.mon.species} abgegeben`);
    saveState(); closeSheet(); render();
  }
  else if(act==="pvp-undo"){
    const rec = state.pvp[id];
    if(rec){
      if(rec.winner==="me" && rec.locId){
        state.locations = state.locations.filter(l=>l.id!==rec.locId);
      } else if(rec.winner==="friend" && rec.givenLocId){
        const givenLoc = findLoc(rec.givenLocId);
        if(givenLoc && givenLoc.mon) givenLoc.mon.given = false;
      }
      delete state.pvp[id];
    }
    saveState(); render();
  }
  else if(act==="boss-inc-all"){
    currentGame().bosses.forEach(b=>{ state.bossBoosts[b.id] = bossPercent(b.id) + 5; });
    saveState(); render();
  }
  else if(act==="boss-dec-all"){
    currentGame().bosses.forEach(b=>{ state.bossBoosts[b.id] = Math.max(0, bossPercent(b.id) - 5); });
    saveState(); render();
  }
  else if(act==="boss-set-all"){
    const input = document.getElementById("bossBoostInput");
    const val = Math.max(0, Math.round(Number(input?.value)) || 0);
    currentGame().bosses.forEach(b=>{ state.bossBoosts[b.id] = val; });
    saveState(); render();
  }
  else if(act==="open-boss-win") openBossResultSheet(id, "win");
  else if(act==="open-boss-loss") openBossResultSheet(id, "loss");
  else if(act==="confirm-boss-result"){
    const boss = bossById(id);
    if(!boss) return;
    const result = t.dataset.result;
    const isRival = boss.group === "Rivale";
    const rivalNick = isRival ? (state.rivalNickname||"").trim() : "";
    const displayName = rivalNick || boss.name;
    const deadNames = [];
    const deadLocIds = [];
    document.querySelectorAll("[data-death-loc]:checked").forEach(cb=>{
      const loc = findLoc(cb.dataset.deathLoc);
      if(!loc || !loc.mon || loc.mon.dead) return;
      loc.mon.dead = true; loc.mon.inTeam = false;
      deadNames.push(loc.mon.nickname || loc.mon.species);
      deadLocIds.push(loc.id);
    });
    if(result==="win"){
      state.bossDefeated[id] = true;
      logEvent("boss", `${displayName} besiegt (${boss.place})`);
      if(deadNames.length===0) state.cleanBossWins[id] = true;
      else delete state.cleanBossWins[id];
      snapshotBossWinTeam(id);
    } else {
      state.lossCount = (state.lossCount||0) + 1;
      state.bossLossIds[id] = (state.bossLossIds[id]||0) + 1;
      logEvent("bossLoss", `Niederlage gegen ${displayName} (${boss.place})`);
      /* Manche Story-Kämpfe gehen auch bei einer Niederlage weiter (siehe openBossResultSheet) -
         "loss" statt true, damit die Kachel als abgeschlossen einklappt und in "Bosse besiegt"
         zählt, sich aber weiterhin optisch/inhaltlich von einem echten Sieg unterscheiden lässt. */
      if(document.getElementById("bossContinueAnyway")?.checked) state.bossDefeated[id] = "loss";
    }
    if(deadNames.length) logEvent("dead", `${deadNames.join(", ")} gestorben im Kampf gegen ${displayName}`);
    deadNames.forEach(name=>logEvent("team", `${name} verließ das Team (gestorben)`));
    if(result==="win") vibrateFeedback([40,30,80]);
    else if(deadNames.length) vibrateFeedback([25,40,25]);
    lastFightDeaths = deadNames.length;
    lastFightWasWin = (result === "win");
    lastFightBossId = id;
    const finalBoss = finalStoryBoss();
    const isChamp = finalBoss && boss.id===finalBoss.id;
    if(result==="win" && state.soloMode && isChamp) snapshotSoloHallOfFame();
    saveState();
    if(result==="win") lastDefeatedId = id;
    closeSheet(); render();
    lastDefeatedId = null;
    if(result==="win" && isChamp) showChampionCelebration(boss);
    else if(result==="win" && boss.badge) celebrateOrden(boss.badge);
    if(deadNames.length) checkGameOver();
    if(deadLocIds.length && aliveCount()>0 && !(result==="win" && isChamp)) checkSoulLinkAfterDeath(deadLocIds);
  }
  else if(act==="open-boss-win-team") openBossWinTeamSheet(id);
  else if(act==="close-champion-overlay"){ document.querySelector(".champion-overlay")?.remove(); }
  else if(act==="close-game-over-overlay"){ document.querySelector(".game-over-overlay")?.remove(); }
  else if(act==="open-onboarding-tour") openOnboardingTour();
  else if(act==="open-feature-index") openFeatureIndexSheet();
  else if(act==="edit-team-nick"){ editingTeamNickId = id; render(); }
  else if(act==="open-team-history") openTeamHistorySheet();
  else if(act==="open-pending-locations") openPendingLocationsSheet();
  else if(act==="open-key-items") openKeyItemsSheet();
  else if(act==="open-type-coverage") openTypeCoverageSheet();
  else if(act==="jump-to-pending-loc"){
    closeSheet();
    activeTab = "routes";
    render();
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-loc="${id}"]`);
      if(el) el.scrollIntoView({ behavior:"smooth", block:"center" });
    });
  }
  else if(act==="open-leaderboard") openLeaderboardSheet();
  else if(act==="onboarding-next"){ onboardingStep = Math.min(onboardingStep+1, ONBOARDING_STEPS.length-1); renderOnboardingOverlay(); }
  else if(act==="onboarding-prev"){ onboardingStep = Math.max(onboardingStep-1, 0); renderOnboardingOverlay(); }
  else if(act==="onboarding-close") closeOnboardingTour();
  else if(act==="start-tour-cycle") startTourCycle(id);
  else if(act==="cycle-next"){ cycleStep = Math.min(cycleStep+1, TOUR_CYCLES[activeCycleId].length-1); renderCycleStep(); }
  else if(act==="cycle-close") closeTourCycle();
  else if(act==="open-final-rival"){
    openFinalRivalSheet(id);
  }
  else if(act==="save-final-rival"){
    const team = [];
    for(let i=0;i<6;i++){
      const v = (document.getElementById(`finalMon${i}`)?.value||"").trim();
      if(v) team.push(v);
    }

/* swipe left/right between tabs: a separate veil overlay blurs/fades live with the drag,
   snaps back if not committed. The blur is never applied to #content itself, since #content
   holds position:sticky region headers -- filtering an ancestor of a sticky element is a
   known cause of translucent rendering glitches on sticky elements in Chromium/WebView. */
(function(){
  const TAB_ORDER = [...document.querySelectorAll(".tab")].map(t=>t.dataset.tab);
  const contentEl = document.getElementById("content");
  const veilEl = document.getElementById("swipeVeil");
  const MAX_BLUR = 6, MAX_FADE = 0.6, DRAG_DISTANCE = 120, COMMIT_DISTANCE = 60;
  const reduceMotion = ()=> window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let dragging=false, horizontalLock=false, startX=0, startY=0, startTime=0, curDx=0;

  function setSwipeVisual(progress){
    const blur = (progress*MAX_BLUR).toFixed(2)+"px";
    veilEl.style.backdropFilter = `blur(${blur})`;
    veilEl.style.webkitBackdropFilter = `blur(${blur})`;
    veilEl.style.opacity = String(progress*MAX_FADE);
  }
  function clearSwipeVisual(){
    veilEl.style.backdropFilter = "";
    veilEl.style.webkitBackdropFilter = "";
    veilEl.style.opacity = "";
  }

  contentEl.addEventListener("touchstart", e=>{
    if(sheetBackdrop.classList.contains("active") || e.touches.length!==1){ dragging=false; return; }
    dragging = true; horizontalLock = false; curDx = 0;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, {passive:true});

  contentEl.addEventListener("touchmove", e=>{
    if(!dragging || reduceMotion()) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(!horizontalLock){
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4){
        horizontalLock = true;
        veilEl.classList.add("dragging");
      } else if(Math.abs(dy) > 12){
        dragging = false; /* vertical scroll, let it happen natively */
        return;
      } else {
        return;
      }
    }
    curDx = dx;
    const idx = TAB_ORDER.indexOf(activeTab);
    const canGoNext = dx < 0 && idx < TAB_ORDER.length - 1;
    const canGoPrev = dx > 0 && idx > 0;
    const progress = (canGoNext || canGoPrev) ? Math.min(1, Math.abs(dx) / DRAG_DISTANCE) : 0;
    setSwipeVisual(progress);
  }, {passive:true});

  contentEl.addEventListener("touchend", ()=>{
    if(!dragging) return;
    dragging = false;
    veilEl.classList.remove("dragging");
    if(!horizontalLock){ clearSwipeVisual(); return; }
    const idx = TAB_ORDER.indexOf(activeTab);
    const commit = Math.abs(curDx) >= COMMIT_DISTANCE && (Date.now() - startTime) < 900;
    if(commit && curDx < 0 && idx < TAB_ORDER.length - 1){
      activeTab = TAB_ORDER[idx+1]; render(); triggerTabEnterAnim(); veilEl.offsetHeight; clearSwipeVisual();
    } else if(commit && curDx > 0 && idx > 0){
      activeTab = TAB_ORDER[idx-1]; render(); triggerTabEnterAnim(); veilEl.offsetHeight; clearSwipeVisual();
    } else {
      clearSwipeVisual();
    }
  }, {passive:true});
})();

  if(e.target && e.target.id==="featureIndexSearchInput"){
    featureIndexQuery = e.target.value;
    const resultsEl = document.getElementById("featureIndexResults");
    if(resultsEl) resultsEl.innerHTML = featureIndexResultsHtml(featureIndexQuery);
  }
});

/* theme toggle: direct light <-> dark toggle (defaults to system preference until first click) */
function effectiveTheme(){
  const mode = localStorage.getItem("hgss-theme-mode") || "system";
  if(mode==="light" || mode==="dark") return mode;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function applyThemeIcon(){
  const icon = document.getElementById("themeIcon");
  if(effectiveTheme()==="light") icon.innerHTML = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';
  else icon.innerHTML = '<path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/>';
}
function applyTheme(){
  const mode = localStorage.getItem("hgss-theme-mode") || "system";
  if(mode==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  applyThemeIcon();
  updateThemeColorMeta();
}
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const next = effectiveTheme()==="light" ? "dark" : "light";
  try{ localStorage.setItem("hgss-theme-mode", next); }catch(e){}
  applyTheme();
});
applyTheme();

/* iOS Safari berechnet :active-Zustände (Press-Feedback per CSS) nur, wenn irgendwo auf der Seite
   ein touchstart-Listener hängt - sonst bleibt z.B. der Scale-Down-Effekt auf Buttons dort komplett
   aus. Ein leerer, passiver Listener auf dem gesamten Dokument reicht, um das global zu aktivieren. */
document.addEventListener("touchstart", function(){}, {passive:true});

/* PWA-Schnellzugriffe vom Home-Bildschirm-Icon (siehe manifest.json "shortcuts") landen auf
   ?tab=routes bzw. ?tab=team - vor dem ersten render() ausgewertet, damit direkt der richtige Tab
   erscheint statt kurz "Routen" aufzublitzen und dann umzuschalten. Nur bekannte Tab-IDs werden
   übernommen, alles andere (manuell veränderte URL) wird ignoriert. */
try{
  const requestedTab = new URLSearchParams(location.search).get("tab");
  if(requestedTab && [...document.querySelectorAll(".tab")].some(t=>t.dataset.tab===requestedTab)){
    activeTab = requestedTab;
    history.replaceState(null, "", location.pathname + location.hash);
  }
}catch(e){}

render();
triggerTabEnterAnim();
checkAchievements();
try{ if(!localStorage.getItem("nuzlocke-onboarding-seen")) openOnboardingTour(); }catch(e){}
Object.keys(BOSS_SPRITES).forEach(key=>freezeSpriteSrc(key, BOSS_SPRITES[key]));

/* Über einen geteilten Sync-Link geöffnet (#sync=CODE, siehe syncShareUrl) - füllt das Code-Feld
   nur vor, verknüpft aber nie automatisch beim bloßen Öffnen des Links, das bleibt eine bewusste
   Bestätigung im Sheet. Hash wird sofort entfernt, damit ein Neuladen der Seite nicht erneut
   auslöst. Greift nicht, wenn dieser Spielstand schon verknüpft ist. */
try{
  const syncLinkMatch = location.hash.match(/sync=([A-Z0-9]{6,12})/i);
  if(syncLinkMatch && !state.syncCode){
    const incomingSyncCode = syncLinkMatch[1].toUpperCase();
    history.replaceState(null, "", location.pathname + location.search);
    openLinkSyncCodeSheet(incomingSyncCode);
  }
}catch(e){}
</script>
