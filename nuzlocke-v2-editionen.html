<style>
:root{
  --bg:#F5EFDD;
  --surface:#FFFFFF;
  --surface-alt:#ECE1C4;
  --ink:#2A2118;
  --ink-soft:#6B5D45;
  --gold:#A9762E;
  --gold-soft:#EADCB8;
  --gold-glow: 169,118,46;
  --silver:#5C6A80;
  --silver-soft:#DFE3EA;
  --accent:#64738A;
  --accent-soft:#E1E5EC;
  --accent-shine:#F5F7FA;
  --accent-deep:#48536A;
  --red:#B5392B;
  --red-soft:#F3D9D2;
  --red-glow: 181,57,43;
  --good:#3F7A46;
  --good-soft:#DCEBDA;
  --good-glow: 63,122,70;
  --warn:#B5731E;
  --warn-soft:#F2DFC0;
  --evolve:#2E86C7;
  --evolve-soft:#D9ECFA;
  --evolve-glow: 118,187,240;
  --line: rgba(42,33,24,0.14);
  --shadow: 0 1px 2px rgba(42,33,24,0.08), 0 4px 14px rgba(42,33,24,0.06);
  --shadow-up: 0 -1px 2px rgba(42,33,24,0.06), 0 -6px 18px rgba(42,33,24,0.09);
  --radius: 16px;
  --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Century Gothic", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-mono: "Cascadia Mono", "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151D;
    --surface:#1A212C;
    --surface-alt:#212938;
    --ink:#ECE6D8;
    --ink-soft:#9CA3B4;
    --gold:#DDB05F;
    --gold-soft:#3A3220;
    --gold-glow: 221,176,95;
    --silver:#9FADC2;
    --silver-soft:#232B3B;
    --accent:#DDB05F;
    --accent-soft:#3A3220;
    --accent-shine:#F6D998;
    --accent-deep:#8C6B2E;
    --red:#E2685A;
    --red-soft:#3A2222;
    --red-glow: 226,104,90;
    --good:#74C17E;
    --good-soft:#20301F;
    --good-glow: 116,193,126;
    --warn:#E3A758;
    --warn-soft:#382C18;
    --evolve:#6FB8ED;
    --evolve-soft:#1C3A50;
    --evolve-glow: 111,184,237;
    --line: rgba(236,230,216,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --shadow-up: 0 -1px 2px rgba(0,0,0,0.25), 0 -8px 22px rgba(0,0,0,0.32);
  }
}
:root[data-theme="light"]{
  --bg:#F5EFDD; --surface:#FFFFFF; --surface-alt:#ECE1C4; --ink:#2A2118; --ink-soft:#6B5D45;
  --gold:#A9762E; --gold-soft:#EADCB8; --gold-glow: 169,118,46; --silver:#5C6A80; --silver-soft:#DFE3EA;
  --accent:#64738A; --accent-soft:#E1E5EC; --accent-shine:#F5F7FA; --accent-deep:#48536A;
  --red:#B5392B; --red-soft:#F3D9D2; --red-glow: 181,57,43; --good:#3F7A46; --good-soft:#DCEBDA; --good-glow: 63,122,70;
  --warn:#B5731E; --warn-soft:#F2DFC0; --evolve:#2E86C7; --evolve-soft:#D9ECFA; --evolve-glow: 118,187,240;
  --line: rgba(42,33,24,0.14);
  --shadow: 0 1px 2px rgba(42,33,24,0.08), 0 4px 14px rgba(42,33,24,0.06);

:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A212C; --surface-alt:#212938; --ink:#ECE6D8; --ink-soft:#9CA3B4;
  --gold:#DDB05F; --gold-soft:#3A3220; --gold-glow: 221,176,95; --silver:#9FADC2; --silver-soft:#232B3B;
  --accent:#DDB05F; --accent-soft:#3A3220; --accent-shine:#F6D998; --accent-deep:#8C6B2E;
  --red:#E2685A; --red-soft:#3A2222; --red-glow: 226,104,90; --good:#74C17E; --good-soft:#20301F; --good-glow: 116,193,126;

/* Edition-Farbschema: wird zur Laufzeit aus GAMES[...].theme generiert, siehe
   injectEditionThemeCSS() im JS-Teil weiter unten - hier keine Regeln mehr von Hand pflegen. */
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
/* Sichtbarer Fokusring für Tastatur-/Switch-Control-Navigation - bisher gab es außer bei Text-
   Eingabefeldern keinerlei Fokus-Kennzeichnung. :focus-visible statt :focus, damit der Ring nur bei
   echter Tastaturnavigation erscheint, nicht bei jedem Maus-/Touch-Tap. */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
}
html,body{margin:0; padding:0; height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  overflow-x:hidden;
}
button, input{ font-family:inherit; color:inherit; }
button{ -webkit-user-select:none; user-select:none; cursor:pointer; }
h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; }
.app{
  max-width:640px; margin:0 auto; position:fixed; inset:0;
  display:flex; flex-direction:column;
}

/* Top bar */
.topbar{
  flex:none; z-index:20; background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line);
}
.topbar-row{ display:flex; align-items:center; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.pokeball{ width:26px; height:26px; flex:none; }
.edition-badge{
  display:flex; align-items:center; gap:6px; flex:none; border:1px solid var(--line);
  background:var(--surface); border-radius:999px; padding:5px 10px 5px 8px;
  font-size:.78rem; font-weight:700; color:var(--accent);
}
.edition-badge:active{ transform:scale(.96); }
.edition-badge .pokeball{ width:18px; height:18px; }
.edition-badge .pokeball circle:first-child, .edition-badge .pokeball path{ stroke:var(--accent); }
.brand-title-col{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
.title-input{
  font-family:var(--font-display); font-size:1.15rem; font-weight:700;
  background:transparent; border:none; outline:none; color:var(--ink);
  padding:2px 0; flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.active-title-badge{
  display:none; flex:none; font-size:.72rem; font-weight:700; color:var(--accent);
  background:var(--accent-soft); border-radius:999px; padding:4px 10px; white-space:nowrap;
}
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  flex:none; transition:transform .15s ease;
}
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:19px; height:19px; stroke:var(--ink-soft); fill:none; stroke-width:1.8; }
.stat-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:12px;
}
.stat-tile{
  background:var(--surface-alt); border-radius:12px; padding:10px 12px;
  display:flex; flex-direction:column; gap:3px; min-width:0;
}
.stat-tile .stat-label{ font-size:.72rem; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-tile .stat-value{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.2rem; font-weight:700; color:var(--ink); }
.stat-tile.dot-good .stat-value{ color:var(--good); }
.stat-tile.dot-red .stat-value{ color:var(--red); }
.stat-tile.dot-warn .stat-value{ color:var(--warn); }
.stat-tile.dot-gold .stat-value{ color:var(--accent); }
.recap-insights{ margin:0 0 4px; padding-left:20px; }
.recap-insights li{ font-size:.85rem; color:var(--ink-soft); line-height:1.5; margin-bottom:4px; }
.progress-label-row{
  display:flex; align-items:baseline; justify-content:space-between; margin-top:14px;
  font-size:.78rem; font-weight:700; color:var(--ink-soft);
}
.progress-pct{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.05rem; color:var(--accent); }
.progress-track{
  margin-top:6px; height:6px; border-radius:999px; background:var(--surface-alt); overflow:hidden;
}
.progress-fill{ height:100%; background:linear-gradient(155deg, var(--accent-shine), var(--accent) 55%, var(--accent-deep)); border-radius:999px; transition:width .3s ease; }
.mini-progress-sticky{
  position:sticky; top:0; z-index:15; background:var(--bg); pointer-events:none;
  margin:0 -16px 12px; padding:10px 16px 8px; border-bottom:1px solid var(--line);
}
.mini-progress-row{
  display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;
  font-size:.74rem; font-weight:700; color:var(--ink-soft);
}
.mini-progress-row .progress-pct{ font-size:.86rem; }
.mini-progress-sticky .progress-track{ margin-top:0; }
.header-team-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.header-team-slots{ display:flex; gap:6px; flex:none; }
.header-team-slot{
  flex:none; width:44px; aspect-ratio:1; border-radius:10px; background:var(--surface-alt);
  border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.header-team-slot.filled{ border-style:solid; border-color:var(--good); background:var(--surface); padding:2px; }
.header-team-slot img{ width:100%; height:100%; object-fit:contain; }
.header-team-slot img.sprite-legacy{ image-rendering:pixelated; }
.header-orden-tray{
  flex:1; min-width:0; display:grid; grid-template-columns:repeat(4,13px); grid-auto-rows:13px;
  align-content:center; justify-content:end; gap:2px;
}
.header-orden-chip{
  flex:none; width:13px; height:13px; border-radius:50%; background:var(--surface);
  border:1px solid var(--gold); box-shadow:0 0 0 1px var(--gold-soft) inset; padding:1.5px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.header-orden-chip img{ width:100%; height:100%; object-fit:contain; }
.orden-fly-badge{
  position:fixed; top:50%; left:50%; z-index:9999; width:min(120px,32vw); height:min(120px,32vw);
  border-radius:50%; background:var(--surface); border:3px solid var(--gold);
  box-shadow:0 0 0 6px var(--gold-soft), 0 8px 30px rgba(0,0,0,.35); display:flex; align-items:center;
  justify-content:center; padding:14px; pointer-events:none; will-change:transform,opacity;
}
.orden-fly-badge img{ width:100%; height:100%; object-fit:contain; }
.orden-firework-particle{
  position:fixed; z-index:9998; width:9px; height:9px; border-radius:50%;
  pointer-events:none; animation:orden-firework-burst 1.15s cubic-bezier(.15,.6,.35,1) forwards;
}
@keyframes orden-firework-burst{
  0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
  70%{ opacity:1; }
  100%{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.25); opacity:0; }
}
.orden-firework-flash{
  position:fixed; z-index:9997; width:10px; height:10px; border-radius:50%;
  pointer-events:none; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, var(--gold) 40%, transparent 72%);
  animation:orden-firework-flash .55s ease-out forwards;
}
@keyframes orden-firework-flash{
  0%{ width:10px; height:10px; opacity:1; }
  100%{ width:260px; height:260px; opacity:0; }
}

/* Content */
.content-wrap{ flex:1; min-height:0; position:relative; }
.content{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 100px; scrollbar-width:none; -ms-overflow-style:none; }
.content::-webkit-scrollbar{ display:none; }
.content > *:first-child{ margin-top:14px; }
.swipe-veil{
  position:absolute; inset:0; z-index:20; pointer-events:none;
  background:var(--bg); opacity:0; backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
  transition:opacity .18s ease, backdrop-filter .18s ease, -webkit-backdrop-filter .18s ease;
}
.swipe-veil.dragging{ transition:none; }
@media (prefers-reduced-motion: reduce){
  .swipe-veil{ transition:none; }
}

/* Gestaffelte Eintritts-Animation beim Tab-Wechsel (siehe render()/tab-enter-Klasse) - deckt neben
   den direkten Kindern von #content (Routen/Friedhof/Einstellungen) auch die bekannten inneren
   Listen-Wrapper von Team (.team-grid) und Box (#boxResults) ab, deren Karten sonst nicht einzeln
   erfasst würden. Nur die ersten ~12 Kacheln bekommen einen eigenen Delay-Schritt - der Rest folgt
   ohne zusätzliche Verzögerung, damit lange Listen nicht spürbar langsamer erscheinen. */
@keyframes tileEnter{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
#content.tab-enter > *,
#content.tab-enter > .team-grid > *,
#content.tab-enter > #boxResults > *{
  animation: tileEnter .28s ease both;
}
#content.tab-enter > :nth-child(1),  #content.tab-enter > .team-grid > :nth-child(1),  #content.tab-enter > #boxResults > :nth-child(1) { animation-delay: 0ms; }
#content.tab-enter > :nth-child(2),  #content.tab-enter > .team-grid > :nth-child(2),  #content.tab-enter > #boxResults > :nth-child(2) { animation-delay: 30ms; }
#content.tab-enter > :nth-child(3),  #content.tab-enter > .team-grid > :nth-child(3),  #content.tab-enter > #boxResults > :nth-child(3) { animation-delay: 60ms; }
#content.tab-enter > :nth-child(4),  #content.tab-enter > .team-grid > :nth-child(4),  #content.tab-enter > #boxResults > :nth-child(4) { animation-delay: 90ms; }
#content.tab-enter > :nth-child(5),  #content.tab-enter > .team-grid > :nth-child(5),  #content.tab-enter > #boxResults > :nth-child(5) { animation-delay: 120ms; }
#content.tab-enter > :nth-child(6),  #content.tab-enter > .team-grid > :nth-child(6),  #content.tab-enter > #boxResults > :nth-child(6) { animation-delay: 150ms; }
#content.tab-enter > :nth-child(7),  #content.tab-enter > #boxResults > :nth-child(7) { animation-delay: 180ms; }
#content.tab-enter > :nth-child(8),  #content.tab-enter > #boxResults > :nth-child(8) { animation-delay: 210ms; }
#content.tab-enter > :nth-child(9),  #content.tab-enter > #boxResults > :nth-child(9) { animation-delay: 240ms; }
#content.tab-enter > :nth-child(10), #content.tab-enter > #boxResults > :nth-child(10) { animation-delay: 270ms; }
#content.tab-enter > :nth-child(11), #content.tab-enter > #boxResults > :nth-child(11) { animation-delay: 300ms; }
#content.tab-enter > :nth-child(12), #content.tab-enter > #boxResults > :nth-child(12) { animation-delay: 330ms; }
@media (prefers-reduced-motion: reduce){
  #content.tab-enter > *,
  #content.tab-enter > .team-grid > *,
  #content.tab-enter > #boxResults > *{ animation:none; }
}
.region-header{
  position:sticky; top:0; z-index:10; background:var(--bg);
  font-family:var(--font-display); font-size:.72rem; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); padding:14px 2px 8px;
}
/* In den Einstellungen stehen viele Gruppenköpfe dicht hintereinander - würden sie wie in der
   Routen-Liste alle bei top:0 kleben bleiben, stapeln sich beim Scrollen mehrere gleichzeitig
   übereinander und ihr Text überlappt sich unleserlich. Sticky ist hier ohnehin weniger nützlich
   (kurze, einklappbare Abschnitte statt langer Listen) - deshalb explizit deaktiviert. */
.region-header.no-sticky{ position:static; }
.settings-group-header{
  position:static;
  display:flex; align-items:center; justify-content:space-between; width:100%;
  border:none; background:none; transition:transform .15s ease, opacity .15s ease;
}
.settings-group-header:active{ opacity:.7; transform:scale(.99); }
.settings-group-header .collapse-chevron{ flex:none; stroke:var(--ink-soft); }
/* Wiederverwendete Auf-/Zuklapp-Animation für alles Einklappbare (Einstellungs-Gruppen, erledigte
   Standort-Blöcke im Routen-Tab, die "später fangbar"-Sammelgruppe, ...): Inhalt bleibt immer im
   DOM, grid-template-rows animiert zwischen 0fr und 1fr - braucht keine bekannte/gemessene Höhe,
   funktioniert also unabhängig von variabel langem Karteninhalt. Nutzerfeedback: wirkte bei .32s zu
   abrupt/überraschend - bewusst verlangsamt (.6s) und der Inhalt blendet zusätzlich sanft mit ein/aus
   statt hart an der Höhenkante abgeschnitten zu wirken. */
.collapsible-body{
  display:grid; grid-template-rows:0fr; transition:grid-template-rows .6s cubic-bezier(.4,0,.2,1);
}
.collapsible-body.expanded{ grid-template-rows:1fr; }
.collapsible-body-inner{
  overflow:hidden; min-height:0; opacity:0; transition:opacity .35s ease;
}
.collapsible-body.expanded .collapsible-body-inner{ opacity:1; transition-delay:.2s; }
@media (prefers-reduced-motion: reduce){
  .collapsible-body{ transition:none; }
  .collapsible-body-inner{ transition:none; }
}
.card{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px; margin-bottom:10px; border-left:4px solid var(--line);
}
.card.st-pending{ border-left-color:var(--silver); }
.card.st-failed{ border-left-color:var(--warn); }
.card.st-team{ border-left-color:var(--good); }
.card.st-box{ border-left-color:var(--gold); }
.card.st-dead{ border-left-color:var(--red); opacity:.85; }
.card.st-given{ border-left-color:var(--accent); opacity:.85; }
.card.st-nocatch{ border-left-color:var(--line); opacity:.7; padding-bottom:14px; }
.card.st-nocatch .loc-sub{ margin-top:4px; }
.card.st-nocatch.st-nocatch-done{ border-left-color:var(--good); }
.card[data-current="true"]{ box-shadow:var(--shadow), inset 0 0 0 1.5px var(--accent); }

.card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.card-top > div:first-child{ min-width:0; }
.loc-name{ font-weight:700; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.loc-sub{ font-size:.82rem; color:var(--ink-soft); margin-top:2px; }
.loc-note{
  font-size:.82rem; font-style:italic; color:var(--ink-soft); margin-top:10px; padding:8px 10px;
  background:var(--surface-alt); border-left:3px solid var(--gold); border-radius:8px;
  white-space:pre-wrap; word-break:break-word;
}
.chip{
  font-size:.7rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:4px 9px; border-radius:999px; white-space:nowrap; flex:none;
}
.chip.silver{ background:var(--silver-soft); color:var(--silver); }
.chip.warn{ background:var(--warn-soft); color:var(--warn); }
.chip.good{ background:var(--good-soft); color:var(--good); }
.chip.gold{ background:var(--gold-soft); color:var(--gold); }
.chip.red{ background:var(--red-soft); color:var(--red); }
.chip.accent{ background:var(--accent-soft); color:var(--accent); }
.type-chip-grid{ display:flex; flex-wrap:wrap; gap:6px; }
.type-chip{ font-size:.72rem; padding:5px 10px; }
.type-weak-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }

.pvp-card{ border-left-color:var(--accent); }
.pvp-card.pvp-resolved{ opacity:.9; }
.pvp-badge{
  width:56px; height:56px; border-radius:50%; flex:none;
  background:linear-gradient(155deg, var(--accent-shine), var(--accent) 55%, var(--accent-deep));
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.85rem; letter-spacing:.03em;
}
.pvp-actions{ display:flex; gap:8px; margin-top:12px; }

.starter-card{ border-left-color:var(--evolve); }
.starter-card.starter-resolved{ border-left-color:var(--good); }
.starter-pick-row{ display:flex; gap:8px; margin-top:12px; }
.starter-pick-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--surface-alt); border:none; border-radius:12px; padding:10px 6px;
  font-size:.78rem; font-weight:700; color:var(--ink); text-align:center; min-width:0;
}
.starter-pick-btn:active{ transform:scale(.96); }
.starter-pick-btn span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.starter-pick-btn .starter-type{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
.pvp-actions .btn{ flex:1; }

.card-actions{ display:flex; gap:8px; margin-top:12px; }
.btn{
  border:none; border-radius:12px; padding:12px 14px; font-size:.86rem; font-weight:700;
  min-height:44px; flex:1; transition:transform .15s ease, filter .15s ease;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.45; }
.btn-primary{ background:linear-gradient(155deg, var(--accent-shine), var(--accent) 55%, var(--accent-deep)); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 2px rgba(0,0,0,0.15); }
.btn-secondary{ background:var(--surface-alt); color:var(--ink); }
.btn-ghost{ background:transparent; color:var(--ink-soft); font-weight:600; padding:8px; min-height:auto; flex:none; text-decoration:underline; }
.btn-danger{ background:var(--red-soft); color:var(--red); }
.btn-block{ width:100%; }

.mon-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:2px; }
.mon-name{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.mon-species{ font-size:.8rem; color:var(--ink-soft); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.mon-line{ display:flex; align-items:center; gap:10px; min-width:0; color:inherit; text-decoration:none; }
.mon-line > div:last-child{ min-width:0; }
.mon-sprite{
  flex:none;
  background:var(--surface-alt); border-radius:10px; padding:2px;
}
/* Nur die echten alten Pixel-Sprites (Gen1-5) bekommen hartes Nearest-Neighbor-Scaling fuer den
   knackigen Retro-Look - das moderne Offizial-Artwork (SPRITES_MODERN, siehe spriteFor()) ist
   selbst schon glatt gezeichnet und soll auch beim Skalieren weich bleiben statt kuenstlich
   blockig zu wirken. Siehe isLegacyPixelSprite(). */
.mon-sprite.sprite-legacy{ image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
.sprite-fade{ opacity:0; transition:opacity .25s ease; }
.sprite-fade.loaded{ opacity:1; }
.mon-sprite-placeholder{
  flex:none; background:var(--surface-alt); border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-weight:700; font-size:.85rem;
}
.st-dead .mon-sprite{ filter:grayscale(1) brightness(.8); }
.sprite-preview{
  width:82px; height:82px; flex:none; background:var(--bg); border:1.5px solid var(--line); border-radius:12px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.sprite-preview img{ width:70px; height:70px; }
.sprite-preview img.sprite-legacy{ image-rendering:pixelated; }
.sprite-preview span{ font-size:1.3rem; color:var(--ink-soft); }
.field-row{ display:flex; gap:12px; align-items:center; }
.field-row .field{ flex:1; margin-bottom:0; }
.sheet-mon-header{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
.sheet-mon-header .mon-sprite{ width:88px; height:88px; }

/* mon action rows */
.mon-block{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:2px; }
.mon-actions{ display:flex; gap:6px; flex:none; }
.card > .mon-actions{ margin-top:8px; justify-content:flex-end; }
.mon-line[data-act]{ cursor:pointer; }
.icon-act{
  width:42px; height:42px; border-radius:12px; border:none; flex:none;
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
}
.icon-act:active{ transform:scale(.9); }
.icon-act svg{ width:20px; height:20px; stroke-width:1.9; fill:none; }
.icon-act.tone-gold{ background:var(--gold-soft); } .icon-act.tone-gold svg{ stroke:var(--gold); }
.icon-act.tone-good{ background:var(--good-soft); } .icon-act.tone-good svg{ stroke:var(--good); }
.icon-act.tone-good svg[data-filled="1"]{ fill:var(--good); }
.icon-act.tone-red{ background:var(--red-soft); } .icon-act.tone-red svg{ stroke:var(--red); }
.icon-act.tone-neutral{ background:var(--surface-alt); } .icon-act.tone-neutral svg{ stroke:var(--ink-soft); }
.icon-act.tone-evolve{ background:var(--evolve-soft); } .icon-act.tone-evolve svg{ stroke:var(--evolve); }
.icon-act.small{ width:32px; height:32px; border-radius:9px; }
.icon-act.small svg{ width:15px; height:15px; }

.event-row{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.event-row:last-child{ border-bottom:none; }
.event-icon{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; }
.event-icon svg{ width:15px; height:15px; stroke-width:2; fill:none; }
.event-icon.tone-gold{ background:var(--gold-soft); } .event-icon.tone-gold svg{ stroke:var(--gold); }
.event-icon.tone-good{ background:var(--good-soft); } .event-icon.tone-good svg{ stroke:var(--good); }
.event-icon.tone-red{ background:var(--red-soft); } .event-icon.tone-red svg{ stroke:var(--red); }
.event-icon.tone-neutral{ background:var(--surface-alt); } .event-icon.tone-neutral svg{ stroke:var(--ink-soft); }
.event-icon.tone-evolve{ background:var(--evolve-soft); } .event-icon.tone-evolve svg{ stroke:var(--evolve); }
.event-text{ font-size:.86rem; font-weight:600; line-height:1.4; }
.event-time{ font-size:.72rem; color:var(--ink-soft); margin-top:2px; }

.leaderboard-list{ display:flex; flex-direction:column; gap:10px; }
.leaderboard-row{ padding:12px; border-radius:14px; background:var(--surface-alt); }
.leaderboard-row.active{ box-shadow:inset 0 0 0 1.5px var(--accent); }
.leaderboard-title{ font-weight:700; font-size:.92rem; }
.leaderboard-tag{ font-size:.68rem; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 8px; margin-left:4px; }
.leaderboard-sub{ font-size:.76rem; color:var(--ink-soft); margin-top:2px; margin-bottom:10px; }
.leaderboard-stats{ display:flex; gap:8px; }
.leaderboard-stats > div{ flex:1; background:var(--surface); border-radius:10px; padding:8px 6px; text-align:center; }
.leaderboard-stats span{ display:block; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1rem; font-weight:800; color:var(--accent); }
.leaderboard-stats label{ display:block; font-size:.64rem; color:var(--ink-soft); margin-top:2px; }

/* Änderungsprotokoll-Sheet: Inhalt (CHANGELOG_HTML) stammt 1:1 aus dem separat veröffentlichten
   Changelog-Artifact, hier nur mit App-eigenen Design-Tokens statt dessen eigener Palette
   nachgestylt, damit es sich hell/dunkel wie der Rest der App verhält. */
.changelog-sheet{ font-size:.92rem; }
.changelog-sheet .lede{ font-size:.88rem; line-height:1.6; color:var(--ink-soft); margin:0 0 18px; }
.changelog-sheet .lede strong{ color:var(--ink); font-weight:650; }
.changelog-sheet .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:24px; }
.changelog-sheet .stat{ background:var(--surface); padding:12px 10px; text-align:center; }
.changelog-sheet .stat .n{ font-size:1.2rem; font-weight:800; color:var(--accent); line-height:1.1; }
.changelog-sheet .stat .l{ font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:4px; }
.changelog-sheet .log{ position:relative; }
.changelog-sheet .log::before{ content:""; position:absolute; left:7px; top:10px; bottom:10px; width:1.5px; background:var(--line); }
.changelog-sheet .entry{ position:relative; padding:0 0 28px 30px; }
.changelog-sheet .entry:last-child{ padding-bottom:0; }
.changelog-sheet .entry::before{ content:""; position:absolute; left:0; top:5px; width:13px; height:13px; border-radius:50%; background:var(--surface); border:2.5px solid var(--accent); }
.changelog-sheet .entry.baseline::before{ border-color:var(--ink-soft); background:var(--surface-alt); }
.changelog-sheet .entry-head{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
.changelog-sheet .ver{ font-family:var(--font-mono); font-size:1rem; font-weight:700; color:var(--ink); }
.changelog-sheet .baseline .ver{ color:var(--ink-soft); }
.changelog-sheet .tag{ font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2.5px 8px; border-radius:20px; }
.changelog-sheet .tag-feat{ background:var(--good-soft); color:var(--good); }
.changelog-sheet .tag-fix{ background:var(--warn-soft); color:var(--warn); }
.changelog-sheet .tag-note{ background:var(--accent-soft); color:var(--accent); }
.changelog-sheet .entry h3{ font-size:.95rem; font-weight:700; margin:0 0 6px; line-height:1.4; }
.changelog-sheet .entry p{ font-size:.86rem; line-height:1.58; color:var(--ink-soft); margin:0 0 8px; }
.changelog-sheet .entry p:last-child{ margin-bottom:0; }
.changelog-sheet .entry ul{ margin:6px 0 8px; padding-left:18px; }
.changelog-sheet .entry li{ font-size:.86rem; line-height:1.55; color:var(--ink-soft); margin-bottom:4px; }
.changelog-sheet .entry li:last-child{ margin-bottom:0; }
.changelog-sheet .entry code{ font-family:var(--font-mono); font-size:.88em; background:var(--surface-alt); padding:.1em .4em; border-radius:5px; color:var(--ink); }
.changelog-sheet .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.changelog-sheet .chip{ display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; padding:3px 9px 3px 7px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--line); color:var(--ink-soft); }
.changelog-sheet .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.changelog-sheet .fork-divider{ position:relative; padding:0 0 28px 30px; margin-top:2px; }
.changelog-sheet .fork-divider::before{ content:""; position:absolute; left:0; top:5px; width:13px; height:13px; border-radius:50%; background:var(--ink-soft); }
.changelog-sheet .fork-divider h2{ font-size:.9rem; font-weight:700; margin:0 0 5px; }
.changelog-sheet .fork-divider p{ font-size:.8rem; line-height:1.55; color:var(--ink-soft); margin:0; }
.changelog-sheet .followups{ margin-top:32px; padding-top:20px; border-top:1px solid var(--line); }
.changelog-sheet .followups + .followups{ margin-top:20px; padding-top:0; border-top:none; }
.changelog-sheet .followups h2{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin:0 0 12px; }
.changelog-sheet .followup-item{ background:var(--surface-alt); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:11px 13px; font-size:.82rem; line-height:1.55; color:var(--ink-soft); margin-bottom:8px; }
.changelog-sheet .followup-item:last-child{ margin-bottom:0; }
.changelog-sheet .followup-item strong{ color:var(--ink); }
.changelog-sheet footer{ margin-top:32px; padding-top:14px; border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-soft); }
.changelog-sheet .jump-ideas-btn{ display:inline-flex; align-items:center; gap:7px; font-size:.82rem; font-weight:700; color:var(--accent); text-decoration:none; background:var(--accent-soft); border:1px solid transparent; padding:9px 16px; border-radius:999px; margin:0 0 24px; cursor:pointer; }
.changelog-sheet .jump-ideas-btn svg{ width:14px; height:14px; stroke:currentColor; stroke-width:2.4; fill:none; flex:none; }

.boss-sprite{ background:var(--surface-alt); border-radius:10px; padding:2px; flex:none; object-fit:contain; }
.boss-level-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.boss-level-main{ display:flex; align-items:baseline; gap:8px; }
.boss-level-num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.3rem; font-weight:700; }
.boss-percent-pill{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:.74rem; font-weight:700;
  padding:3px 9px; border-radius:999px; background:var(--surface-alt); color:var(--ink-soft);
}
.boss-percent-pill.active{ background:var(--evolve-soft); color:var(--evolve); }
.boss-ace{ display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-soft); }
.boss-actions{ display:flex; gap:8px; margin-top:10px; }
.boss-actions .btn{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.boss-actions .btn-block{ flex:1; font-family:var(--font-body); font-variant-numeric:normal; }

/* Lang-Drücken-Bestätigung (z.B. "Sieg zurücknehmen"): ein Balken füllt sich während des
   Gedrückthaltens von links nach rechts, die Aktion feuert erst wenn er komplett gefüllt ist -
   ein kurzer Tap allein reicht bewusst nicht (siehe longPressPointerDown/-Up). */
.btn-longpress{ position:relative; overflow:hidden; }
.btn-longpress-fill{
  position:absolute; inset:0; background:rgba(255,255,255,.28);
  transform-origin:left; transform:scaleX(0); pointer-events:none;
}
.btn-longpress.holding .btn-longpress-fill{ transition:transform 650ms linear; transform:scaleX(1); }
.btn-longpress-label{ position:relative; }
.boss-bulk{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:14px;
}
.boss-bulk .field-row{ flex:1 1 100%; }
.boss-bulk .loc-sub{ margin-top:3px; }
.boss-bulk-actions{ display:flex; gap:8px; flex:none; }
.boss-bulk-actions .btn{ min-height:40px; padding:9px 14px; font-family:var(--font-mono); }

.title-picker{ display:flex; flex-wrap:wrap; gap:8px; }
.title-pill{
  padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface-alt);
  font-size:.82rem; font-weight:700; color:var(--ink-soft);
}
.title-pill.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.achievements-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
.achievement-row{ display:flex; gap:12px; align-items:flex-start; padding:10px; border-radius:14px; background:var(--surface-alt); }
.achievement-row.locked{ opacity:.55; }
.achievement-icon{ font-size:1.5rem; line-height:1; flex:none; width:30px; text-align:center; }
.achievement-name{ font-weight:700; font-size:.92rem; }
.achievement-desc{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; }
.achievement-title-tag{ font-size:.74rem; color:var(--accent); font-weight:700; margin-top:4px; }
.hidden-achievement .achievement-name{ font-style:italic; color:var(--ink-soft); }

.boss-card{ position:relative; }
.boss-card.boss-done{ border-left-color:var(--good); }
.boss-card.boss-done .loc-name{ color:var(--good); }
.boss-card.boss-done .boss-sprite,
.boss-card.boss-done .mon-sprite-placeholder{ filter:grayscale(1) brightness(.8); }
.boss-card.boss-done-loss{ border-left-color:var(--red); }
.boss-card.boss-done-loss .loc-name{ color:var(--red); }
.boss-card.boss-done-loss .boss-sprite,
.boss-card.boss-done-loss .mon-sprite-placeholder{ filter:grayscale(1) brightness(.8); }
.boss-defeat-badge{
  position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
  background:var(--good); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; z-index:1;
}
.boss-defeat-badge.badge-loss{ background:var(--red); }
.boss-defeat-badge svg{ width:15px; height:15px; stroke:#fff; stroke-width:2.6; fill:none; }

.boss-orden-badge{
  position:absolute; top:8px; left:8px; width:30px; height:30px; border-radius:50%;
  background:var(--surface); box-shadow:var(--shadow); border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center; z-index:1; padding:3px;
}
.boss-orden-badge img{ width:100%; height:100%; object-fit:contain; }

.orden-card{ padding:16px; }
.orden-card-head{
  display:flex; align-items:baseline; justify-content:space-between;
  font-weight:700; font-size:.92rem; margin-bottom:12px;
}
.orden-count{ font-size:.8rem; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.orden-strip{ display:grid; grid-template-columns:repeat(4,1fr); justify-items:center; gap:10px; }
.orden-chip{
  width:56px; height:56px; border-radius:50%; background:var(--surface-alt);
  border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  padding:8px; flex:none;
}
.orden-chip img{ width:100%; height:100%; object-fit:contain; filter:grayscale(1) opacity(.45); }
.orden-chip.earned{
  border-color:var(--gold); background:var(--gold-soft);
  box-shadow:0 0 0 1px var(--gold) inset, 0 3px 10px rgba(var(--gold-glow,169,118,46),.25);
}
.orden-chip.earned img{ filter:none; }

/* Orden-Schatulle: kompakte, klickbare Kachel neben dem Levelcap statt der vollen, immer
   ausgeklappten Orden-Karte (nahm zu viel vertikale Fläche im Team-Tab ein) - öffnet per Klick
   die vollen, größeren Orden per bestehender Auf-/Zuklapp-Animation (.collapsible-body,
   grid-template-rows 0fr<->1fr, s.o.) darunter. Der Deckel-Pfad der Schatulle selbst dreht sich
   dabei per eigener Transition auf, als kleine zusätzliche Öffnungs-Geste am Auslöser-Element. */
.team-top-row{ display:flex; gap:10px; align-items:stretch; margin-bottom:10px; }
.team-top-row > .card{ margin-bottom:0; }
.team-top-row > .card:not(.orden-case-btn):not(.type-coverage-btn){ flex:1; min-width:0; }
.levelcap-card{ padding:10px 12px; }
.levelcap-card .loc-name{ font-size:.86rem; }
.levelcap-card .loc-sub{ font-size:.76rem; }
.levelcap-card .chip{ font-size:.66rem; padding:3px 8px; }
.orden-case-btn{
  flex:none; width:72px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; cursor:pointer; font:inherit; color:inherit; appearance:none; -webkit-appearance:none;
  border:none; padding:10px 6px; -webkit-tap-highlight-color:transparent;
  transition:transform .3s cubic-bezier(.34,1.4,.4,1);
}
.orden-case-btn:active{ transform:scale(.94); }
.orden-case-btn.open{ transform:scale(1.07); box-shadow:0 0 0 2px var(--gold), var(--shadow); }
.orden-case-icon{ width:32px; height:32px; overflow:visible; fill:none; stroke-width:1.7; stroke:var(--gold); }
.orden-case-icon .chest-base{ fill:var(--gold-soft); }
.orden-case-icon .chest-lid{
  fill:var(--gold-soft); transform-origin:5px 11px; transition:transform .45s cubic-bezier(.34,1.2,.4,1);
}
.orden-case-btn.open .orden-case-icon .chest-lid{ transform:rotate(-58deg) translateY(-1px); }
.orden-case-count{ font-size:.72rem; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.orden-case-body{ margin-bottom:10px; }

/* Typabdeckung-Button: ersetzt den vollbreiten "Typabdeckung anzeigen"-Button durch dieselbe
   kompakte Symbol-Kachel wie die Orden-Schatulle - Icon lehnt sich an die Regenbogen-Energie aus
   dem Pokemon-TCG an (Ring aus allen Typfarben um einen silbrigen Kern), da sie fuer "deckt alle
   Typen ab" bereits ein etabliertes, sofort erkennbares Symbol ist. */
.type-coverage-btn{
  flex:none; width:72px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; cursor:pointer; font:inherit; color:inherit; appearance:none; -webkit-appearance:none;
  border:none; padding:10px 6px; -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease;
}
.type-coverage-btn:active{ transform:scale(.94); }
.type-coverage-icon{
  width:32px; height:32px; border-radius:50%; position:relative;
  background:conic-gradient(from -90deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
  box-shadow:0 0 0 1px var(--line) inset, 0 2px 6px rgba(0,0,0,.18);
}
.type-coverage-icon::after{
  content:""; position:absolute; inset:8px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff 0%, #dbe3ea 55%, #97a3b0 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.55) inset;
}
.type-coverage-label{ font-size:.72rem; font-weight:700; color:var(--ink-soft); }

.final-rival-card{
  position:relative; border-left-color:var(--gold);
  background:linear-gradient(165deg, var(--surface), var(--gold-soft) 145%);
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(var(--gold-glow),.25);
}
.final-rival-card .chip.gold{ letter-spacing:.05em; }
.final-rival-card.final-rival-done .loc-name{ color:var(--gold); }
.hall-of-fame-card{
  border-left-color:var(--gold); background:linear-gradient(165deg, var(--surface), var(--gold-soft) 160%);
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(var(--gold-glow),.25);
}
.hall-of-fame-card .mon-species{ font-size:.68rem; color:var(--ink-soft); margin-top:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hof-grid{
  display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:repeat(2, 1fr); gap:8px;
  margin-bottom:16px;
}
.hof-slot{
  background:var(--surface-alt); border-radius:12px; border:1.5px dashed var(--line);
  padding:8px 4px; min-height:74px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.hof-slot.filled{ border-style:solid; border-color:var(--good); background:var(--surface); }

@media (prefers-reduced-motion: no-preference){
  @keyframes evolveFlash{
    0%{ box-shadow:0 0 0 0 rgba(var(--evolve-glow),0); filter:brightness(1) saturate(1); transform:scale(1); }
    25%{ box-shadow:0 0 0 3px rgba(var(--evolve-glow),.9), 0 0 18px 6px rgba(var(--evolve-glow),.7); filter:brightness(1.7) saturate(.3); transform:scale(1.18); }
    55%{ box-shadow:0 0 0 3px rgba(var(--evolve-glow),.5), 0 0 10px 3px rgba(var(--evolve-glow),.35); filter:brightness(1.3) saturate(.6); transform:scale(1.08); }
    100%{ box-shadow:0 0 0 0 rgba(var(--evolve-glow),0); filter:brightness(1) saturate(1); transform:scale(1); }
  }
  .mon-sprite.evolve-flash{ animation:evolveFlash 1000ms ease-out; }

  /* Hervorhebung der per Standort-Suche angesprungenen Kachel - nutzt bewusst dieselbe
     "--evolve-glow"-Variable wie evolveFlash (nur als generischer Aufmerksamkeits-Farbton, kein
     inhaltlicher Bezug zu Entwicklungen), damit kein zusätzlicher Theme-Token für hell/dunkel +
     alle Editions-Akzentfarben gepflegt werden muss. */
  @keyframes searchJumpFlash{
    0%{ box-shadow:0 0 0 0 rgba(var(--evolve-glow),0); }
    20%{ box-shadow:0 0 0 3px rgba(var(--evolve-glow),.85), 0 0 16px 5px rgba(var(--evolve-glow),.5); }
    100%{ box-shadow:0 0 0 0 rgba(var(--evolve-glow),0); }
  }
  .card.search-highlight{ animation:searchJumpFlash 1300ms ease-out; }

  @keyframes bossDefeatBurst{
    0%{ box-shadow:0 0 0 0 rgba(var(--good-glow),0); transform:scale(1) rotate(0deg); }
    18%{ box-shadow:0 0 0 3px rgba(var(--good-glow),.9), 0 0 22px 8px rgba(var(--good-glow),.65); transform:scale(1.04) rotate(-1deg); }
    38%{ transform:scale(.985) rotate(1deg); }
    60%{ box-shadow:0 0 0 2px rgba(var(--good-glow),.45), 0 0 14px 4px rgba(var(--good-glow),.3); transform:scale(1.015) rotate(0deg); }
    100%{ box-shadow:0 0 0 0 rgba(var(--good-glow),0); transform:scale(1) rotate(0deg); }
  }
  .boss-card.boss-defeat-flash{ animation:bossDefeatBurst 900ms cubic-bezier(.34,1.2,.32,1); }
  @keyframes bossCheckPop{
    0%{ transform:scale(0) rotate(-30deg); opacity:0; }
    55%{ transform:scale(1.3) rotate(8deg); opacity:1; }
    75%{ transform:scale(.9) rotate(-4deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .boss-card.boss-defeat-flash .boss-defeat-badge{ animation:bossCheckPop 640ms cubic-bezier(.34,1.56,.64,1) 60ms both; }
  @keyframes bossSparkle{
    0%{ transform:scale(0); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }
  .boss-card.boss-defeat-flash::after{
    content:""; position:absolute; inset:0; border-radius:var(--radius); pointer-events:none;
    background:
      radial-gradient(circle, rgba(var(--good-glow),.9) 0 3px, transparent 4px) 14% 18%,
      radial-gradient(circle, rgba(var(--good-glow),.9) 0 3px, transparent 4px) 85% 22%,
      radial-gradient(circle, rgba(var(--good-glow),.9) 0 3px, transparent 4px) 92% 70%,
      radial-gradient(circle, rgba(var(--good-glow),.9) 0 3px, transparent 4px) 8% 78%,
      radial-gradient(circle, rgba(var(--good-glow),.9) 0 3px, transparent 4px) 50% 6%;
    background-repeat:no-repeat;
    animation:bossSparkle 750ms ease-out both;
  }

  @keyframes hallOfFameBurst{
    0%{ box-shadow:0 0 0 0 rgba(var(--gold-glow),0); filter:brightness(1) saturate(1); transform:scale(1) rotate(0deg); }
    16%{ box-shadow:0 0 0 4px rgba(var(--gold-glow),1), 0 0 32px 12px rgba(var(--gold-glow),.75); filter:brightness(1.5) saturate(1.15); transform:scale(1.06) rotate(-1.2deg); }
    40%{ transform:scale(.98) rotate(1deg); }
    65%{ box-shadow:0 0 0 3px rgba(var(--gold-glow),.55), 0 0 20px 6px rgba(var(--gold-glow),.4); transform:scale(1.02) rotate(0deg); }
    100%{ box-shadow:0 0 0 0 rgba(var(--gold-glow),0); filter:brightness(1) saturate(1); transform:scale(1) rotate(0deg); }
  }
  .final-rival-card.hall-of-fame-flash{ animation:hallOfFameBurst 1400ms cubic-bezier(.34,1.2,.32,1); }
  @keyframes hallOfFameSparkle{
    0%{ transform:scale(0) rotate(0deg); opacity:1; }
    100%{ transform:scale(1.3) rotate(50deg); opacity:0; }
  }
  .final-rival-card.hall-of-fame-flash::after{
    content:""; position:absolute; inset:0; border-radius:var(--radius); pointer-events:none;
    background:
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 4px, transparent 5px) 10% 14%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 4px, transparent 5px) 88% 18%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 4px, transparent 5px) 94% 62%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 4px, transparent 5px) 6% 68%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 4px, transparent 5px) 50% 4%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 3px, transparent 4px) 30% 90%,
      radial-gradient(circle, rgba(var(--gold-glow),.95) 0 3px, transparent 4px) 70% 88%;
    background-repeat:no-repeat;
    animation:hallOfFameSparkle 1100ms ease-out both;
  }

  @keyframes hallOfFameDefeat{
    0%{ box-shadow:0 0 0 0 rgba(var(--red-glow),0); filter:brightness(1) saturate(1); transform:translateX(0) translateY(0) rotate(0deg); }
    12%{ box-shadow:0 0 0 3px rgba(var(--red-glow),.85), 0 0 22px 7px rgba(var(--red-glow),.5); filter:brightness(.82) saturate(.6); transform:translateX(-7px) rotate(-.6deg); }
    24%{ transform:translateX(6px) rotate(.6deg); }
    36%{ transform:translateX(-4px) rotate(-.3deg); }
    48%{ box-shadow:0 0 0 2px rgba(var(--red-glow),.5), 0 0 14px 4px rgba(var(--red-glow),.3); transform:translateX(3px) rotate(.2deg); }
    60%{ transform:translateX(-1px) rotate(0deg); }
    100%{ box-shadow:0 0 0 0 rgba(var(--red-glow),0); filter:brightness(1) saturate(1); transform:translateX(0) translateY(3px) rotate(0deg); }
  }
  .final-rival-card.hall-of-fame-flash-loss{ animation:hallOfFameDefeat 900ms cubic-bezier(.36,.07,.19,.97); }

  @keyframes confettiFall{
    0%{ transform:translateY(-12vh) translateX(0) rotate(0deg); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(112vh) translateX(var(--drift,0px)) rotate(var(--spin,540deg)); opacity:.85; }
  }
  .confetti-layer{
    position:fixed; inset:0; z-index:60; pointer-events:none; overflow:hidden;
  }
  .confetti-piece{
    position:absolute; top:0; left:0; opacity:0;
    animation-name:confettiFall; animation-timing-function:cubic-bezier(.36,.2,.4,1); animation-fill-mode:forwards;
  }

  @keyframes championCardIn{
    0%{ transform:scale(.85) translateY(10px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes championTrophyPop{
    0%{ transform:scale(0) rotate(-20deg); }
    60%{ transform:scale(1.25) rotate(6deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .champion-card{ animation:championCardIn 420ms cubic-bezier(.34,1.2,.32,1) both; }
  .champion-trophy{ animation:championTrophyPop 700ms cubic-bezier(.34,1.56,.64,1) 150ms both; }
  .game-over-card{ animation:championCardIn 420ms cubic-bezier(.34,1.2,.32,1) both; }
  .game-over-icon{ animation:championTrophyPop 700ms cubic-bezier(.34,1.56,.64,1) 150ms both; }

  @keyframes achievementToastIn{
    0%{ transform:translateX(-50%) translateY(-16px) scale(.96); opacity:0; }
    100%{ transform:translateX(-50%) translateY(0) scale(1); opacity:1; }
  }
  .achievement-toast{ animation:achievementToastIn 380ms cubic-bezier(.34,1.4,.4,1) both; }
  .achievement-toast.out{ transition:opacity .22s ease, transform .22s ease; }
}

.champion-overlay{
  position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(10,8,4,0.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.champion-card{
  background:var(--surface); border-radius:24px; padding:32px 26px 26px; max-width:360px; width:100%;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(var(--gold-glow),.3);
}

.champion-sub{ font-size:.88rem; color:var(--ink-soft); margin-bottom:20px; }
.champion-stats{ display:flex; gap:10px; margin-bottom:22px; }
.champion-stats > div{ flex:1; background:var(--surface-alt); border-radius:14px; padding:12px 8px; }
.champion-stats span{ display:block; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.15rem; font-weight:800; color:var(--gold); }
.champion-stats label{ display:block; font-size:.68rem; color:var(--ink-soft); margin-top:3px; }

/* Spiegelt .champion-overlay/-card 1:1, aber als Niederlage gerahmt (rot statt gold, kein Konfetti) -
   für den kompletten Team-Wipe (alle jemals gefangenen Pokémon tot), siehe checkGameOver(). */
.game-over-overlay{
  position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(10,8,4,0.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.game-over-card{
  background:var(--surface); border-radius:24px; padding:32px 26px 26px; max-width:360px; width:100%;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(var(--red-glow),.3);
}
.game-over-icon{ font-size:3.2rem; line-height:1; margin-bottom:6px; }
.game-over-card h2{ font-size:1.3rem; font-weight:800; margin:4px 0 4px; color:var(--red); }
.game-over-sub{ font-size:.88rem; color:var(--ink-soft); margin-bottom:20px; }
.game-over-stats{ display:flex; gap:10px; margin-bottom:22px; }
.game-over-stats > div{ flex:1; background:var(--surface-alt); border-radius:14px; padding:12px 8px; }
.game-over-stats span{ display:block; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.15rem; font-weight:800; color:var(--red); }
.game-over-stats label{ display:block; font-size:.68rem; color:var(--ink-soft); margin-top:3px; }

/* Aktive Tour (siehe ONBOARDING_STEPS weiter unten): .tour-block ist ein unsichtbarer, aber
   klickfester Vollbild-Layer (fängt alle Taps ab, damit während der Tour nichts an der echten
   Oberfläche darunter ausgelöst wird - bewusst KEINE echte Interaktion, siehe playOnboardingDemo()
   für simulierte Demos ohne echten State-Zugriff). .tour-spotlight liegt darüber und erzeugt per
   Box-Shadow-Trick (riesiger Spread) ein "Loch" exakt über dem echten Zielelement, das dadurch
   trotz des abgedunkelten Rests sichtbar bleibt - pointer-events:none, damit Taps im ausgeleuchteten
   Bereich trotzdem beim .tour-block darunter landen (blockiert), nicht am echten Element. */
.tour-block{ position:fixed; inset:0; z-index:76; transition:background .25s ease; }
.tour-spotlight{
  position:fixed; z-index:76; border-radius:16px; pointer-events:none;
  box-shadow:0 0 0 9999px rgba(10,8,4,0.62);
  transition:top .3s ease, left .3s ease, width .3s ease, height .3s ease, opacity .22s ease;
}
.tour-spotlight.tour-fade-out{ opacity:0; }
.tour-card{
  position:fixed; z-index:77; left:50%; transform:translateX(-50%);
  background:var(--surface); border-radius:20px; padding:20px 20px 18px; max-width:340px; width:calc(100% - 32px);
  box-shadow:0 20px 60px rgba(0,0,0,0.4); transition:top .3s ease, opacity .22s ease;
}
.tour-card.centered{ top:50% !important; transform:translate(-50%,-50%); text-align:center; }
.tour-card.tour-fade-out{ opacity:0; }
.tour-card-skip{
  position:absolute; top:12px; right:12px; background:none; border:none; font-size:.76rem; font-weight:700;
  color:var(--ink-soft); padding:6px 8px; cursor:pointer;
}
.tour-card-icon{ font-size:2.2rem; line-height:1; margin-bottom:8px; }
.tour-card h2{ font-size:1.05rem; font-weight:800; margin:2px 0 8px; }
.tour-card-text{ font-size:.86rem; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; }
.tour-progress{ display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
.tour-progress-icon{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-alt); color:var(--ink-soft); opacity:.5; transition:opacity .2s, background .2s, color .2s;
}
.tour-progress-icon svg{ width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; }
.tour-progress-icon.active{ opacity:1; background:var(--accent); color:#fff; }
.tour-progress-icon.done{ opacity:.85; }
.tour-actions{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.tour-actions .btn{ flex:1; }
/* Simulierte Demo (siehe playOnboardingDemo()): rein visuell, fasst nie echten State an. */
.tour-demo-ripple{
  position:fixed; z-index:78; width:16px; height:16px; margin:-8px; border-radius:50%; background:var(--accent);
  pointer-events:none; opacity:.9; animation:tourRipple .6s ease-out forwards;
}
@keyframes tourRipple{ from{ transform:scale(0.3); opacity:.9; } to{ transform:scale(6); opacity:0; } }
.tour-demo-badge{
  position:fixed; z-index:78; left:50%; transform:translate(-50%,6px); background:var(--ink-soft); color:#fff;
  font-size:.78rem; font-weight:700; padding:6px 12px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.25);
  opacity:0; transition:opacity .25s ease, transform .25s ease, background .25s ease; pointer-events:none; white-space:nowrap;
}
.tour-demo-badge.show{ opacity:1; transform:translate(-50%,0); }
.tour-demo-badge.tone-good{ background:var(--good); }
.tour-demo-badge.tone-red{ background:var(--red); }
.tour-demo-badge.tone-neutral{ background:var(--accent); }

/* Kleine "Zyklen"-Tour (siehe TOUR_CYCLES weiter unten): Experimenteller zweiter Tour-Stil neben
   der bestehenden großen Erste-Schritte-Tour - Nutzerfeedback zur großen Karte war, dass sie zu
   viel abdeckt und die Hervorhebung dahinter kaum noch wirkt, außerdem wirkten die Übergänge
   zwischen Stationen zu schnell. .tour-tip ist deshalb bewusst klein (kurzer Ein-Satz-Text statt
   Titel+Absatz+Fortschrittspunkte+zwei Buttons) und sitzt dicht neben statt über dem
   hervorgehobenen Element, damit die eigentliche Hervorhebung (.tour-spotlight, unverändert
   wiederverwendet) klar sichtbar bleibt. Die Übergänge zwischen Stationen nutzen bewusst deutlich
   längere Zeiten als die große Tour (siehe renderCycleStep()) und ein "smooth" statt "instant"
   Scrollen, damit man dem Sprung zur nächsten Station als Mensch tatsächlich folgen kann. */
.tour-tip{
  position:fixed; z-index:77; max-width:220px; width:calc(100% - 56px);
  background:var(--surface); border-radius:14px; padding:12px 14px 10px;
  box-shadow:0 14px 36px rgba(0,0,0,.32), inset 0 0 0 1px var(--line);
  transition:top .3s ease, left .3s ease, opacity .3s ease;
}
.tour-tip.tour-fade-out{ opacity:0; }
.tour-tip-text{ font-size:.82rem; line-height:1.45; color:var(--ink); margin-bottom:10px; }
.tour-tip-foot{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.tour-tip-dots{ display:flex; gap:4px; }
.tour-tip-dot{ width:5px; height:5px; border-radius:50%; background:var(--line); flex:none; }
.tour-tip-dot.active{ background:var(--accent); width:12px; border-radius:3px; }
.tour-tip-actions{ display:flex; align-items:center; gap:2px; }
.tour-tip-skip{ background:none; border:none; font-size:.7rem; color:var(--ink-faint); padding:6px 6px; cursor:pointer; }
.tour-tip-next{ background:none; border:none; font-size:.8rem; font-weight:800; color:var(--accent); padding:6px 8px; cursor:pointer; }

.achievement-toast{
  position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  z-index:80; max-width:320px; width:calc(100% - 32px);
  background:var(--surface); border-radius:18px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start;
  box-shadow:0 12px 32px rgba(0,0,0,.28), inset 0 0 0 1px rgba(var(--gold-glow),.4);
  cursor:pointer;
}
.achievement-toast.out{ opacity:0; transform:translateX(-50%) translateY(-10px); }
.achievement-toast-icon{ font-size:1.6rem; line-height:1; flex:none; }
.achievement-toast-label{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); }
.achievement-toast-name{ font-size:.98rem; font-weight:800; color:var(--ink); margin-top:1px; }
.achievement-toast-sub{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; }

.undo-toast{
  position:fixed; left:50%; bottom:calc(160px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:80; max-width:360px; width:calc(100% - 32px); touch-action:pan-y;
  background:var(--surface); border-radius:14px; padding:12px 8px 12px 16px;
  display:flex; align-items:center; gap:10px; justify-content:space-between;
  box-shadow:0 12px 32px rgba(0,0,0,.28), inset 0 0 0 1px var(--line);
  animation:undoToastIn 260ms cubic-bezier(.34,1.4,.4,1) both;
}
.undo-toast.out{ transition:opacity .2s ease, transform .2s ease; opacity:0; transform:translateX(-50%) translateY(10px); }
.undo-toast-label{ font-size:.86rem; font-weight:600; color:var(--ink); }
.undo-toast-btn{
  flex:none; background:none; border:none; color:var(--accent); font-weight:800;
  font-size:.86rem; padding:8px 10px; cursor:pointer;
}
@keyframes undoToastIn{
  from{ opacity:0; transform:translateX(-50%) translateY(10px); }
  to{ opacity:1; transform:translateX(-50%) translateY(0); }
}

.fab{
  position:absolute; right:18px; bottom:calc(88px + env(safe-area-inset-bottom)); z-index:15;
  width:56px; height:56px; border-radius:50%; background:linear-gradient(155deg, var(--accent-shine), var(--accent) 55%, var(--accent-deep)); color:#fff;
  border:none; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 2px rgba(0,0,0,0.15); display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; line-height:1;
}
.fab:active{ transform:scale(.94); }

.jump-fab{
  position:absolute; left:16px; bottom:calc(88px + env(safe-area-inset-bottom)); z-index:15;
  display:flex; align-items:center; gap:7px; border:none; border-radius:999px;
  background:var(--surface); color:var(--ink); box-shadow:var(--shadow);
  padding:11px 16px 11px 12px; font-size:.8rem; font-weight:700;
  opacity:0; pointer-events:none; transform:translateY(8px);
  transition:opacity .2s ease, transform .2s ease;
}
.jump-fab.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }
.jump-fab svg{ width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2.2; flex:none; transition:transform .2s ease; }
.jump-fab.point-up svg{ transform:rotate(180deg); }
.jump-fab:active{ transform:scale(.95); }

/* Schnellzugriff auf manuell zurückgestellte ("später fangbar") Standorte, ohne erst zur jeweiligen
   Region scrollen und den dortigen Stash-Toggle suchen zu müssen (Nutzerfeedback) - nur sichtbar,
   wenn überhaupt etwas zurückgestellt ist. Links über dem "Zum aktuellen Standort"-Button gestapelt,
   analog zum rechten Stapel (Karte über Suche über "+"). */
.stash-fab{
  position:absolute; left:16px; bottom:calc(154px + env(safe-area-inset-bottom)); z-index:15;
  width:44px; height:44px; border-radius:50%; background:var(--gold-soft); color:var(--gold);
  border:none; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center;
}
.stash-fab svg{ width:19px; height:19px; stroke:var(--gold); fill:none; stroke-width:2.2; }
.stash-fab:active{ transform:scale(.94); }

/* Flug-Klon beim Zurückstellen einer Kachel (siehe flyTileToStash) - fixiert an der ursprünglichen
   Bildschirmposition, wird per Web-Animations-API zum Stash-FAB hin verkleinert/ausgeblendet. */
.stash-fly-tile{
  position:fixed; z-index:60; pointer-events:none; margin:0 !important; top:0; left:0;
}
@media (prefers-reduced-motion: no-preference){
  @keyframes stashFabPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.22); }
    100%{ transform:scale(1); }
  }
  .stash-fab.pulse{ animation:stashFabPulse 450ms ease-out; }
}

/* Eigener kleiner FAB statt Erweiterung von .fab (dem "+"-Button) - beide bleiben unabhängig
   antippbar, ohne dass ein kombinierter Button zwei Aktionen verwechselbar macht. Direkt über dem
   "+"-Button gestapelt (56px Höhe + 10px Abstand), da rechts unten sonst ungenutzt bliebe. */
.search-fab{
  position:absolute; right:18px; bottom:calc(154px + env(safe-area-inset-bottom)); z-index:15;
  width:44px; height:44px; border-radius:50%; background:var(--surface); color:var(--ink);
  border:none; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
}
.search-fab svg{ width:19px; height:19px; stroke:var(--ink); fill:none; stroke-width:2.2; }
.search-fab:active{ transform:scale(.94); }

/* Dritter FAB, nur sichtbar wenn die aktuelle Edition eine Region-Karte hat (Prototyp: nur
   Rot/Blau) - direkt über dem Such-FAB gestapelt, aus demselben Grund wie dessen eigener Kommentar. */
.map-fab{
  position:absolute; right:18px; bottom:calc(210px + env(safe-area-inset-bottom)); z-index:15;
  width:44px; height:44px; border-radius:50%; background:var(--surface); color:var(--ink);
  border:none; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center;
}
.map-fab svg{ width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2; }
.map-fab:active{ transform:scale(.94); }

.map-mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
.map-mode-toggle .btn{ flex:1; padding:9px 14px; min-height:auto; font-size:.82rem; }

.schema-map{ display:flex; flex-direction:column; position:relative; padding:4px 0; }
.schema-map::before{
  content:""; position:absolute; left:21px; top:18px; bottom:18px; width:2px; background:var(--line);
}
.schema-node{
  display:flex; align-items:center; gap:14px; padding:7px 4px; background:none; border:none;
  text-align:left; position:relative; z-index:1; min-height:auto;
}
.schema-dot{
  width:14px; height:14px; border-radius:50%; background:var(--surface-alt); border:2px solid var(--line);
  flex:none;
}
.schema-node.done .schema-dot{ background:var(--good); border-color:var(--good); }
.schema-node.current .schema-dot{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.schema-label{ font-size:.85rem; font-weight:600; }
.schema-node.done .schema-label{ color:var(--ink-soft); }

.artwork-map{ position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
.artwork-map img{ width:100%; display:block; }
.map-pin{
  position:absolute; width:15px; height:15px; margin:-7px 0 0 -7px; border-radius:50%;
  background:var(--surface); border:2.5px solid var(--ink-soft); padding:0; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.map-pin.done{ background:var(--good); border-color:var(--good); }
.map-pin.current{ background:var(--accent); border-color:var(--accent); width:19px; height:19px; margin:-9px 0 0 -9px; }

/* Vorher reiner Text+Icon ohne Kontur/Hintergrund - auf Touchscreens nicht als eigenständig
   tappbares Element erkennbar (Nutzerfeedback). Jetzt mit Kartenoptik (Hintergrund, Rand, Radius,
   Schatten) wie alle anderen tappbaren Flächen der App, damit die Zeile klar als Button lesbar ist. */
.collapse-toggle{
  display:flex; align-items:center; gap:8px; width:100%;
  border:1px solid var(--line); background:var(--surface-alt); border-radius:var(--radius);
  box-shadow:var(--shadow); color:var(--ink-soft); font-size:.82rem; font-weight:700;
  padding:12px 14px; margin-bottom:10px; text-align:left;
  transition:transform .15s ease, opacity .15s ease, background .15s ease;
}
.collapse-toggle:active{ opacity:.85; transform:scale(.98); background:var(--surface); }
.collapse-chevron{ width:16px; height:16px; stroke:var(--ink-soft); fill:none; stroke-width:2.2; flex:none; transition:transform .35s cubic-bezier(.4,0,.2,1); }
.collapse-chevron.open{ transform:rotate(90deg); }
/* "später fangbar"-Sammelgruppe (manuell zurückgestellte, noch offene Standorte, siehe
   stashCollapseToggleHtml): bewusst in Gold statt Neutralgrau, damit sie sich auf den ersten Blick
   von den grauen "erledigt"-Gruppen unterscheidet - hier ist nichts abgehakt, nur beiseitegelegt. */
.collapse-toggle.stash{ background:var(--gold-soft); color:var(--gold); }
.collapse-toggle.stash:active{ background:var(--surface); }
.collapse-toggle.stash .collapse-chevron{ stroke:var(--gold); }

/* Team grid */
.content:has(.team-grid){ display:flex; flex-direction:column; overflow:hidden; padding-bottom:14px; }
.team-grid{ flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:12px; }
.slot{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:10px; min-height:0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:2px dashed var(--line); overflow:hidden; position:relative;
}
.slot.filled{ border-style:solid; border-color:var(--good); justify-content:space-between; }
.slot-empty{ color:var(--ink-soft); text-align:center; font-size:.85rem; }
.slot-menu-btn{
  position:absolute; top:6px; right:6px; z-index:1; width:28px; height:28px; border-radius:50%;
  border:none; background:var(--surface-alt); display:flex; align-items:center; justify-content:center;
}
.slot-menu-btn:active{ transform:scale(.9); }
.slot-menu-btn svg{ width:16px; height:16px; color:var(--ink-soft); }
.slot-drag-handle{
  position:absolute; top:6px; left:6px; z-index:1; width:28px; height:28px; border-radius:50%;
  border:none; background:var(--surface-alt); display:flex; align-items:center; justify-content:center;
  touch-action:none; cursor:grab;
}
.slot-drag-handle svg{ width:16px; height:16px; color:var(--ink-soft); }
.slot.drag-source{ opacity:.35; }
.slot-drag-ghost{
  position:fixed; z-index:200; pointer-events:none; border-radius:var(--radius);
  box-shadow:0 16px 32px rgba(0,0,0,.35); transform:scale(1.04); opacity:.96; margin:0;
}
.slot-sprite-wrap{ flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:inherit; text-decoration:none; }
.slot-sprite-wrap img{ width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; }
.slot-info{ width:100%; text-align:center; }
.slot .mon-name{ font-size:.9rem; }
.slot .mon-species{ font-size:.7rem; }
.slot .loc-sub{ margin-top:1px; font-size:.72rem; }
.mon-name-input{
  width:100%; text-align:center; font-size:1rem; font-weight:700; font-family:inherit;
  color:var(--ink); background:var(--bg); border:1.5px solid var(--accent); border-radius:8px;
  padding:2px 6px; outline:none;
}
.slot .mon-actions{ margin-top:6px; justify-content:center; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty-state h3{ color:var(--ink); margin-bottom:6px; font-size:1.05rem; }
.empty-state p{ font-size:.85rem; margin:0; }
.empty-illustration{ width:88px; height:88px; margin:0 auto 18px; color:var(--ink-faint); display:block; }

/* Tab bar */
.tabbar{
  flex:none; background:var(--surface); border-top:2px solid var(--accent); display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:20;
  box-shadow:var(--shadow-up); position:relative;
}
.tab{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:8px 4px; border-radius:12px; color:var(--ink-soft); font-size:.68rem; font-weight:700;
  letter-spacing:.02em; transition:background-color .15s ease, color .15s ease;
}
.tab svg{ width:21px; height:21px; stroke:var(--ink-soft); fill:none; stroke-width:1.8; transition:stroke .15s ease; }
.tab-icon-only svg{ width:27px; height:27px; }
.tab.active{ color:var(--accent); background:var(--accent-soft); }
.tab.active svg{ stroke:var(--accent); }
.tab:active{ transform:scale(.95); }

/* Sheet */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(20,16,10,.45); z-index:30; opacity:0; pointer-events:none;
  transition:opacity .2s ease; display:flex; align-items:flex-end; justify-content:center;
}
.sheet-backdrop.active{ opacity:1; pointer-events:auto; }
/* Der Ziehgriff lebt in einem eigenen, nicht scrollenden .sheet-handle-bar-Kopf statt als erstes
   Kind im scrollenden Inhalt: sonst scrollt er bei langen Inhalten (Änderungsprotokoll, Verlauf)
   aus dem sichtbaren Bereich, sobald man weiter unten ist - dann lässt sich das Sheet erst wieder
   per Ziehgriff schließen, nachdem man zurück nach oben gescrollt hat. Mit eigenem Kopfbereich
   bleibt der Griff unabhängig von der Scroll-Position des Inhalts jederzeit erreichbar. */
.sheet{
  background:var(--surface); width:100%; max-width:640px; border-radius:20px 20px 0 0;
  padding:0; transform:translateY(100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1); max-height:80vh;
  display:flex; flex-direction:column; overflow:hidden;
}
.sheet-backdrop.active .sheet{ transform:translateY(0); }
.sheet-handle-bar{ flex:none; padding:10px 18px 0; }
.sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:6px auto 14px; position:relative; touch-action:none; }
.sheet-handle::after{ content:""; position:absolute; inset:-18px -44px; }
.sheet-body{
  flex:1; overflow-y:auto; padding:0 18px calc(20px + env(safe-area-inset-bottom));
  scrollbar-width:none; -ms-overflow-style:none;
}
.sheet-body::-webkit-scrollbar{ display:none; }
.sheet h3{ font-size:1.05rem; margin-bottom:4px; }
.sheet .loc-sub{ margin-bottom:14px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px; }
.field input{
  width:100%; border:1.5px solid var(--line); background:var(--bg); border-radius:12px;
  padding:12px 14px; font-size:1rem; outline:none;
}
.field input:focus{ border-color:var(--accent); }
.box-controls{ margin-top:14px; margin-bottom:4px; }
.box-search-input{
  width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:12px;
  padding:12px 14px; font-size:1rem; outline:none; margin-bottom:10px;
}
.box-search-input:focus{ border-color:var(--accent); }
.box-sort-row{ display:flex; gap:8px; }
.box-sort-row .btn{ padding:9px 14px; min-height:auto; font-size:.82rem; flex:none; }
.species-picker{ position:relative; }
.species-results{
  margin-top:8px; max-height:236px; overflow-y:auto; border:1.5px solid var(--line); border-radius:12px;
  background:var(--surface); display:none;
  scrollbar-width:none; -ms-overflow-style:none;
}
.species-results::-webkit-scrollbar{ display:none; }
.species-results.open{ display:block; }
.species-result{
  width:100%; display:flex; align-items:center; gap:10px; padding:9px 12px;
  background:none; border:none; border-bottom:1px solid var(--line);
  text-align:left; font-size:.88rem; font-weight:600;
}
.species-result:last-child{ border-bottom:none; }
.species-result img{ width:40px; height:40px; flex:none; background:var(--surface-alt); border-radius:6px; }
.species-result img.sprite-legacy{ image-rendering:pixelated; }
.species-result:active{ background:var(--surface-alt); }
.sheet-option{
  width:100%; text-align:left; background:var(--surface-alt); border:none; border-radius:12px;
  padding:14px 16px; font-size:.92rem; font-weight:600; margin-bottom:8px; min-height:48px;
  transition:transform .15s ease;
}
.sheet-option:active{ transform:scale(.98); }
.sheet-group-header{
  font-family:var(--font-display); font-size:.72rem; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); padding:14px 2px 8px;
}
.sheet-group-header:first-child{ padding-top:0; }
.sheet-option.danger{ background:var(--red-soft); color:var(--red); }
.sheet-option.accent{ background:var(--accent-soft); color:var(--accent); }
.sheet-option.evolve-opt{ background:var(--evolve-soft); color:var(--evolve); }
.sheet-option:disabled{ opacity:.4; }
.death-check-row{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.death-check-row input[type="checkbox"]{ width:20px; height:20px; flex:none; accent-color:var(--red); }
.check-row{ display:flex; align-items:center; gap:10px; cursor:pointer; padding:10px 4px; border-bottom:1px solid var(--line); }
.check-row:last-of-type{ border-bottom:none; }
.check-row input[type="checkbox"]{ width:20px; height:20px; flex:none; accent-color:var(--accent); }
.check-row.done span{ color:var(--ink-soft); text-decoration:line-through; }
/* Dezenter, dauerhafter Ring statt einer Einmal-Animation (wie boss-defeat-flash) - bleibt sichtbar,
   solange die Kachel offen ist, statt nach kurzer Zeit wieder zu verschwinden. */
.card.almost-done{ box-shadow:var(--shadow), 0 0 0 2px rgba(var(--gold-glow),.55); }
.sheet-footer{ display:flex; gap:10px; margin-top:6px; }
.preset-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.preset-chip{
  background:var(--surface-alt); border:1.5px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:.82rem; font-weight:600; color:var(--ink);
}
.preset-chip:active{ transform:scale(.96); }

.save-row{
  display:flex; align-items:center; gap:8px; background:var(--surface-alt);
  border-radius:12px; padding:10px 12px; margin-bottom:8px;
}
.save-row.active{ box-shadow: inset 0 0 0 1.5px var(--accent); }
.save-row-main{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; }
.save-row-title{ font-weight:700; font-size:.92rem; display:flex; align-items:center; gap:6px; }

datalist{}
::selection{ background:var(--accent-soft); }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <button class="edition-badge" id="editionBtn" title="Edition wählen">
          <svg class="pokeball" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="none" stroke-width="2"/>
            <path d="M2 16h9a5 5 0 0010 0h9" fill="none" stroke-width="2"/>
            <circle cx="16" cy="16" r="3.4" fill="var(--bg)" stroke-width="2"/>
          </svg>
          <span id="editionLabel"></span>
        </button>
        <div class="brand-title-col">
          <input id="runTitle" class="title-input" maxlength="40" value="Nuzlocke" />
          <div class="active-title-badge" id="activeTitleBadge"></div>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Hell-/Dunkelmodus umschalten">
        <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>
    <div class="header-team-row" id="headerTeamRow">
      <div class="header-team-slots" id="headerTeamSlots"></div>
      <div class="header-orden-tray" id="headerOrdenTray"></div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="content" id="content"></div>
    <div class="swipe-veil" id="swipeVeil"></div>
  </div>

  <button class="fab" id="fabAdd" title="Standort hinzufügen" aria-label="Standort hinzufügen">+</button>
  <button class="search-fab" id="searchFab" data-act="open-location-search" title="Standort suchen" aria-label="Standort suchen">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="map-fab" id="mapFab" data-act="open-region-map" title="Regionskarte" aria-label="Regionskarte">
    <svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>
  </button>
  <button class="jump-fab" id="jumpFab" data-act="jump-to-current-loc" title="Zum aktuellen Standort">
    <svg viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></svg>
    <span>Aktueller Standort</span>
  </button>
  <button class="stash-fab" id="stashFab" data-act="open-stash-overview" title="Zurückgestellte Kacheln" aria-label="Zurückgestellte Kacheln">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21V3z"/></svg>
  </button>

  <div class="tabbar">
    <button class="tab" data-tab="box"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Box</button>
    <button class="tab" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="6" cy="7.5" r="2.4"/><circle cx="12" cy="7.5" r="2.4"/><circle cx="18" cy="7.5" r="2.4"/><circle cx="6" cy="16.5" r="2.4"/><circle cx="12" cy="16.5" r="2.4"/><circle cx="18" cy="16.5" r="2.4"/></svg>Team</button>
    <button class="tab tab-icon-only" data-tab="routes" aria-label="Hauptseite"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h5.1M15.9 12H21"/><circle cx="12" cy="12" r="2.3"/></svg></button>
    <button class="tab" data-tab="grave"><svg viewBox="0 0 24 24"><path d="M6 21V11a6 6 0 0112 0v10"/><path d="M6 21h12"/><path d="M10 8v3M14 8v3M9 10h3"/></svg>Friedhof</button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.5 7.5 0 00-1.7-1l-.3-2.4h-4l-.3 2.4a7.5 7.5 0 00-1.7 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 001.7 1l.3 2.4h4l.3-2.4a7.5 7.5 0 001.7-1l2.3.9 2-3.4-2-1.5z"/></svg>Einstellungen</button>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* SPECIES ist regulär nach Nationaler Pokedex-Nummer sortiert (Index+1 = Dex-Nr., siehe
   SPECIES_LOOKUP) - MIT EINER AUSNAHME: die 48 echten Mega-Entwicklungen (Kalos/ORAS-Ära) ganz
   am Ende, da sie keine eigene reguläre Dex-Nummer haben (siehe MEGA_BASE_DEX weiter unten,
   nur für den externen Pokédex-Link relevant). Grund für eigene SPECIES-Einträge statt reiner
   Battle-Mechanik: ein Randomizer kann ein bereits dauerhaft mega-entwickeltes Wildpokémon
   erzeugen, das sich nach dem Kampf NICHT zurückentwickelt - muss also als eigene fangbare Art
   loggbar sein. WICHTIG bei künftigen Erweiterungen: neue reguläre Arten (Gen7 Dex #722+ usw.)
   müssen VOR dem Mega-Block eingefügt werden (SPECIES/SPECIES_TYPES/SPRITES_MODERN synchron),

   Diamant/Perl. Karte weitgehend identisch zu HGSS (LOCATIONS_DEFAULT/BOSS_AFTER oben) - deshalb
   hier als Kopie mit den recherchierten Original-Unterschieden statt komplettem Neuaufbau:
   - Sinjoh-Ruinen existieren nicht (HGSS/Gen4-exklusives Arceus-Event, kein Gen2-Inhalt).
   - Die Johto-"Safari-Zone" bei Route 47/48 ist eine HGSS-exklusive Neuerung (ersetzt dort Pal
     Park) - im Original liegt die klassische Safari-Zone stattdessen in Kanto bei Fuchsania City
     (wie schon in Rot/Blau/Gelb), hier entsprechend verschoben.

/* Fabrik für Versions-Trios: ein gemeinsamer Basis-Datensatz erzeugt mehrere GAMES-Einträge,
   mit punktuellen Level/Team-Overrides pro Version statt vollständiger Dopplung. */
function buildVersionGames(baseBosses, regions, bossAfter, versions, starters, generation, genderNames){
  const out = {};
  versions.forEach(v=>{
    const bosses = baseBosses.map(b=>({ ...b, id:`${v.id}-${b.id}`, ...(v.bossOverrides?.[b.id]||{}) }));
    const remap = new Map(baseBosses.map((b,i)=>[b.id, bosses[i].id]));
    const remappedAfter = {};
    Object.entries(bossAfter).forEach(([loc, ids])=>{ remappedAfter[loc] = ids.map(id=>remap.get(id)); });
    out[v.id] = { id:v.id, label:v.label, shortLabel:v.shortLabel, regions:v.regions||regions, bosses, bossAfter:remappedAfter, starters:v.starters||starters, genderNames:v.genderNames||genderNames, theme:v.theme, generation:v.generation||generation, releaseOrder:v.releaseOrder, material:v.material };
  });
  return out;
}
