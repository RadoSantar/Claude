const frozenSpriteCache = {};
/* Alle Boss-Sprites aller Editionen werden beim Start einmalig "eingefroren" (nicht nur die der
   aktuell aktiven) - jedes einzelne löste bisher sofort sein eigenes render() aus, macht bei über
   100 Sprites also über 100 volle Neu-Renderings des aktuellen Tabs direkt hintereinander, was den
   Haupt-Thread beim Start spürbar blockieren kann. Ein gemeinsamer Debounce sammelt alle onload-
   Ereignisse und löst stattdessen nur ein einziges render() aus, sobald kurz Ruhe ist. */
let freezeRenderDebounce = null;
function freezeSpriteSrc(spriteKey, src){
  if(frozenSpriteCache[spriteKey] || !src) return;
  const img = new Image();
  img.onload = ()=>{
    try{
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      canvas.getContext("2d").drawImage(img, 0, 0);
      frozenSpriteCache[spriteKey] = canvas.toDataURL("image/png");
      clearTimeout(freezeRenderDebounce);
      freezeRenderDebounce = setTimeout(render, 80);
    }catch(e){}
  };
  img.src = src;
}

/* ---------- Teilbare Bild-Karten (Team & Run-Rückblick) ----------
   Liest Farben bewusst per getComputedStyle aus den CSS-Variablen aus (gleiches Muster wie
   updateThemeColorMeta) statt aus GAMES[edition].theme direkt - so funktioniert es unverändert
   für alle Editionen inkl. HGSS, das kein eigenes .theme-Objekt hat, und folgt automatisch
   hell/dunkel + der aktuellen Editions-Akzentfarbe. */
function themeColor(varName, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  return v || fallback;
}

function loadImageAsync(src){
  return new Promise(resolve=>{
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = src;
  });
}

function canvasRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapTextLines(ctx, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(word=>{
    const test = line ? `${line} ${word}` : word;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = word; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines;
}

function truncateLabel(s, n){
  s = String(s||"");
  return s.length > n ? s.slice(0, n-1)+"…" : s;
}

/* Teilen bevorzugt über das native Web-Share-Sheet inkl. Bild-Datei (Mobile) - sonst zeigt eine
   Sheet das Bild als <img> mit "Antippen und halten"-Hinweis PLUS einen Download-Link. Der reine
   <img>-Weg ist bewusst der verlässliche Fallback: ein per Skript ausgelöster <a download>-Klick
   funktioniert nicht in jeder Umgebung zuverlässig (z.B. sandboxed Vorschau-Frames), ein sichtbares
   Bild zum Antippen/Speichern dagegen schon. */
async function shareOrShowCanvas(canvas, filename, shareTitle, shareText){
  const dataUrl = canvas.toDataURL("image/png");
  const blob = await new Promise(resolve=>canvas.toBlob(resolve, "image/png"));
  if(blob && typeof File!=="undefined" && navigator.share && navigator.canShare){
    const file = new File([blob], filename, { type:"image/png" });
    if(navigator.canShare({ files:[file] })){
      try{ await navigator.share({ title:shareTitle, text:shareText, files:[file] }); return; }
      catch(err){ if(err && err.name==="AbortError") return; }
    }
  }
  openSheet(`
    <h3>${escapeHtml(shareTitle)}</h3>
    <div class="loc-sub" style="margin-bottom:12px;">Bild antippen und halten (oder rechtsklicken), um es zu speichern.</div>
    <img src="${dataUrl}" alt="" style="width:100%; border-radius:14px; display:block; box-shadow:var(--shadow);" />
    <div class="sheet-footer" style="margin-top:14px;">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Schließen</button>
      <a class="btn btn-primary btn-block" style="display:flex; align-items:center; justify-content:center; text-decoration:none;" href="${dataUrl}" download="${filename}">Herunterladen</a>
    </div>
  `);
}

async function buildRunRecapShareImage(){
  const s = runRecapStats();
  const hof = state.hallOfFame;
  const team = hof.playerTeam || [];
  const narrative = runRecapNarrative();
  const insights = runRecapInsights();
  const W = 1000, PAD = 56;
  const contentW = W - PAD*2;

  const accent = themeColor("--accent", "#4f7cff");
  const bg = themeColor("--bg", "#f4f5f8");
  const surface = themeColor("--surface", "#ffffff");
  const ink = themeColor("--ink", "#1a1a1f");
  const inkSoft = themeColor("--ink-soft", "#6b6f7a");
  const good = themeColor("--good", "#2e9e57");
  const red = themeColor("--red", "#d9484f");

  const measure = document.createElement("canvas").getContext("2d");
  measure.font = "400 22px system-ui, sans-serif";
  const narrativeLines = wrapTextLines(measure, narrative, contentW);
  measure.font = "400 20px system-ui, sans-serif";
  const insightLines = insights.flatMap(i=>wrapTextLines(measure, "• "+i, contentW-8));

  const statLines = [
    `Überlebensrate: ${s.survivalRate===null?"–":s.survivalRate+"%"}`,
    `Gefangen: ${s.caught}   Gestorben: ${deadCount()}`,
    `Kampfniederlagen: ${state.lossCount||0}`,
    `Bosse besiegt: ${s.bossesDefeated}/${s.totalBosses}`,
    `Run-Dauer: ${s.duration}`
  ];
  if(!state.soloMode) statLines.push(`Duelle: ${s.duelTally.wins} Siege, ${s.duelTally.losses} Niederlagen`);

  const teamRows = Math.ceil(Math.max(team.length,1)/3);
  const teamBlockH = team.length ? teamRows*150+20 : 60;
  const H = 190 + teamBlockH + 50 + narrativeLines.length*30 + 44 + insightLines.length*28 + 40 + statLines.length*32 + PAD;

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = accent; ctx.globalAlpha = .12; ctx.fillRect(0, 0, W, 170); ctx.globalAlpha = 1;

  ctx.fillStyle = ink;
  ctx.font = "700 38px system-ui, sans-serif";
  ctx.fillText(effectiveRunTitle(state.runTitle), PAD, 76);
  ctx.fillStyle = inkSoft;
  ctx.font = "500 22px system-ui, sans-serif";
  ctx.fillText(currentGame().shortLabel, PAD, 108);
  ctx.fillStyle = s.won ? good : red;
  ctx.font = "700 24px system-ui, sans-serif";
  ctx.fillText(runRecapHeadline(), PAD, 148);

  let y = 190;
  const tileSize = 130, gap = 20;
  for(let i=0;i<team.length;i++){
    const col = i%3, row = Math.floor(i/3);
    const x = PAD + col*(tileSize+gap);
    const ty = y + row*150;
    ctx.fillStyle = surface;
    canvasRoundRect(ctx, x, ty, tileSize, tileSize, 16);
    ctx.fill();
    const img = await loadImageAsync(spriteFor(team[i].species));
    if(img) ctx.drawImage(img, x+15, ty+15, tileSize-30, tileSize-30);
    ctx.fillStyle = ink;
    ctx.font = "600 16px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(truncateLabel(team[i].nickname||team[i].species, 14), x+tileSize/2, ty+tileSize+20);
    ctx.textAlign = "left";
  }
  if(!team.length){
    ctx.fillStyle = inkSoft;
    ctx.font = "500 20px system-ui, sans-serif";
    ctx.fillText("(kein Team erfasst)", PAD, y+30);
  }
  y += teamBlockH;

  ctx.fillStyle = accent;
  ctx.font = "700 20px system-ui, sans-serif";
  ctx.fillText("Zusammenfassung", PAD, y);
  y += 30;
  ctx.fillStyle = ink;
  ctx.font = "400 22px system-ui, sans-serif";
  narrativeLines.forEach(line=>{ ctx.fillText(line, PAD, y); y += 30; });

  y += 14;
  ctx.fillStyle = accent;
  ctx.font = "700 20px system-ui, sans-serif";
  ctx.fillText("Kleine Analyse", PAD, y);
  y += 28;
  ctx.fillStyle = inkSoft;
  ctx.font = "400 20px system-ui, sans-serif";
  insightLines.forEach(line=>{ ctx.fillText(line, PAD, y); y += 28; });

  y += 14;
  ctx.fillStyle = ink;
  ctx.font = "600 20px system-ui, sans-serif";
  statLines.forEach(line=>{ ctx.fillText(line, PAD, y); y += 32; });

  return canvas;
}

function bossSpriteHtml(boss, size, frozen){
  size = size || 70;
  const src = BOSS_SPRITES[boss.sprite];
  if(!src) return `<div class="mon-sprite-placeholder" style="width:${size}px;height:${size}px;">?</div>`;
  let shownSrc = src;
  if(frozen){
    const cached = frozenSpriteCache[boss.sprite];
    if(cached) shownSrc = cached;
    else freezeSpriteSrc(boss.sprite, src);
  }
  return `<img class="boss-sprite" src="${shownSrc}" width="${size}" height="${size}" alt="" />`;
}

/* Nimmt einen bereits eingetragenen Bosssieg/Abschluss wieder zurück - ausgelagert aus dem
   Klick-Dispatcher, da der Button dafür (siehe bossCardHtml) inzwischen ein Lang-Drücken statt
   eines einfachen Taps verlangt (siehe longPressDispatch) und beide Wege dieselbe Logik brauchen. */
function toggleBossDefeat(id){
  const wasDefeated = isBossDefeated(id);
  state.bossDefeated[id] = !wasDefeated;
  const boss = bossById(id);
  if(!wasDefeated && boss){ logEvent("boss", `${boss.name || boss.cls} besiegt (${boss.place})`); vibrateFeedback([40,30,80]); snapshotBossWinTeam(id); }
  const finalBoss = finalStoryBoss();
  const isChamp = finalBoss && boss && boss.id===finalBoss.id;
  if(state.soloMode && isChamp){
    if(!wasDefeated) snapshotSoloHallOfFame();
    else state.hallOfFame = { rivalTeam:[], playerTeam:[], defeatedAt:null, result:null };
  }
  saveState();
  if(!wasDefeated) lastDefeatedId = id;
  render();
  lastDefeatedId = null;
  if(!wasDefeated && isChamp) showChampionCelebration(boss);
}

function bossCardHtml(boss, isCurrent){
  const percent = bossPercent(boss.id);
  const lvl = bossLevel(boss);
  const defeated = isBossDefeated(boss.id);
  /* Ein Bosskampf kann trotz Niederlage als abgeschlossen gelten (siehe openBossResultSheet/
     confirm-boss-result) - state.bossDefeated[id] ist dann "loss" statt true, damit die Kachel
     zwar wie ein Sieg einklappt/zählt, sich optisch aber weiter als Niederlage zu erkennen gibt. */
  const settledAsLoss = state.bossDefeated[boss.id] === "loss";
  const flash = boss.id === lastDefeatedId;
  const almostDone = !defeated && isAlmostDoneHighlight();
  const cls = "card boss-card" + (defeated?(settledAsLoss?" boss-done-loss":" boss-done"):"") + (flash?" boss-defeat-flash":"") + (almostDone?" almost-done":"");
  const currentAttr = isCurrent ? ` data-current="true"` : "";
  const badge = defeated ? `<div class="boss-defeat-badge${settledAsLoss?" badge-loss":""}" aria-hidden="true">${(settledAsLoss && state.colorBlindSafeMode) ? ICON_X : ICON_CHECK}</div>` : "";
  const ordenBadge = (defeated && boss.badge && BADGE_SPRITES[boss.badge])
    ? `<div class="boss-orden-badge" title="${escapeHtml(boss.badge)} erhalten"><img src="${BADGE_SPRITES[boss.badge]}" alt="${escapeHtml(boss.badge)}" /></div>`
    : "";
  /* Kein Flaggen-Icon für bereits besiegte Bosse: würde optisch mit dem Sieg-Badge (ebenfalls
     oben rechts) kollidieren und eine erledigte Kachel lässt sich ohnehin nicht als "aktuell"
     halten (isCurrentTargetResolved räumt die Markierung sofort wieder ab). */
  const flagBtn = defeated ? "" : iconBtn(isCurrent?"tone-good":"tone-neutral","toggle-current-loc",boss.id,isCurrent?ICON_FLAG_FILLED:ICON_FLAG,isCurrent?"Nicht mehr aktueller Standort":"Als aktuellen Standort markieren",false,true);
  /* Wie bei Standort-Kacheln (routeCard) manuelles Zurückstellen nur für noch offene Bosskämpfe
     sinnvoll - man nimmt z.B. erst einen anderen Weg/grindet, bevor man sich einem Arenaleiter oder
     Bosskampf stellt. Nutzt denselben generischen Mechanismus (state.manualCollapsedLocs, dieselbe
     Aktion toggle-loc-manual-collapse) wie Standort-Kacheln - siehe renderRoutes()/
     stashCollapseToggleHtml, dort inzwischen kind-unabhängig. */
  const collapseBtn = defeated ? "" : iconBtn("tone-neutral","toggle-loc-manual-collapse",boss.id,ICON_COLLAPSE,"Später erledigen - Kachel einklappen",false,true);
  const hasBossNote = !!((state.bossNotes||{})[boss.id]||"").trim();
  const noteBtn = iconBtn(hasBossNote?"tone-gold":"tone-neutral","open-boss-note",boss.id,hasBossNote?ICON_NOTE_FILLED:ICON_NOTE,hasBossNote?"Notiz bearbeiten":"Notiz hinzufügen",false,true);
  const bossNoteHtml = hasBossNote ? `<div class="loc-note">${escapeHtml(state.bossNotes[boss.id])}</div>` : "";
  const opponentTeam = (state.bossOpponentTeams||{})[boss.id] || [];
  const opponentTeamBtn = state.trackBossTeams
    ? iconBtn(opponentTeam.length?"tone-gold":"tone-neutral","open-boss-opponent-team",boss.id,opponentTeam.length?ICON_POKEBALL_FILLED:ICON_POKEBALL,opponentTeam.length?"Gegner-Team bearbeiten":"Gegner-Team eintragen",false,true)
    : "";
  const opponentTeamHtml = opponentTeam.length ? `<div class="loc-note">Gegnerteam: ${escapeHtml(opponentTeam.join(", "))}</div>` : "";
  const hasWinTeam = !!((state.bossWinTeams||{})[boss.id]||[]).length;
  const bottom = defeated
    ? `<div class="boss-actions">
        ${hasWinTeam ? `<button class="btn btn-secondary btn-block" data-act="open-boss-win-team" data-id="${boss.id}">Team anzeigen</button>` : ""}
        <button class="btn btn-secondary btn-block btn-longpress" data-longpress-act="toggle-boss-defeat" data-id="${boss.id}" title="Gedrückt halten zum Bestätigen">
          <span class="btn-longpress-fill" aria-hidden="true"></span>
          <span class="btn-longpress-label">${settledAsLoss?"Abschluss zurücknehmen":"Sieg zurücknehmen"}</span>
        </button>
      </div>`
    : `<div class="boss-actions">
        <button class="btn btn-secondary btn-block" data-act="open-boss-loss" data-id="${boss.id}">Niederlage eintragen</button>
        <button class="btn btn-primary btn-block" data-act="open-boss-win" data-id="${boss.id}">Als besiegt markieren</button>
      </div>`;
  const isRival = boss.group === "Rivale";
  const rivalNick = isRival ? (state.rivalNickname||"").trim() : "";
  const displayName = rivalNick || boss.name;
  const rivalAttr = isRival ? `data-act="open-rival-rename" data-id="${boss.id}"` : "";
  return `<div class="${cls}" data-boss="${boss.id}"${currentAttr}>
    ${badge}
    ${ordenBadge}
    <div class="card-top">
      <div class="mon-line" ${rivalAttr}>
        ${bossSpriteHtml(boss, 70, defeated)}
        <div>
          <div class="loc-name">${escapeHtml(displayName)}</div>
          <div class="loc-sub">${escapeHtml(boss.cls)} · ${escapeHtml(boss.place)}</div>
        </div>
      </div>
      <div style="display:flex; gap:4px; align-items:center; flex:none;">${almostDone?'<span class="chip gold">✨ Fast geschafft</span>':""}${opponentTeamBtn}${noteBtn}${flagBtn}${collapseBtn}</div>
    </div>
    <div class="boss-level-row">
      <div class="boss-level-main">
        <span class="boss-level-num">Lv. ${lvl}</span>
        <span class="boss-percent-pill ${percent>0?'active':''}">${percent>0?'+':''}${percent}%</span>
      </div>
      <div class="boss-ace"><span>Basis Lv. ${boss.baseLevel}</span></div>
    </div>
    ${bossNoteHtml}
    ${opponentTeamHtml}
    ${bottom}
  </div>`;
}

/* Sieg/Niederlage gegen einen Story-Boss (nicht zu verwechseln mit dem PvP-Duell gegen die echte
   Duellpartnerin/den echten Duellpartner, siehe pvpCardHtml) - bei beiden Ausgängen kann man
   optional festhalten, welche Team-Pokémon dabei gestorben sind. Bei einer Niederlage sind
   standardmäßig alle angehakt (in der Regel stirbt dabei das ganze Team), bei einem Sieg keins. */
function teamAliveList(){
  return state.locations.filter(l=>l.mon && l.mon.inTeam && !l.mon.dead);
}
function openBossResultSheet(bossId, result){
  const boss = bossById(bossId);
  if(!boss) return;
  const isLoss = result==="loss";
  const isRival = boss.group === "Rivale";
  const rivalNick = isRival ? (state.rivalNickname||"").trim() : "";
  const displayName = rivalNick || boss.name;
  const team = teamAliveList();
  const rows = team.map(loc=>{
    const m = loc.mon;
    return `<label class="sheet-option death-check-row">
      <input type="checkbox" data-death-loc="${loc.id}" ${isLoss?"checked":""} />
      ${spriteImgHtml(m.species, 40)}
      <span>${escapeHtml(m.nickname || m.species)}</span>
    </label>`;
  }).join("") || `<div class="loc-sub">Kein Pokémon im Team.</div>`;
  /* Manche Story-Rivalenkämpfe (meist der erste) gehen auch bei einer Niederlage story-technisch
     einfach weiter - ohne Recherche pro Boss gilt die Option pauschal für jeden Bosskampf, die
     Spielerin/der Spieler weiß selbst am besten, ob das für den jeweiligen Kampf zutrifft. */
  const continueRow = isLoss ? `<label class="sheet-option death-check-row" style="margin-top:4px; align-items:flex-start;">
      <input type="checkbox" id="bossContinueAnyway" style="margin-top:2px;" />
      <span>
        <span style="display:block;">Trotzdem als abgeschlossen zählen</span>
        <span class="loc-sub" style="display:block; margin-top:2px;">Z.&nbsp;B. Story-Kampf, der auch bei einer Niederlage weitergeht</span>
      </span>
    </label>` : "";
  openSheet(`
    <h3>${isLoss?"Niederlage":"Sieg"} gegen ${escapeHtml(displayName)}</h3>
    <div class="loc-sub" style="margin-bottom:14px;">${isLoss ? "Welche Team-Pokémon sind dabei gestorben? In der Regel das ganze Team." : "Sind dabei Team-Pokémon gestorben? Optional."}</div>
    ${rows}
    ${continueRow}
    <div class="sheet-footer" style="flex-direction:column; gap:10px;">
      <button class="btn ${isLoss?"btn-secondary":"btn-primary"} btn-block" data-act="confirm-boss-result" data-id="${bossId}" data-result="${result}">${isLoss?"Niederlage eintragen":"Sieg eintragen"}</button>
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Abbrechen</button>
    </div>
  `);
}

function pvpKey(bossId){ return "pvp-"+bossId; }

function pvpTitle(prefix){
  const label = prefix || "Rivalenduell";
  const partner = duelPartnerName();
  return partner ? `${label} gegen ${escapeHtml(partner)}` : label;
}

function pvpCardHtml(boss){
  const key = pvpKey(boss.id);
  const rec = state.pvp[key];
  if(!rec){
    return `<div class="card pvp-card" data-pvp="${key}">
      <div class="mon-line">
        <div class="pvp-badge">VS</div>
        <div>
          <div class="loc-name">${pvpTitle()}</div>
          <div class="loc-sub">Nach ${escapeHtml(boss.name)}</div>
        </div>
      </div>
      <div class="pvp-actions">
        <button class="btn btn-secondary" data-act="pvp-win" data-id="${key}">Du hast gewonnen</button>
        <button class="btn btn-secondary" data-act="pvp-lose" data-id="${key}">Rivale hat gewonnen</button>
      </div>
    </div>`;
  }
  if(rec.winner==="me"){
    return `<div class="card pvp-card pvp-resolved">
      <div class="card-top">
        <div class="mon-line">
          ${spriteImgHtml(rec.wonSpecies, 56)}
          <div>
            <div class="loc-name">Sieg! ${escapeHtml(rec.wonSpecies)} erhalten</div>
            <div class="loc-sub">${pvpTitle()} · nach ${escapeHtml(boss.name)}</div>
          </div>
        </div>
        ${iconBtn("tone-neutral","pvp-undo",key,ICON_UNDO,"Rückgängig machen",false,true)}
      </div>
    </div>`;
  }
  const givenLoc = findLoc(rec.givenLocId);
  const givenMon = givenLoc && givenLoc.mon;
  const givenLabel = givenMon ? (givenMon.nickname||givenMon.species) : "Unbekannt";
  return `<div class="card pvp-card pvp-resolved">
    <div class="card-top">
      <div class="mon-line">
        ${givenMon ? spriteImgHtml(givenMon.species, 56) : `<div class="mon-sprite-placeholder" style="width:56px;height:56px;">?</div>`}
        <div>
          <div class="loc-name">Niederlage – ${escapeHtml(givenLabel)} abgegeben</div>
          <div class="loc-sub">${pvpTitle()} · nach ${escapeHtml(boss.name)}</div>
        </div>
      </div>
      ${iconBtn("tone-neutral","pvp-undo",key,ICON_UNDO,"Rückgängig machen",false,true)}
    </div>
  </div>`;
}

/* ---------- Ruhmeshalle: finales Rivalenduell gegen den Duellpartner (nicht die Spielfigur!) nach dem Champion ---------- */
/* Rein aus editionsspezifischen Farbtoken zusammengesetzt (--accent/--gold & Varianten sind pro
   Edition per :root[data-edition="..."] überschrieben, siehe CSS oben) - vorher waren 3 der 5 Töne
   feste, editionsunabhängige Signalfarben (--evolve/--good/--red), das Konfetti wirkte dadurch nur
   teilweise an die jeweilige Editionspalette gekoppelt. */
const CONFETTI_COLORS = ["var(--accent)","var(--accent-shine)","var(--accent-deep)","var(--gold)","var(--gold-soft)"];
function spawnConfetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  for(let i=0;i<80;i++){
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    const size = 6 + Math.random()*6;
    const round = Math.random() < 0.5;
    piece.style.left = (Math.random()*100)+"%";
    piece.style.width = size+"px";
    piece.style.height = (round ? size : size*1.7)+"px";
    piece.style.borderRadius = round ? "50%" : "2px";
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    piece.style.animationDuration = (2.2 + Math.random()*1.6)+"s";
    piece.style.animationDelay = (Math.random()*0.5)+"s";
    piece.style.setProperty("--drift", (Math.random()*140-70)+"px");
    piece.style.setProperty("--spin", (360 + Math.random()*540)+"deg");
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 4300);
}

/* Der "Champion" ist nicht überall gleich klassifiziert - in den Kanto-Editionen trägt Lance
   z.B. cls:"Top Vier" statt "Champ", da er im Original als letztes Top-Vier-Mitglied gilt statt
   als eigener Champion. Universeller und zuverlässiger: der Boss, der in seiner Standort-Liste
   direkt vor der "duel-final"-Markierung steht, ist in JEDER Edition der letzte reguläre Kampf
   vor dem Abschluss - unabhängig von cls. */
function finalStoryBoss(){
  const game = currentGame();
  for(const key in game.bossAfter){
    const ids = game.bossAfter[key];
    /* Bosse aus buildVersionGames() (Diamant/Perl/Platin, Rubin/Saphir, Schwarz/Weiß) tragen ein
       "${versionId}-"-Präfix auf JEDER ID, auch auf "duel-final" selbst (z.B. "schwarz-duel-final")
       - ein exakter Vergleich fand diese Editionen deshalb nie, endsWith() funktioniert für beide
       Fälle (mit und ohne Präfix). */
    const idx = ids.findIndex(id=>id==="duel-final" || id.endsWith("-duel-final"));
    if(idx > 0) return bossById(ids[idx-1]);
  }
  return null;
}

/* Eigener Abschluss-Screen speziell für den Champion-Sieg (nicht zu verwechseln mit der
   Ruhmeshalle/Konfetti beim finalen Rivalenduell danach) - ein Vollbild-Overlay statt nur einer
   Karten-Animation, da der Champion-Sieg der eigentliche Abschluss des Hauptspiels ist. */
function showChampionCelebration(boss){
  document.querySelector(".champion-overlay")?.remove();
  spawnConfetti();
  const bossesDefeated = activeBosses().filter(b=>isBossDefeated(b.id)).length;
  const totalBosses = activeBosses().length;
  const survival = survivalRate();
  const overlay = document.createElement("div");
  overlay.className = "champion-overlay";
  overlay.dataset.act = "close-champion-overlay";
  overlay.innerHTML = `
    <div class="champion-card">
      <div class="champion-trophy" aria-hidden="true">🏆</div>
      <h2>Champion besiegt!</h2>
      <div class="champion-sub">${escapeHtml(boss.name || boss.cls)} · ${escapeHtml(currentGame().shortLabel)}</div>
      <div class="champion-stats">
        <div><span>${survival===null?"–":survival+"%"}</span><label>Überlebensrate</label></div>
        <div><span>${bossesDefeated}/${totalBosses}</span><label>Bosse besiegt</label></div>
      </div>
      <button class="btn btn-primary btn-block" data-act="close-champion-overlay">Weiter</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

/* Gemeinsame Kernlogik hinter "Als gestorben markieren" - unabhängig davon, ob die optionale
   Todesursachen-Abfrage (state.trackDeathCause) dazwischengeschaltet war oder nicht, damit beide
   Pfade (direkter Klick vs. über openDeathCauseSheet bestätigt) exakt dasselbe tun. */
function performMarkDead(locId, cause){
  const loc = findLoc(locId); const m = loc.mon;
  const wasInTeam = m.inTeam;
  m.dead=true; m.inTeam=false;
  if(cause) m.deathCause = cause; else delete m.deathCause;
  logEvent("dead", cause ? `${m.nickname || m.species} ist gestorben (${loc.name}, gegen ${cause})` : `${m.nickname || m.species} ist gestorben (${loc.name})`);
  if(wasInTeam) logEvent("team", `${m.nickname || m.species} verließ das Team (gestorben)`);
  vibrateFeedback([25,40,25]);
  saveState(); closeSheet(); render();
  checkGameOver();
  if(aliveCount()>0) checkSoulLinkAfterDeath([locId]);
}

/* Optionale Todesursachen-Abfrage (Hausregel-Toggle, siehe state.trackDeathCause) für Tode
   AUSSERHALB von Bosskämpfen - dort gibt es ja schon die Todesopfer-Checkliste mit klarem Gegner
   (der Boss selbst), hier fehlt dieser Kontext sonst komplett (z.B. Tod durch ein wildes Pokémon
   beim Grinden). Freitext mit Spezies-Autovervollständigung statt starrem Auswahlzwang, da nicht
   jede Todesursache zwingend ein konkretes Pokémon ist. */
function openDeathCauseSheet(locId){
  const loc = findLoc(locId);
  if(!loc || !loc.mon) return;
  openSheet(`
    <div class="sheet-mon-header">
      ${spriteImgHtml(loc.mon.species, 56)}
      <div>
        <h3>${escapeHtml(loc.mon.nickname||loc.mon.species)} ist gestorben</h3>
        <div class="loc-sub">Optional: gegen welches Pokémon?</div>
      </div>
    </div>
    <div class="field species-picker">
      <label for="inDeathCause">Todesursache</label>

    </div>
    <div class="sheet-footer" style="flex-direction:column; gap:10px;">
      <button class="btn btn-danger btn-block" data-act="confirm-mark-dead" data-id="${locId}">Als gestorben markieren</button>
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Abbrechen</button>
    </div>
  `);
  wireSpeciesPicker("inDeathCause","inDeathCauseResults", ()=>{});
  setTimeout(()=>document.getElementById("inDeathCause").focus(), 50);
}

/* Kompletter Team-Wipe: nicht nur die sechs aktiven Team-Plätze, sondern wirklich ALLE jemals in
   diesem Run gefangenen Pokémon (Team + Box) sind tot - erst dann steckt man tatsächlich fest, ein
   Team-Wipe mit noch überlebenden Box-Pokémon wäre kein echtes Game Over. Wird nach jeder Aktion
   geprüft, die ein Pokémon sterben lassen kann (mark-dead, Niederlage mit Todesopfern). */
function checkGameOver(){
  const caught = aliveCount() + deadCount();
  if(caught > 0 && aliveCount() === 0) showGameOverOverlay();
}

/* Spiegelt showChampionCelebration() als Niederlage statt Sieg - kein Konfetti, rot statt gold. */
function showGameOverOverlay(){
  document.querySelector(".game-over-overlay")?.remove();
  const bossesDefeated = activeBosses().filter(b=>isBossDefeated(b.id)).length;
  const totalBosses = activeBosses().length;
  const caught = aliveCount()+deadCount();
  const overlay = document.createElement("div");
  overlay.className = "game-over-overlay";
  overlay.dataset.act = "close-game-over-overlay";
  overlay.innerHTML = `
    <div class="game-over-card">
      <div class="game-over-icon" aria-hidden="true">💀</div>
      <h2>Team ausgelöscht</h2>
      <div class="game-over-sub">Alle gefangenen Pokémon sind gestorben · ${escapeHtml(currentGame().shortLabel)}</div>
      <div class="game-over-stats">
        <div><span>${caught}</span><label>Gefangen</label></div>
        <div><span>${bossesDefeated}/${totalBosses}</span><label>Bosse besiegt</label></div>
      </div>
      <button class="btn btn-danger btn-block" data-act="close-game-over-overlay">Weiter</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

/* Aktive Erste-Schritte-Tour beim allerersten Öffnen der App (geräteweit per localStorage gemerkt,
   NICHT im Spielstand - eine neue Runde soll die Tour nicht erneut auslösen). Lässt sich jederzeit
   über "Werkzeuge" in den Einstellungen erneut starten (act==="open-onboarding-tour"), dann
   unabhängig vom gespeicherten "schon gesehen"-Status.
   Bewusst KEIN reines Info-Overlay mehr (Vorgänger-Version bis v1.8.67): jeder Schritt mit `tab`
   schaltet activeTab wirklich um und rendert die ECHTE Oberfläche, `target` zeigt per Spotlight
   (siehe CSS .tour-spotlight) auf das echte Element dazu. `demo` spielt an manchen Stellen eine rein
   visuelle, simulierte Aktion ab (siehe playOnboardingDemo()) - bewusst KEINE echte Interaktion mit
   dem Spielstand, um nie versehentlich echten Fortschritt zu verändern. Für vertiefte Erklärungen zu
   JEDEM Feature gibt es zusätzlich die durchsuchbare "Ausführliche Tour" (siehe openFeatureIndexSheet)
   sowie einzelne "?"-Hinweise direkt an den jeweiligen Stellen (siehe SETTINGS_HELP) - diese kurze
   Tour hier bleibt bewusst auf die wichtigsten fünf Stationen begrenzt. */
const ONBOARDING_STEPS = [
  { icon:"👋", title:"Willkommen bei Nuzlocke", text:"Diese App begleitet dich durch deinen Nuzlocke-Run: Fänge, Bosskämpfe, Team und Fortschritt - alles an einem Ort, komplett offline nutzbar. Die Tour zeigt dir jetzt kurz die wichtigsten Bereiche direkt an der echten Oberfläche." },
  { tab:"routes", target:'#content .card[data-loc]', title:"Fangen & Bosse", text:"Hier trägst du pro Standort ein, ob du gefangen hast, und hältst Bosskämpfe mit Sieg oder Niederlage fest. Ein Tipp auf eine Karte öffnet die passenden Optionen dafür.", demo:"catch" },
  { tab:"team", target:'#teamGrid', title:"Team & Box", text:"Frisch gefangene Pokémon wandern automatisch ins Team, wenn dort noch Platz ist - sonst landen sie in der Box (eigener Tab daneben). Beides lässt sich jederzeit per Fingertipp tauschen." },
  { tab:"settings", target:'[data-group="achievements"]', expandGroup:"achievements", title:"Erfolge & Titel", text:"Für besondere Momente im Run gibt es Erfolge freizuschalten, die dir auch einen Titel verleihen - wähl deinen Favoriten hier aus und zeig ihn im Kopfbereich." },
  { tab:"settings", target:'[data-group="tools"]', expandGroup:"tools", title:"Werkzeuge & alles andere", text:"Hier findest du Mehrfach-Speicherstände, Hausregeln, Darstellung, Cloud-Sync und mehr. Unter „Werkzeuge“ startest du diese kurze Tour jederzeit neu - oder öffnest die ausführliche, durchsuchbare Themen-Übersicht für jedes Detail." }
];
let onboardingStep = 0;
function openOnboardingTour(){
  onboardingStep = 0;
  renderOnboardingOverlay();
}
function clearOnboardingDom(){
  document.querySelectorAll(".tour-block, .tour-spotlight, .tour-card, .tour-tip, .tour-demo-ripple, .tour-demo-badge").forEach(el=>el.remove());
}
function onboardingProgressHtml(){
  const TOUR_TAB_ICONS = {
    routes: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h5.1M15.9 12H21"/><circle cx="12" cy="12" r="2.3"/></svg>',
    team: '<svg viewBox="0 0 24 24"><circle cx="6" cy="7.5" r="2.4"/><circle cx="12" cy="7.5" r="2.4"/><circle cx="18" cy="7.5" r="2.4"/><circle cx="6" cy="16.5" r="2.4"/><circle cx="12" cy="16.5" r="2.4"/><circle cx="18" cy="16.5" r="2.4"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.5 7.5 0 00-1.7-1l-.3-2.4h-4l-.3 2.4a7.5 7.5 0 00-1.7 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 001.7 1l.3 2.4h4l.3-2.4a7.5 7.5 0 001.7-1l2.3.9 2-3.4-2-1.5z"/></svg>'
  };
  const fallbackIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>';
  return `<div class="tour-progress">${ONBOARDING_STEPS.map((s,i)=>{
    const cls = i===onboardingStep ? "active" : (i<onboardingStep ? "done" : "");
    return `<span class="tour-progress-icon ${cls}">${TOUR_TAB_ICONS[s.tab] || fallbackIcon}</span>`;
  }).join("")}</div>`;
}
/* Wechselt bewusst nicht hart auf die nächste Station (frühere Version bis v1.8.68 - kam als
   "springt zu schnell" zurück): ist bereits eine Karte sichtbar, wird sie erst kurz ausgeblendet
   (siehe .tour-fade-out), danach folgen Tab-Wechsel/Rendern/Scrollen wie gehabt, und die neue
   Karte samt Spotlight blendet sanft wieder ein (siehe placeOnboardingCard). tourBusy verhindert
   überlappende Übergänge bei schnellem Mehrfach-Klick auf Weiter/Zurück. */
let tourBusy = false;
function renderOnboardingOverlay(){
  if(tourBusy) return;
  const existing = document.querySelector(".tour-card");
  const step = ONBOARDING_STEPS[onboardingStep];
  const proceed = ()=>{
    clearOnboardingDom();
    if(step.tab){
      activeTab = step.tab;
      if(step.expandGroup) expandedSettingsGroups.add(step.expandGroup);
      render();
    }
    setTimeout(()=>{
      const targetEl = step.target ? document.querySelector(step.target) : null;
      if(targetEl) targetEl.scrollIntoView({ behavior:"instant", block:"center" });
      setTimeout(()=>placeOnboardingCard(step, targetEl), targetEl ? 60 : 0);
    }, step.tab ? 50 : 0);
  };
  if(existing){
    tourBusy = true;
    document.querySelectorAll(".tour-spotlight, .tour-card").forEach(el=>el.classList.add("tour-fade-out"));
    setTimeout(()=>{ tourBusy = false; proceed(); }, 200);
  } else {
    proceed();
  }
}
function placeOnboardingCard(step, targetEl){
  clearOnboardingDom();
  const isLast = onboardingStep === ONBOARDING_STEPS.length-1;
  const block = document.createElement("div");
  block.className = "tour-block";
  document.body.appendChild(block);

  const card = document.createElement("div");
  card.style.opacity = "0";
  card.innerHTML = `
    <button class="tour-card-skip" data-act="onboarding-close">Überspringen</button>
    ${step.icon?`<div class="tour-card-icon" aria-hidden="true">${step.icon}</div>`:""}
    <h2>${escapeHtml(step.title)}</h2>
    <div class="tour-card-text">${escapeHtml(step.text)}</div>
    ${onboardingProgressHtml()}
    <div class="tour-actions">
      ${onboardingStep>0 ? `<button class="btn btn-secondary" data-act="onboarding-prev">Zurück</button>` : `<span></span>`}
      <button class="btn btn-primary" data-act="${isLast?"onboarding-close":"onboarding-next"}">${isLast?"Los geht's":"Weiter"}</button>
    </div>
  `;

  if(targetEl){
    const rect = targetEl.getBoundingClientRect();
    const pad = 8;
    const spot = document.createElement("div");
    spot.className = "tour-spotlight";
    spot.style.opacity = "0";
    spot.style.top = (rect.top-pad)+"px";
    spot.style.left = (rect.left-pad)+"px";
    spot.style.width = (rect.width+pad*2)+"px";
    spot.style.height = (rect.height+pad*2)+"px";
    document.body.appendChild(spot);

    card.className = "tour-card";
    document.body.appendChild(card);
    const cardH = card.offsetHeight;
    const spaceBelow = window.innerHeight - rect.bottom;
    const placeBelow = spaceBelow > cardH+40 || spaceBelow > rect.top;
    card.style.top = (placeBelow
      ? Math.min(rect.bottom+pad+8, window.innerHeight-cardH-16)
      : Math.max(16, rect.top-pad-8-cardH)) + "px";
    requestAnimationFrame(()=>{ spot.style.opacity = "1"; card.style.opacity = "1"; });

    if(step.demo) setTimeout(()=>playOnboardingDemo(step.demo, targetEl), 550);
  } else {
    block.style.background = "rgba(10,8,4,0.55)";
    block.style.backdropFilter = "blur(3px)";
    block.style.webkitBackdropFilter = "blur(3px)";
    card.className = "tour-card centered";
    document.body.appendChild(card);
    requestAnimationFrame(()=>{ card.style.opacity = "1"; });
  }
}
/* Rein visuelle "So funktioniert's"-Demo direkt über dem echten Zielelement - fasst bewusst NIE
   state/DOM des echten Elements an, nur eine schwebende Anzeige obendrauf, die sich von selbst
   wieder entfernt. So lässt sich ein kompletter Ablauf zeigen (z.B. fangen -> stirbt -> auf die
   Bank), ohne bei einem frischen Run versehentlich echten Fortschritt einzutragen. Jede Sequenz ist
   eine Liste von {text, tone}-Stationen, die der Reihe nach in derselben Sprechblase durchblendet
   werden (siehe .tour-demo-badge.tone-*). */
const TOUR_DEMO_SEQUENCES = {
  catch: [
    { text:"✓ Gefangen (Demo)", tone:"good" },
    { text:"☠ Stirbt (Demo)", tone:"red" },
    { text:"↔ Auf die Bank (Demo)", tone:"neutral" }
  ]
};
function playOnboardingDemo(kind, targetEl){
  if(!targetEl || !document.body.contains(targetEl)) return;
  const seq = TOUR_DEMO_SEQUENCES[kind];
  if(!seq || !seq.length) return;
  const rect = targetEl.getBoundingClientRect();
  const ripple = document.createElement("div");
  ripple.className = "tour-demo-ripple";
  ripple.style.left = (rect.left+rect.width/2)+"px";
  ripple.style.top = (rect.top+rect.height/2)+"px";
  document.body.appendChild(ripple);
  ripple.addEventListener("animationend", ()=>ripple.remove());

  const badge = document.createElement("div");
  badge.style.top = Math.max(16, rect.top-42)+"px";
  document.body.appendChild(badge);

  let i = 0;
  const nextStage = ()=>{
    if(!document.body.contains(targetEl) || i >= seq.length){
      badge.classList.remove("show");
      setTimeout(()=>badge.remove(), 300);
      return;
    }
    const stage = seq[i++];
    badge.className = `tour-demo-badge tone-${stage.tone}`;
    badge.textContent = stage.text;
    requestAnimationFrame(()=>badge.classList.add("show"));
    setTimeout(nextStage, 900);
  };
  nextStage();
}
function closeOnboardingTour(){
  clearOnboardingDom();
  tourBusy = false;
  try{ localStorage.setItem("nuzlocke-onboarding-seen","1"); }catch(e){}
}

/* Experimentelle "Zyklen"-Tour (Vorschau, siehe .tour-tip-Kommentar oben): statt einer einzigen
   großen Station pro Themenbereich (wie in ONBOARDING_STEPS) läuft hier jedes Thema als kleine
   Kette mehrerer Stationen ab, die jeweils nur EINEN Gedanken zeigen - hier exemplarisch "der Weg
   eines Fangs": erst der Fangen-Button selbst, dann wo der Fang danach auftaucht (Team), dann die
   Ausweich-Stelle bei vollem Team (Box), zuletzt wohin er im Todesfall wandert (Friedhof). Jede
   Station bekommt eigenen Text statt eines gemeinsamen Absatzes für mehrere Themen auf einmal.
   Weitere Zyklen (Bosskämpfe/Levelcap, Orden, Erfolge, ...) können nach demselben Muster als
   weitere Einträge in TOUR_CYCLES ergänzt werden, sobald sich der Stil bewährt hat. */
const TOUR_CYCLES = {
  catching: [
    { tab:"routes", target:'#content .card[data-loc]', text:"Hier trägst du ein, wenn du an diesem Standort ein Pokémon gefangen hast." },
    { tab:"team", target:'#teamGrid .slot', text:"Ist im Team noch ein Platz frei, landet dein Fang automatisch hier." },
    { tab:"box", target:'.tab[data-tab="box"]', text:"War das Team schon voll, findest du ihn stattdessen hier in der Box." },
    { tab:"grave", target:'.tab[data-tab="grave"]', text:"Stirbt er später, wandert er von hier aus in den Friedhof - jederzeit nachvollziehbar." }
  ]
};
let activeCycleId = null, cycleStep = 0;
/* Entfernt zwischen zwei Zyklen-Stationen NUR Spotlight/Tip, NIE .tour-block - anders als
   clearOnboardingDom() (siehe dort), das für die große Tour zwischen jeder Station kurz komplett
   räumt. Grund: die Zyklen-Tour braucht wegen der bewusst langsameren Übergänge (Fade-out + Tab-
   Wechsel + smooth Scroll + Wartezeit, siehe renderCycleStep()) mehrere hundert ms bis zur
   nächsten Station - würde .tour-block in dieser Zeit mitentfernt, ist die echte Oberfläche
   darunter für diese ganze Zeit ungeschützt antippbar (auf einem echten Gerät mit Tipp-Verzögerung
   leicht auszulösen). Ein Tipp währenddessen kann ein Sheet öffnen oder den Tab wechseln; setzt
   die Tour danach ihren Overlay wieder darüber, bleibt der Bildschirm dunkel und blockiert stehen,
   ohne dass noch etwas Sinnvolles sichtbar ist - genau das gemeldete "App wird dunkel, nichts
   angezeigt, nur Neustart hilft". Ein durchgehend stehendes .tour-block schließt diese Lücke. */
function clearCycleStepDom(){
  document.querySelectorAll(".tour-spotlight, .tour-tip").forEach(el=>el.remove());
}
function ensureTourBlock(){
  let block = document.querySelector(".tour-block");
  if(!block){
    block = document.createElement("div");
    block.className = "tour-block";
    document.body.appendChild(block);
  }
  return block;
}
function startTourCycle(cycleId){
  if(!TOUR_CYCLES[cycleId]) return;
  activeCycleId = cycleId;
  cycleStep = 0;
  ensureTourBlock();
  renderCycleStep();
}
function closeTourCycle(){
  clearOnboardingDom();
  tourBusy = false;
  activeCycleId = null;
}
/* Deutlich längere, klarer nachvollziehbare Übergänge als die große Tour: Blitz-Ausblenden (0ms)
   wirkte im Nutzertest "zu schnell" - hier erst sanftes Ausblenden (300ms), dann "smooth" statt
   "instant" scrollIntoView (man SIEHT die Seite zur nächsten Station wandern) mit anschließender
   Wartezeit, bevor die neue Station einblendet. */
function renderCycleStep(){
  if(tourBusy || !activeCycleId) return;
  const cycle = TOUR_CYCLES[activeCycleId];
  const step = cycle[cycleStep];
  const existing = document.querySelector(".tour-tip");
  const proceed = ()=>{
    clearCycleStepDom();
    if(step.tab){ activeTab = step.tab; render(); }
    setTimeout(()=>{
      const targetEl = step.target ? document.querySelector(step.target) : null;
      if(targetEl) targetEl.scrollIntoView({ behavior:"smooth", block:"center" });
      setTimeout(()=>placeCycleTip(step, targetEl), targetEl ? 450 : 0);
    }, step.tab ? 150 : 0);
  };
  if(existing){
    tourBusy = true;
    document.querySelectorAll(".tour-spotlight, .tour-tip").forEach(el=>el.classList.add("tour-fade-out"));
    setTimeout(()=>{ tourBusy = false; proceed(); }, 320);
  } else {
    proceed();
  }
}
function placeCycleTip(step, targetEl){
  clearCycleStepDom();
  /* Ziel fehlt oder ist inzwischen aus dem DOM entfernt (z.B. weil ein Tipp in der oben
     beschriebenen ungeschützten Lücke zwischenzeitlich einen kompletten Re-Render ausgelöst hat,
     der die zuvor gemerkte Karte ersetzt hat) - sauber beenden statt einen kaputten, hängenden
     Overlay ohne erkennbaren Inhalt stehen zu lassen. */
  if(!targetEl || !document.body.contains(targetEl) || !activeCycleId){ closeTourCycle(); return; }
  ensureTourBlock();

  const rect = targetEl.getBoundingClientRect();
  const pad = 8;
  const spot = document.createElement("div");
  spot.className = "tour-spotlight";
  spot.style.opacity = "0";
  spot.style.top = (rect.top-pad)+"px";
  spot.style.left = (rect.left-pad)+"px";
  spot.style.width = (rect.width+pad*2)+"px";
  spot.style.height = (rect.height+pad*2)+"px";
  document.body.appendChild(spot);

  const cycle = TOUR_CYCLES[activeCycleId];
  const isLast = cycleStep === cycle.length-1;
  const tip = document.createElement("div");
  tip.style.opacity = "0";
  tip.innerHTML = `
    <div class="tour-tip-text">${escapeHtml(step.text)}</div>
    <div class="tour-tip-foot">
      <div class="tour-tip-dots">${cycle.map((_,i)=>`<span class="tour-tip-dot${i===cycleStep?" active":""}"></span>`).join("")}</div>
      <div class="tour-tip-actions">
        <button class="tour-tip-skip" type="button" data-act="cycle-close">Beenden</button>
        <button class="tour-tip-next" type="button" data-act="${isLast?"cycle-close":"cycle-next"}">${isLast?"Fertig":"Weiter ›"}</button>
      </div>
    </div>
  `;
  document.body.appendChild(tip);
  tip.className = "tour-tip";
  const tipH = tip.offsetHeight, tipW = tip.offsetWidth;
  const spaceBelow = window.innerHeight - rect.bottom;
  const placeBelow = spaceBelow > tipH+24 || spaceBelow > rect.top;
  tip.style.top = (placeBelow
    ? Math.min(rect.bottom+pad+10, window.innerHeight-tipH-16)
    : Math.max(16, rect.top-pad-10-tipH)) + "px";
  const left = Math.max(16, Math.min(rect.left+rect.width/2-tipW/2, window.innerWidth-tipW-16));
  tip.style.left = left+"px";
  requestAnimationFrame(()=>{ spot.style.opacity = "1"; tip.style.opacity = "1"; });
}

function hofGridHtml(items, isPlayerTeam){

/* Run-Rückblick: teilbare Zusammenfassung am Ende eines Runs, nur sichtbar sobald das finale
   Duell erfasst ist (gleiche Bedingung wie die Ruhmeshalle-Karte). Nutzt bewusst das im finalen
   Duell erfasste Team-Snapshot (hallOfFame.playerTeam) statt des aktuell lebenden Teams, da das
   sich danach noch ändern kann - der Rückblick soll den Stand am Run-Ende festhalten. */
function runRecapStats(){
  const caught = aliveCount()+deadCount();
  const rate = survivalRate();
  const bossesDefeated = activeBosses().filter(b=>isBossDefeated(b.id)).length;
  const totalBosses = activeBosses().length;
  const duelTally = rivalDuelTally();
  const hof = state.hallOfFame;
  const duration = state.eventLog.length ? formatDuration(state.eventLog[0].ts, hof.defeatedAt) : "–";
  return { caught, survivalRate: rate, bossesDefeated, totalBosses, duelTally, won: hof.result!=="loss", duration };
}

function runRecapHeadline(){
  if(state.soloMode){
    const champ = finalStoryBoss();
    return `${escapeHtml(champ?.name || champ?.cls || "Champion")} besiegt`;
  }
  return runRecapStats().won ? "Sieg im finalen Duell" : "Niederlage im finalen Duell";
}

/* Erzählte Zusammenfassung aus bereits vorhandenen Stats/Zählern - bewusst OHNE
   Typverteilungs-Analyse ("hauptsächlich Wasser-Team"), da das eine komplette
   Arten→Typ-Referenztabelle bräuchte, die es in der App aktuell nicht gibt. */
function runRecapNarrative(){
  const s = runRecapStats();
  const sentences = [];
  sentences.push(`${state.runTitle||"Der Run"} auf ${currentGame().shortLabel} endete ${s.won?"mit einem Sieg":"mit einer Niederlage"}${state.soloMode?"":" im finalen Rivalenduell"}${s.duration!=="–"?` nach ${s.duration}`:""}.`);
  sentences.push(`Insgesamt wurden ${s.caught} Pokémon gefangen, ${deadCount()} davon sind unterwegs gestorben${s.survivalRate!==null?` – das entspricht ${s.survivalRate}% Überlebensrate`:""}.`);
  sentences.push(`${s.bossesDefeated} von ${s.totalBosses} Bosskämpfen wurden gemeistert${state.lossCount?`, bei insgesamt ${state.lossCount} Kampfniederlagen unterwegs`:", ganz ohne eine einzige Kampfniederlage"}.`);
  if(!state.soloMode && (s.duelTally.wins+s.duelTally.losses)>0){
    sentences.push(`Im direkten Duell standen sich ${s.duelTally.wins} Siege und ${s.duelTally.losses} Niederlagen gegenüber.`);
  }
  return sentences.join(" ");
}

/* Kleine Analyse aus vorhandenen Zählern statt neuer Datenstrukturen: längste Fangserie ohne
   Todesfall aus dem Verlauf, härtester Gegner aus bossLossIds, Erfolge, ignorierte Dupes-Warnungen. */
function runRecapInsights(){
  const insights = [];
  let streak = 0, maxStreak = 0;
  state.eventLog.forEach(e=>{
    if(e.type==="catch"){ streak++; maxStreak = Math.max(maxStreak, streak); }
    else if(e.type==="dead") streak = 0;
  });
  if(maxStreak>=3) insights.push(`Längste Fangserie ohne Todesfall: ${maxStreak} Pokémon.`);

  const lossEntries = Object.entries(state.bossLossIds||{}).filter(([,c])=>c>0);
  if(lossEntries.length){
    lossEntries.sort((a,b)=>b[1]-a[1]);
    const [hardestId, count] = lossEntries[0];
    const boss = bossById(hardestId);
    if(boss) insights.push(`Härtester Gegner: ${boss.name||boss.cls} (${count}× verloren${state.bossDefeated[hardestId]?", bevor der Sieg gelang":""}).`);
  }

  const unlockedCount = ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  if(unlockedCount) insights.push(`${unlockedCount} von ${ACHIEVEMENTS.length} Erfolgen freigeschaltet.`);

  if(state.dupesIgnoredCount) insights.push(`${state.dupesIgnoredCount}× wurde die Dupes-Clause-Warnung ignoriert.`);

  if(!insights.length) insights.push("Noch nicht genug Daten für eine Analyse gesammelt.");
  return insights;
}

function runRecapText(){
  const s = runRecapStats();
  const hof = state.hallOfFame;
  const team = (hof.playerTeam||[]).map(m=>`- ${m.nickname ? `${m.nickname} (${m.species})` : m.species}`).join("\n") || "- (kein Team erfasst)";
  const lines = [
    `${effectiveRunTitle(state.runTitle)} - ${currentGame().shortLabel}`,
    runRecapHeadline(),
    "",
    "Team:",
    team,
    "",
    `Überlebensrate: ${s.survivalRate===null?"-":s.survivalRate+"%"}`,
    `Gefangen: ${s.caught}  ·  Gestorben: ${deadCount()}`,
    `Kampfniederlagen: ${state.lossCount||0}`,
    `Bosse besiegt: ${s.bossesDefeated}/${s.totalBosses}`,
    `Run-Dauer: ${s.duration}`
  ];
  if(!state.soloMode) lines.push(`Duelle: ${s.duelTally.wins} Siege, ${s.duelTally.losses} Niederlagen`);
  lines.push("", runRecapNarrative());
  const insights = runRecapInsights();
  if(insights.length){
    lines.push("", "Analyse:");
    insights.forEach(i=>lines.push(`- ${i}`));
  }
  return lines.join("\n");
}

/* Eigene Funktion statt nur inline im Klick-Handler, da sie zweifach gebraucht wird: direkt über
   "Als Text kopieren" (Browser ohne Web-Share-Unterstützung) und als Fallback, falls das native
   Teilen-Menü (navigator.share) fehlschlägt oder gar nicht erst verfügbar ist. */
function copyRunRecapToClipboard(){
  const text = runRecapText();
  const done = ()=>{
    openSheet(`
      <h3>Kopiert</h3>
      <div class="loc-sub" style="margin-bottom:14px;">Der Run-Rückblick liegt als Text in der Zwischenablage.</div>
      <div class="sheet-footer"><button class="btn btn-primary btn-block" data-act="close-sheet">OK</button></div>
    `);
  };
  const failed = ()=>{
    openSheet(`
      <h3>Kopieren nicht möglich</h3>
      <div class="loc-sub" style="margin-bottom:14px;">Der Browser hat den Zugriff auf die Zwischenablage verweigert. Text zum manuellen Kopieren:</div>
      <textarea readonly style="width:100%; min-height:140px; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:.85rem; background:var(--bg); color:var(--ink);">${escapeHtml(text)}</textarea>
      <div class="sheet-footer" style="margin-top:14px;"><button class="btn btn-primary btn-block" data-act="close-sheet">Schließen</button></div>
    `);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, failed);
  else failed();
}

function settingsGroupHtml(key, label, bodyHtml){
  const expanded = expandedSettingsGroups.has(key);
  const header = `<button class="region-header settings-group-header" data-act="toggle-settings-group" data-group="${key}">
    <span>${escapeHtml(label)}</span>
    <svg class="collapse-chevron${expanded?" open":""}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>`;
  /* Der Inhalt liegt immer im DOM (statt bei expanded:false komplett wegzulassen) und wird über
     grid-template-rows 0fr<->1fr auf- bzw. zugefahren - das braucht keine bekannte/gemessene Höhe
     und funktioniert damit auch bei variabel langem Karteninhalt. Wichtig: der Klick-Handler für
     toggle-settings-group ruft bewusst NICHT render() auf, sondern schaltet die Klasse direkt am
     bestehenden DOM-Knoten um - ein volles innerHTML-Replacement würde das Element neu erzeugen,
     bevor der Browser die alte Höhe als Ausgangspunkt für die Transition sehen kann, wodurch keine
     Animation sichtbar wäre, sondern nur ein sofortiges Umschalten. */
  const body = `<div class="collapsible-body${expanded?" expanded":""}" data-group-body="${key}"${expanded?"":" inert"}><div class="collapsible-body-inner">${bodyHtml}</div></div>`;
  return header + body;
}

/* Erfolge & Titel: jeder Eintrag schaltet sowohl einen Erfolg (sichtbar in den Einstellungen)
   als auch einen wählbaren Titel frei, der optional im Kopfbereich neben dem Run-Titel erscheint
   (siehe renderActiveTitleBadge). check() liest bewusst direkt aus dem globalen state/den globalen
   Helper-Funktionen statt Parametern zu übernehmen - gleiche Konvention wie teamCount()/aliveCount()
   & co. championWon() prüft strikt auf einen echten Sieg (true), nicht auf eine per "Kampf trotz
   Niederlage als abgeschlossen zählen" fortgeführte Niederlage (siehe bossDefeated-Werte). */
function championWon(){
  const fb = finalStoryBoss();
  return !!fb && state.bossDefeated[fb.id] === true;
}
/* Zähl-Helfer für die 17 Typ-Sammel-Erfolge weiter unten - zählt jeden in diesem Run jemals
   gefangenen Fund mit passendem Typ, unabhängig von Status (Team/Box/Friedhof/abgegeben), da es um
   die Fang-Historie geht, nicht das aktuelle Team. Dual-Typen zählen für beide Typen. */
function countTypeCaught(type){
  let n = 0;
  state.locations.forEach(l=>{
    if(!l.mon) return;
    if(typesFor(l.mon.species).includes(type)) n++;
  });
  return n;
}

/* checkAchievements() läuft am Ende JEDES Klicks im globalen Dispatcher mit (siehe ganz unten) statt
   nur an einzelnen Stellen - die check()-Funktionen sind reine, billige Zustandsabfragen (keine
   Seiteneffekte), ein Aufruf zu viel ist also unbedenklich, verpasste Trigger-Stellen dagegen schon. */
let pendingAchievementToasts = [];
function checkAchievements(){
  let changed = false;
  ACHIEVEMENTS.forEach(a=>{
    if(state.achievements[a.id]) return;
    if(a.check()){
      state.achievements[a.id] = Date.now();
      logEvent("achievement", `Erfolg freigeschaltet: ${a.name} (Titel „${a.title}“)`);
      pendingAchievementToasts.push(a);
      changed = true;
    }
  });
  if(changed){ saveState(); renderActiveTitleBadge(); showNextAchievementToast(); }
}
function showNextAchievementToast(){
  if(document.querySelector(".achievement-toast")) return;
  const next = pendingAchievementToasts.shift();
  if(!next) return;
  const toast = document.createElement("div");
  toast.className = "achievement-toast";
  toast.innerHTML = `
    <div class="achievement-toast-icon">${next.icon}</div>
    <div class="achievement-toast-body">
      <div class="achievement-toast-label">Erfolg freigeschaltet</div>
      <div class="achievement-toast-name">${escapeHtml(next.name)}</div>
      <div class="achievement-toast-sub">Titel „${escapeHtml(next.title)}“ freigeschaltet</div>
    </div>
  `;
  toast.addEventListener("click", ()=>dismissAchievementToast(toast));
  document.body.appendChild(toast);
  toast._timer = setTimeout(()=>dismissAchievementToast(toast), 3800);
}
function dismissAchievementToast(toast){
  if(!toast || toast._dismissing) return;
  toast._dismissing = true;
  clearTimeout(toast._timer);
  toast.classList.add("out");
  setTimeout(()=>{ toast.remove(); showNextAchievementToast(); }, 260);
}
/* Allgemeiner Rückgängig-Toast (siehe Klick-Listener weiter unten, der undoPreSnapshot zieht und
   nach der Aktion showUndoToast aufruft): kuratierte Auswahl an leicht versehentlich ausgelösten,
   schwer wieder auffindbaren Aktionen - bewusst NICHT jede State-Änderung (z.B. Settings-Schalter
   brauchen keinen Toast, ein erneuter Klick macht sie trivial rückgängig). */
const UNDOABLE_ACTIONS = {
  "mark-failed": "Als „nicht gefangen“ markiert",

  "save-catch": "Fang eingetragen",
  "confirm-save-catch-dupe": "Fang eingetragen",
  "delete-location": "Standort gelöscht"
};
let lastUndoSnapshot = null;
function showUndoToast(label){
  document.querySelector(".undo-toast")?.remove();
  const toast = document.createElement("div");
  toast.className = "undo-toast";
  toast.innerHTML = `
    <span class="undo-toast-label">${escapeHtml(label)}</span>
    <button class="undo-toast-btn" type="button">Rückgängig</button>
  `;
  toast.querySelector(".undo-toast-btn").addEventListener("click", ()=>{
    if(lastUndoSnapshot){
      try{ state = JSON.parse(lastUndoSnapshot); saveState(); render(); }catch(e){}
      lastUndoSnapshot = null;
    }
    dismissUndoToast(toast);
  });
  document.body.appendChild(toast);
  toast._timer = setTimeout(()=>dismissUndoToast(toast), 6000);
  attachToastSwipeDismiss(toast);
}
function dismissUndoToast(toast){
  if(!toast || toast._dismissing) return;
  toast._dismissing = true;
  clearTimeout(toast._timer);
  toast.classList.add("out");
  setTimeout(()=>toast.remove(), 220);
}
/* Wischen zum Wegwischen: wer den Rückgängig-Hinweis nicht braucht, muss nicht die volle Stehzeit
   abwarten - seitliches Wischen (in beide Richtungen) schiebt den Toast sofort in Wischrichtung
   weg, ohne die Rückgängig-Aktion auszulösen (entspricht dem normalen Auto-Verschwinden, nur
   selbst ausgelöst). Folgt demselben Ziehen-1:1-dann-Entscheiden-Muster wie das bestehende
   Herunterziehen am Sheet-Griff (siehe dort) - während des Wischens läuft keine Transition (folgt
   dem Finger direkt), erst beim Loslassen greift wieder eine Transition, entweder fürs
   Zurückschnappen oder fürs Rausschieben. Per Event-Delegation auf dem Toast selbst statt nur auf
   dem Button, damit die ganze Fläche wischbar ist; da nie preventDefault() aufgerufen wird, bleibt
   ein normaler Tap auf den Rückgängig-/OK-Button unangetastet. */
function attachToastSwipeDismiss(toast){
  const DISMISS_DISTANCE = 80, DISMISS_VELOCITY = 0.5;
  let dragging=false, startX=0, startTime=0, curDx=0;
  toast.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    dragging = true; curDx = 0;
    startX = e.touches[0].clientX;
    startTime = Date.now();
    toast.style.transition = "none";
  }, {passive:true});
  toast.addEventListener("touchmove", e=>{
    if(!dragging) return;
    curDx = e.touches[0].clientX - startX;
    toast.style.transform = `translateX(calc(-50% + ${curDx}px))`;
    toast.style.opacity = String(Math.max(0.1, 1 - Math.abs(curDx)/220));
  }, {passive:true});
  function release(){
    if(!dragging) return;
    dragging = false;
    const elapsed = Math.max(1, Date.now()-startTime);
    const velocity = Math.abs(curDx)/elapsed;
    if(Math.abs(curDx) > DISMISS_DISTANCE || velocity > DISMISS_VELOCITY){
      const dir = curDx < 0 ? -1 : 1;
      toast.style.transition = "transform .2s ease, opacity .2s ease";
      toast.style.transform = `translateX(calc(-50% + ${dir*420}px))`;
      toast.style.opacity = "0";
      dismissUndoToast(toast);
    } else {
      toast.style.transition = "transform .2s ease, opacity .2s ease";
      toast.style.transform = "";
      toast.style.opacity = "";
    }
  }
  toast.addEventListener("touchend", release);
  toast.addEventListener("touchcancel", release);
}
/* Gleiche Optik wie der Rückgängig-Toast, aber ohne Undo-Aktion - reine Warnung, dass das
   Speichern gerade fehlschlägt (siehe warnOnSaveFailure()). Bleibt bewusst länger stehen als der
   Rückgängig-Toast (10s statt 6s), da es eine wichtigere Meldung ist. */
function showStorageWarnToast(){
  document.querySelector(".undo-toast")?.remove();
  const toast = document.createElement("div");

  toast.innerHTML = `

    <button class="undo-toast-btn" type="button">OK</button>
  `;
  toast.querySelector(".undo-toast-btn").addEventListener("click", ()=>dismissUndoToast(toast));
  document.body.appendChild(toast);
  toast._timer = setTimeout(()=>dismissUndoToast(toast), 10000);
  attachToastSwipeDismiss(toast);
}

}

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.49</span><span class="tag tag-fix">Fix</span></div>
      <h3>Zwei weitere Stabilitäts-Lücken geschlossen: ungeschützte Theme-Speicherung, Sprite-Cache überlebt jetzt App-Updates</h3>
      <p>Auf Nutzerfrage hin gezielt nach weiteren Absturz-/Instabilitäts-Quellen gesucht, über die
      bereits behobene Sprite-Auslagerung (v1.9.48) hinaus. Zwei Funde:</p>
      <p><strong>1. Ungeschützte <code>localStorage</code>-Schreibzugriffe beim Theme-Umschalten:</strong>
      seit v1.8.15 fangen die beiden zentralen Speicher-Schreibfunktionen (Fang-/Spielstand) Fehler von
      <code>localStorage.setItem</code> ab (voller/gesperrter Speicher, z.B. iOS-Privatmodus), damit die
      App dabei nicht mit einer unbehandelten Exception mitten im Ablauf abstürzt - die beiden Theme-
      Umschalter (Hell/Dunkel-Button, Einstellungen-Auswahl) waren dabei übersehen worden und riefen
      <code>localStorage.setItem</code> ungeschützt auf. Jetzt nach demselben Muster abgesichert.</p>
      <p><strong>2. Service-Worker-Cache verwarf Sprites bei jedem Update:</strong> der Cache-Name
      (inklusive aller bereits heruntergeladenen Sprites) wurde bisher bei jedem einzelnen Versions-Update
      komplett gelöscht und musste danach erst wieder neu aufgebaut werden - offline oder bei schlechter
      Verbindung direkt nach einem Update konnten dadurch Sprites fehlschlagen, die vorher schon einmal
      geladen waren. Sprites liegen jetzt in einem eigenen, von der App-Version unabhängigen Cache, der
      Updates übersteht; nur der restliche App-Shell-Cache (HTML/Manifest/Icons) wird wie gewohnt bei
      jedem Update ersetzt.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.48</span><span class="tag tag-fix">Fix</span></div>
      <h3>Absturz-Ursache behoben: Sprite-Bilder aus der HTML-Datei ausgelagert (94% kleiner)</h3>
      <p>Nutzerfeedback: die App stürzte auf dem Handy schon beim bloßen Laden ab, noch bevor sich
      irgendetwas bearbeiten ließ. Ursache gefunden und behoben: <code>nuzlocke-v2-editionen.html</code>
      war zuletzt 15,88&nbsp;MB groß - davon <strong>94,8%</strong> reine Bilddaten (Sprites), als Base64-Text
      in vier einzelnen, mehrere Megabyte langen JavaScript-Zeilen eingebettet. Ein Browser musste diese
      komplett am Stück parsen und im Speicher halten, bevor überhaupt etwas angezeigt werden konnte -
      auf Mobilgeräten (v.&nbsp;a. in der installierten PWA, mit deutlich weniger Speicher-Spielraum als ein
      Desktop-Browser) führte das zum Absturz noch vor jeder Interaktion.</p>
      <p><strong>Fix:</strong> alle 2027 Sprite-Bilder (649 klassische Pixel-Sprites, 1075 moderne Artworks,
      235 Bosstrainer-Sprites, 68 Orden-Icons) liegen jetzt als echte, einzelne Bilddateien unter
      <code>sprites/</code> statt als eingebettete Base64-Texte - <code>nuzlocke-v2-editionen.html</code>
      selbst schrumpft dadurch von 15,88&nbsp;MB auf 865&nbsp;KB. Der Browser lädt Sprites jetzt über seine normale,
      speicherschonende Bild-Pipeline nach, verzögert und einzeln gecacht durch den ohnehin vorhandenen
      Service-Worker-Fetch-Handler - statt einer einzigen riesigen JS-Konstante. Funktional identisch:
      alle Sprite-Anzeigen (Team/Box/Fangen-Formular, Bosskämpfe inkl. der Sieg-Einfrier-Animation, Orden)
      funktionieren unverändert, nur eben ohne die riesige Fracht beim Laden.</p>
      <p><strong>Zwei Auslieferungswege, zwei Strategien:</strong> für die PWA/Netlify-Installation (kein
      Dateilimit) liegen die 2027 Sprites als eigene Dateien neben <code>index.html</code>. Für den
      Claude-Artifact-Publish (max. 255 Dateien pro Veröffentlichung, weit unter den 2027 Sprites) bettet
      ein neuer Build-Schritt (<code>tools/inline-sprites.js</code>) die Dateien für genau diese eine
      Veröffentlichung wieder als Base64 ein - dort bleibt die App weiterhin eine einzige, in sich
      geschlossene Datei wie bisher, nur der zugrunde liegende Quellcode ist jetzt schlank.</p>
    </div>

      <p>Nutzerfeedback: die volle, immer ausgeklappte Orden-Karte im Team-Tab nahm deutlich zu viel Platz ein. Ersetzt durch eine kompakte, klickbare Schatulle direkt neben der Levelcap-Karte (die dafür etwas schmaler geworden ist) - zeigt geschlossen nur den Fortschritt als Zahl (z.&nbsp;B. "5/8"). Antippen öffnet die Schatulle mit einer kleinen eigenen Öffnen-Geste (der gezeichnete Deckel klappt sichtbar auf) und klappt darunter die vollständige, jetzt sogar größer und schöner gestaltete Orden-Übersicht auf (56px statt 44px große Orden, dezentes Leuchten bei erhaltenen) - erneutes Antippen klappt wieder ein. Nutzt dieselbe, bereits an anderer Stelle bewährte Auf-/Zuklapp-Animation wie die Einstellungs-Gruppen. Editionen ohne Orden (Sonne/Mond, Ultrasonne/Ultramond) zeigen weiterhin konsequent keine Schatulle.</p>

      <h3>Orden-Feier: länger sichtbar, mit Feuerwerk, striktes Vierer-Raster</h3>
      <p>Nutzerfeedback zur neuen Orden-Feier aus v1.9.24: der frisch erhaltene Orden verschwand viel zu schnell wieder. Bleibt jetzt knapp 2,5 Sekunden groß und gut sichtbar in der Bildschirmmitte stehen (inklusive kurzem Einblend-Bounce), begleitet von zwei kleinen Feuerwerk-Funkenausbrüchen, bevor er nach oben wegschwebt und ausblendet - landet dabei bewusst nicht mehr exakt im Header-Tray (zu hektisch für einen Feier-Moment), der zugehörige Header-Chip blendet stattdessen erst am Ende sauber ein. Zusätzlich: das Orden-Raster im Header nutzte bisher flexibles Zeilenumbruch-Verhalten und passte bei 8 Orden ungleichmäßig 5+3 statt 4+4 hinein - jetzt ein festes Vierer-Raster (CSS Grid statt Flexbox), garantiert bei jeder Ordenanzahl exakt vier pro Reihe.</p>

      <h3>Orden-Sammlung im Header + Feier-Animation beim Erhalt</h3>
      <p>Der freie Platz rechts neben den Team-Slots im Header zeigt jetzt die bereits erhaltenen Orden der aktuellen Edition als kleine goldgeränderte Chips - startet leer und füllt sich nach und nach, wächst bei Editionen mit vielen Orden (z.&nbsp;B. HeartGold/SoulSilver oder Gold/Silber/Kristall mit 16 statt den üblichen 8, da Johto und Kanto zusammen zählen) automatisch über mehrere Vierer-Reihen. Beim Sieg gegen eine Arenaleiterin/einen Arenaleiter taucht der frisch erhaltene Orden jetzt zusätzlich groß und golden umrandet in der Bildschirmmitte auf, bevor er sich verkleinert und zu seinem Platz im Header fliegt - ohne dass dabei irgendetwas anderes im Layout verschoben wird. Editionen ohne klassische Arenen (Sonne/Mond, Ultrasonne/Ultramond) zeigen weiterhin konsequent keine Orden-Reihe an.</p>

      <p>Erste Fixrunde aus einem umfassenden Gen-1-9-Audit (Orte, Namen, Kämpfe, Level). <strong>Kanto (Rot/Blau/Gelb/Feuerrot/Blattgrün):</strong> Route 11-15, Digdas Höhle, Kraftwerk, Azuria-Höhle und die bislang komplett fehlende Pokémon-Villa (samt Geheimschlüssel fürs Zinnoberinsel-Orden) ergänzt, "Prismania-Villa" zu "Prismania-Apartments" korrigiert, Erikas Ass in Rot/Blau von Sarzenia zu Giflor berichtigt. <strong>Johto (HeartGold/SoulSilver):</strong> fehlender Proton-Kampf am Flegmon-Brunnen ergänzt, sechs bislang assfreie Team-Rocket-Vorstandskämpfe (Lance, Lambda, Athena, Atlas) mit ihren echten Assen befüllt. <strong>Johto (Gold/Silber/Kristall + HG/SS):</strong> der Sammelstandort "See des Zorns" bündelte bislang fälschlich den gesamten Team-Rocket-Handlungsbogen - Rundfunkturm und Team-Rocket-Versteck sind jetzt eigene Kacheln mit den jeweils richtigen Kämpfen. <strong>Sinnoh (Diamant/Perl/Platin/BDSP):</strong> Speersäule als eigener Standort vom Kraterberg abgetrennt (inkl. Zyrus-Finalkampf und Platins Zerrwelt-Zugang). <strong>Hoenn (Rubin/Saphir/Smaragd/ORAS):</strong> Heikos erstes Ass korrekt als unentwickeltes Trasla statt Kirlia geführt, in Omega Rubin/Alpha Saphir zusätzlich Levelanpassung, Heikos Finalass zu Mega-Galagladi korrigiert, ein bislang fehlender zweiter Kalle/Kordula-Kampf auf dem Schlotberg ergänzt sowie das ORAS-exklusiv umbenannte Schiffswrack als "Seewoge Malvenfroh" geführt (Original-Editionen behalten "Schiffswrack"). <strong>Paldea:</strong> Shugis Level von 33 auf 32 korrigiert. Die restlichen Regionen des Audits (Einall, Kalos, Alola, Galar) folgen in weiteren Runden.</p>

      <p>Auf Wunsch: jede besiegte Arenaleiterin/jeder besiegte Arenaleiter hinterlässt jetzt ihren/seinen echten Orden auf der Bosskarte (kleines Icon oben links, analog zum bestehenden Sieg-Haken oben rechts) - alle 68 Orden-Icons stammen von Bulbagarden Archives, mit den tatsächlich in der jeweiligen deutschen Lokalisierung verwendeten Namen (u.&nbsp;a. Felsorden/Quellorden/Donnerorden für Kanto, Flügelorden/Insektorden für Johto, bis zu den neuen Arenaorden aus Paldea). Neu im Team-Tab: eine "Orden"-Karte zeigt alle Orden der aktuellen Edition als Sammlung - erhaltene farbig mit goldenem Rand, offene grau. Berücksichtigt dabei automatisch Sonderfälle wie das Orion-City-Trio (drei mögliche Gegner, aber ein gemeinsamer Orden) und die Schwert/Schild-Versionswechsel (Nio vergibt den Geister-Orden, Mac in Schwert dagegen den Kampf-Orden - je nach Version der richtige). Editionen ohne klassische Arenen (Sonne/Mond, Ultrasonne/Ultramond - Inselprüfungen statt Orden) zeigen die neue Karte konsequent gar nicht erst an.</p>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.17</span><span class="tag tag-fix">Fix</span></div>
      <h3>Editionswahl-Farben griffen nicht, wenn die App als eigenständiges Artefakt veröffentlicht ist</h3>
      <p>Nutzerbestätigt per Screenshot: in der als eigene Seite veröffentlichten App-Kopie zeigten die neuen Editionswahl-Karten aus v1.9.16 keine Werkstoff-Textur, Schwarz und Weiß blieben ungefärbt - im normalen PWA-/ZIP-Betrieb dagegen unauffällig korrekt. Ursache: eine Artefakt-Veröffentlichung bettet die App (selbst ein vollständiges <code>&lt;html&gt;&lt;head&gt;…&lt;/head&gt;&lt;body&gt;…</code>-Dokument) in ein zweites, äußeres HTML-Grundgerüst - der Browser verwirft dabei die verschachtelte, zweite <code>&lt;head&gt;</code>-Öffnung als Fehler und hängt den App-eigenen <code>&lt;style&gt;</code>-Block stattdessen an <code>&lt;body&gt;</code>, das im Dokumentbaum immer NACH <code>&lt;head&gt;</code> steht - und damit nach den zur Laufzeit per JavaScript in <code>&lt;head&gt;</code> injizierten Werkstoff-Regeln. Bei gleicher Selektor-Spezifität (je eine Klasse) gewann dadurch die spätere, unstylte Basisregel. Die Editionswahl-Regeln nutzen nach diesem Fix denselben Verbund-Selektor-Kniff wie <code>.btn-primary</code> (zwei Klassen statt einer) und sind damit unabhängig von dieser Dokumentreihenfolge.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.16</span><span class="tag tag-feat">Feature</span></div>
      <h3>Werkstoff-Design auch auf der Editionswahl, Namen ohne "Edition"</h3>
      <p>Direkter Folgeschritt zu v1.9.15: Beim Anlegen eines neuen Spielstands zeigt "Neuer Spielstand" jetzt ebenfalls die Werkstoff-Textur & Button-Form jeder Edition, nicht mehr nur graue Einheitskarten - genau dieselben Rezepte wie auf den primären Buttons, nur diesmal alle 22 gleichzeitig sichtbar statt nur der aktuell aktiven Edition. Da hier anders als bei <code>.btn-primary</code> nicht die gerade aktive Edition, sondern alle 22 auf einmal dargestellt werden, konnte die bestehende <code>[data-edition]</code>-Selektor-Kaskade nicht direkt wiederverwendet werden: neue editionsunabhängige <code>.mat-bg-*</code>/<code>.mat-shape-*</code>-Hilfsklassen, denen jede Karte ihre eigenen Farbwerte per Inline-Style mitgibt, bekommen so pro Karte ihre korrekte Farbe unabhängig von der aktuell aktiven Edition. Zusätzlich auf Wunsch die Editionsnamen entschlackt: aus "Rote / Blaue Edition", "Schwarze Edition" &amp; Co. wird schlicht "Rot / Blau", "Schwarz" usw. - passend zum bereits kürzeren Diamant/Perl-, Gold/Silber- und FeuerRot/BlattGrün-Stil, den es für diese 14 Editionen vorher noch nicht gab.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.15</span><span class="tag tag-feat">Feature</span></div>
      <h3>Werkstoff-Design: jede Edition mit eigener Textur &amp; Button-Form</h3>
      <p>Zusätzlich zur bestehenden Akzentfarbe bekommt jede der 22 Editionen jetzt einen eigenen "Werkstoff" auf den primären Buttons (Fangen, Bestätigen, Weiter, ...): Diamant/Rubin/Saphir/Smaragd/Kristall & Co. facettierter Kristallschliff mit feinen Glanzpunkten, Rot/Blau/FeuerRot/BlattGrün glänzendes Kassetten-Plastik, Gelb mattes Gummi, Gold/Silber/Platin/Schwert gebürsteter Stahl, Schild gehämmerte Bronze, HG/SS glänzendes Emaille-Medaillon, Schwarz/Weiß/Schwarz2-Weiß2 eine reine Schwarz/Weiß-Achse (Button immer im Gegenteil zum Hell/Dunkel-Modus), X/Y Lack mit Blattgold-Rahmen. Bei Diamant/Perl und Sonne/Mond/Ultrasonne/Ultramond wechselt beim Hell/Dunkel-Umschalten sogar die Technik selbst (Perlmutt/Facettenschliff bzw. Sonnenstrahlen/Sternenhimmel), nicht nur die Farbe - genau wie die App bei diesen kombinierten Versionspaaren schon länger hell/dunkel für die beiden Namenshälften nutzt. Jede Form/Textur läuft rein über zusätzliche <code>background-image</code>-Ebenen auf <code>.btn-primary</code> (keine der ~60 Verwendungsstellen im Code musste angefasst werden) und wiederverwendet die ohnehin vorhandenen Farbvariablen - kein neuer Umschalter, kein neues Bild-Asset. Zuerst als Musterbuch-Artefakt mit dem Nutzer durchgesprochen und mehrfach verfeinert (Button-Formen, feinere Bürstung, Schwarz/Weiß-Kontrastumkehr), bevor es hier ins echte Layout übernommen wurde.</p>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.14</span><span class="tag tag-fix">Fix</span></div>
      <h3>Android-/iOS-Kompatibilitäts-Audit: 6 Fixes</h3>
      <p>Gezielter Bug-/Kompatibilitäts-Durchgang, losgelöst vom letzten Editions-Feature. Zwei größere Funde: erstens konnten drei ungeschützte <code>localStorage</code>-Aufrufe beim App-Start (Safari-Privatmodus oder blockierte Cookies auf iOS) die App komplett zum Absturz bringen, bevor überhaupt etwas gerendert wird - jetzt wie alle anderen Speicher-Zugriffe try/catch-abgesichert. Zweitens schloss die System-Zurück-Taste auf Android (installierte PWA) offene Sheets nicht, sondern verließ direkt die App - Sheets pushen jetzt einen History-Eintrag beim Öffnen, Zurück-Taste UND normales Schließen (Backdrop, Sheet-Griff, Schließen-Buttons) laufen über denselben Pfad, inklusive Schutz gegen schnelles Doppel-Antippen. Dazu: das inline editierbare Team-Spitzname-Feld löste auf iOS ungewollten Auto-Zoom aus (Schriftgröße war unter 16px), fehlgeschlagenes Speichern (z.B. voller Speicherplatz) blieb bisher komplett unbemerkt - zeigt jetzt einmal pro Sitzung eine Warnung, dazu zwei kleinere Absicherungen (Undo-Zustand, Service-Worker-Cache-Write).</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.13</span><span class="tag tag-feat">Feature</span></div>
      <h3>Strahlender Diamant / Leuchtende Perle (BDSP) - Gen-4-Remake</h3>
      <p>22. Edition, vierter Schritt Richtung v2.0 (volle Gen 1-9-Abdeckung) - nach den Editionen selbst folgt jetzt das erste reguläre Remake in der Gen-8-Bucket, direkt vor Paldea. Wie bei HG/SS (Gen4-Remake von Gold/Silber) richtet sich generation:8 nach dem Erscheinungsjahr der Edition selbst, nicht dem Original. Laut Recherche sind Arenaleiter-, Team-Galaktik- und Top-Vier-Level bei BDSP identisch zum Original Diamant/Perl (nicht zu Platins angehobenen Leveln) - die komplette Boss-Reihenfolge und alle Level wurden deshalb unverändert übernommen. Strahlender Diamant und Leuchtende Perle unterscheiden sich laut Recherche ausschließlich in versionsexklusiven Fangarten (nicht getrackt), keine unterschiedlichen Boss-Identitäten wie bei Rubin/Saphir oder Schwert/Schild - deshalb wie das bestehende Diamant/Perl EINE gemeinsame Edition statt einer Aufteilung. Trotzdem 18 komplett neue Trainer-Sprites (statt der alten Pixel-Sprites), passend zur tatsächlichen 3D-Chibi-Optik von BDSP, direkt im aktuellen 160&times;160-WebP-Standard. Dazu zwei neue Standorte: die stark erweiterten Untergrundhöhlen und der Hamanasu-Park (Ersatz für den Park der Freunde, ältere Legendäre fangbar). Keine neuen Pokémon-Arten nötig - BDSP bringt keine neuen Dex-Einträge mit.</p>
    </div>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.12</span><span class="tag tag-feat">Feature</span></div>
      <h3>Galar-Formen als fangbare Arten</h3>
      <p>Direkter Folgeschritt zu v1.9.11, wie dort angekündigt - analog zu den Alola-Regionalformen (v1.9.8) jetzt auch die 16 Galar-Formen als eigenständige, vollwertig auswählbare Arten ergänzt: Galar-Mauzi, Galar-Ponita, Galar-Gallopa, Galar-Flegmon, Galar-Lahmus, Galar-Porenta, Galar-Smogmog, Galar-Pantimos, Galar-Traunfugil, Galar-Corasonn, Galar-Zigzachs, Galar-Geradaks, Galar-Flampion und Galar-Flampivian, dazu Galar-Makabaja und Galar-Flunschlik. Jede mit eigenen Typen, Sprite (direkt im aktuellen 160&times;160-WebP-Standard) und Pokédex-Link. Sechs davon setzen Entwicklungsketten fort, die schon mit Galar selbst angelegt, aber mangels vorhandener Galar-Form-Elternart noch nicht aktiv waren: Galar-Geradaks→Barrikadax, Galar-Mauzi→Mauzinger, Galar-Porenta→Lauchzelot, Galar-Pantimos→Pantifrost, Galar-Corasonn→Gorgasonn, Galar-Makabaja→Oghnatoll. Wiederverwendet dabei vollständig die generische Regionalformen-Architektur aus der Alola-Umsetzung (REGIONAL_BASE_DEX/REGIONAL_FORM_SLUG) - keine Code-Änderungen nötig, reine Datenergänzung.</p>

    <div class="entry">
      <div class="entry-head"><span class="ver">v1.9.11</span><span class="tag tag-feat">Feature</span></div>
      <h3>Galar: Schwert/Schild - erste Generation-8-Region</h3>
      <p>20./21. Edition, dritter Schritt Richtung v2.0 (volle Gen 1-9-Abdeckung) nach Omega Rubin/Alpha Saphir und Alola. Schwert und Schild bleiben ein gemeinsamer Eintrag (wie Rubin/Saphir oder Schwarz/Weiß): acht Arenen statt der bisherigen Kanto-Arenaleiter-Terminologie, davon zwei versionsexklusiv getauscht (Saida/Kampf in Schwert vs. Nio/Geist in Schild an Passbeck, Mac/Gestein in Schwert vs. Mel/Eis in Schild an Circhester) - alle mit den tatsächlich in der deutschen Lokalisierung verwendeten Namen (u.&nbsp;a. Milo→Yarro, Nessa→Kate, Leon→Delion, Marnie→Mary, Bede→Betys, Oleana→Olivia), die teils deutlich vom Englischen abweichen. Rivale Hop begleitet über mehrere Kämpfe verteilt bis ins Postgame, dazu Betys/Bede als eigenständiger Herausforderer, das Champion-Cup-Halbfinale/-Finale in Score City sowie die "Verdunkelter Tag"-Krise mit Olivia und Liga-Präsident Rose vor dem Championkampf gegen Delion. Alle 81 neuen Galar-Arten ergänzt (Dex #810-890, inkl. Zacian, Zamazenta und Eternatus), dazu 16 neue Trainer-Sprites. Anders als bei Alola diesmal von Anfang an im aktuellen Sprite-Qualitätsstandard (160&times;160 WebP statt 80&times;80 PNG) eingebettet - keine Nachschärf-Runde nötig. Galar-Formen (Zigzachs/Geradaks, Mauzi/Snobilikat usw.) folgen als eigener Folgeschritt, analog zu den Alola-Regionalformen.</p>
    </div>

      <h3>Trainer-Sprites ab Generation 6 ebenfalls geschärft</h3>
      <p>Direkter Folgeschritt zu v1.9.9: dieselbe Aufbereitung (160x160px statt 80x80px, WebP statt PNG) jetzt auch für die 61 Trainer-Sprites, für die hochauflösende Originale noch lokal vorlagen - Kalos (Arenaleiter, Team Flare, Top Vier, Diantha), Omega Rubin/Alpha Saphir, Alola (Inselprüfungen, Team Skull, Aether Foundation) sowie die Rainbow-Rocket-Bosse. Die übrigen Trainer-Sprites (Kanto, Johto, Hoenn-Original/Smaragd, Sinnoh, Schwarz/Weiß, Schwarz2/Weiß2) stammen aus früheren, einzelnen Recherche-Sitzungen ohne noch vorhandenes hochauflösendes Original und bleiben deshalb bewusst unverändert bei 80x80-PNG, statt sie in schlechterer Qualität neu zu beschaffen.</p>
