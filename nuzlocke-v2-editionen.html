/* Erzeugt die :root[data-edition="..."]-Farbregeln aus GAMES[...].theme statt sie pro Edition von
   Hand als CSS zu pflegen - eine neue Edition braucht dafür nur ein theme-Objekt, keine neue CSS-
   Regel. --gold/--gold-soft spiegeln bei Editions-Themes immer --accent/--accent-soft (bisher bei
   allen Editionen so), --gold-glow fehlte vorher im expliziten [data-theme="dark"]-Override - hier
   jetzt konsistent für alle drei Blöcke gesetzt. */
function injectEditionThemeCSS(){
  const rules = t => `--accent:${t.accent}; --accent-soft:${t.accentSoft}; --accent-shine:${t.accentShine}; --accent-deep:${t.accentDeep}; --gold:${t.accent}; --gold-soft:${t.accentSoft}; --gold-glow: ${t.glow};`;
  let css = "";
  Object.values(GAMES).forEach(g=>{
    if(!g.theme) return;
    /* :root[data-edition="x"] (2 Selektoren) hat dieselbe Spezifität wie die App-eigene
       Basisregel :root[data-theme="light"] (auch 2 Selektoren) - bei Spezifitäts-Gleichstand
       entscheidet die Reihenfolge im Dokument, und die kann je nach Hosting-Umgebung (z.B. wenn
       der Artifact-Viewer den veröffentlichten Inhalt in eine eigene Kopf-Struktur einbettet)
       variieren. Deshalb hier zusätzlich explizit [data-theme="light"] mit anhängen (3 Selektoren,
       wie beim ohnehin schon vorhandenen [data-theme="dark"]-Fall weiter unten) - gewinnt dann
       unabhängig von der Dokumentreihenfolge rein über Spezifität. */
    css += `:root[data-edition="${g.id}"]{ ${rules(g.theme.light)} }\n`;
    css += `:root[data-edition="${g.id}"][data-theme="light"]{ ${rules(g.theme.light)} }\n`;
    css += `@media (prefers-color-scheme: dark){ :root[data-edition="${g.id}"]:not([data-theme="light"]){ ${rules(g.theme.dark)} } }\n`;
    css += `:root[data-edition="${g.id}"][data-theme="dark"]{ ${rules(g.theme.dark)} }\n`;
  });
  const styleEl = document.createElement("style");
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
}

const MONO_LIGHT_IMG = "linear-gradient(155deg, #3a3a3a 0%, #000 80%)";

/* Dieselben Werkstoff-Rezepte auch für die Editionswahl-Karten (.sheet-option in
   openNewSaveSheet()) - anders als .btn-primary zeigen die aber ALLE 22 Editionen gleichzeitig,
   unabhängig von der gerade aktiven Edition. Die [data-edition="x"]-Selektor-Kaskade von oben
   (reagiert auf die AKTIVE Edition am <html>-Element) passt hier also nicht - stattdessen generische,
   editionsunabhängige Utility-Klassen (.mat-bg-* bzw. .mat-shape-*), denen editionMaterialAttrs() pro
   Karte die passenden --accent/--accent-shine/--accent-deep/--gold-glow-Werte inline mitgibt. */
/* Alle Regeln hier als .sheet-option.mat-bg-x (Verbund-Selektor, zwei Klassen) statt bloß .mat-bg-x
   (eine Klasse) - .mat-bg-x allein hätte dieselbe Spezifität wie die Basisregel .sheet-option weiter
   oben (je 0-1-0) und wäre dadurch von der Dokumentreihenfolge abhängig. Bei einer Veröffentlichung
   als eigenständiges Artefakt landet der App-eigene <style>-Block wegen der doppelten <head>/<html>-
   Verschachtelung dort nachweislich HINTER statt VOR diesem hier zur Laufzeit injizierten Block (der
   Browser parst die zweite, verschachtelte <head>-Öffnung als Fehler und hängt ihren Inhalt an <body>
   statt an <head> - <body> steht im Dokumentbaum immer NACH <head>) - die Basisregel würde dann bei
   gleicher Spezifität gewinnen und die Karten blieben ungefärbt. Der Verbund-Selektor (0-2-0) gewinnt
   dagegen unabhängig von der Reihenfolge - robuster und deshalb auch hier statt der einfacheren
   Einzelklasse verwendet, obwohl .btn-primary (immer schon [data-edition]-Verbundselektoren, ebenfalls
   0-2-0) von diesem Problem nie betroffen war. */
function injectMaterialUtilityClasses(){
  let css = "";
  Object.keys(MATERIAL_BG).forEach(key=>{
    css += `.sheet-option.mat-bg-${key}{ background-image:${MATERIAL_BG[key]}; color:#fff; }\n`;
  });
  Object.keys(MATERIAL_SHAPE).forEach(key=>{
    css += `.sheet-option.mat-shape-${key}{ ${MATERIAL_SHAPE[key]} }\n`;
  });
  css += `.sheet-option.mat-bg-sun{ background-image:${SUN_IMG}; color:#fff; }\n`;
  css += `.sheet-option.mat-bg-moon{ background-image:${MOON_IMG}; color:#fff; }\n`;
  css += `.sheet-option.mat-bg-mono-light{ background-image:${MONO_LIGHT_IMG}; color:#fff; }\n`;
  css += `.sheet-option.mat-bg-mono-dark{ background-image:${MONO_DARK_IMG}; color:#141414; }\n`;
  css += `.sheet-option.mat-bg-mono-light.crack{ background-image:${CRACK_LIGHT_IMG}${MONO_LIGHT_IMG}; }\n`;
  css += `.sheet-option.mat-bg-mono-dark.crack{ background-image:${CRACK_DARK_IMG}${MONO_DARK_IMG}; }\n`;
  css += `.sheet-option.mat-fx-lacquer{ box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 2px rgba(0,0,0,.15), inset 0 0 0 1.5px rgba(230,190,110,.55); }\n`;
  css += `.sheet-option.mat-fx-aura{ box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 2px rgba(0,0,0,.15), 0 0 10px 1px rgba(var(--gold-glow),.5); }\n`;
  css += `.sheet-option.mat-fx-patina{ filter:saturate(.85) brightness(.97); }\n`;
  const styleEl = document.createElement("style");
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
}
injectMaterialUtilityClasses();

/* Liefert Klassenliste + Inline-Style (--accent/--accent-shine/--accent-deep/--gold-glow) für eine
   einzelne Editionswahl-Karte im gewünschten Hell/Dunkel-Modus. HG/SS hat kein eigenes theme-Objekt
   (nutzt im echten Spielbetrieb ohnehin nur die App-Standardfarbe) - deshalb hier derselbe Fallback-
   Akzent wie die App-Basis-:root-Regel weiter oben im <style>-Block (kein neuer/erfundener Wert). */
const EDITION_DEFAULT_THEME = {
  light:{ accent:"#64738A", accentShine:"#F5F7FA", accentDeep:"#48536A", glow:"169,118,46" },
  dark:{ accent:"#DDB05F", accentShine:"#F6D998", accentDeep:"#8C6B2E", glow:"221,176,95" }
};
function editionMaterialAttrs(g, mode){
  const t = (g.theme ? g.theme[mode] : null) || EDITION_DEFAULT_THEME[mode];
  const style = `--accent:${t.accent}; --accent-shine:${t.accentShine}; --accent-deep:${t.accentDeep}; --gold-glow:${t.glow};`;
  const m = g.material;
  if(!m) return { cls:"", style };
  let cls;
  if(m.bg === "dual-dp") cls = mode==="light" ? "mat-bg-pearl mat-shape-perl" : "mat-bg-facet mat-shape-diamant";
  else if(m.bg === "dual-sm") cls = mode==="light" ? "mat-bg-sun mat-shape-perl" : "mat-bg-moon mat-shape-perl";
  else if(m.bg.indexOf("mono") === 0){
    const crack = m.bg === "mono-craquele" ? " crack" : "";
    cls = (mode==="light" ? "mat-bg-mono-light" : "mat-bg-mono-dark") + crack + " mat-shape-mono";
  } else {
    cls = `mat-bg-${m.bg} mat-shape-${m.shape}`;
    if(m.bg === "lacquer") cls += " mat-fx-lacquer";
    if(m.bg === "facet-aura") cls += " mat-fx-aura";
    if(m.bg === "plastic-patina") cls += " mat-fx-patina";
  }
  return { cls, style };
}

/* Geschlechtsabhängiger Rivale (z.B. Kalos: Calem/Serena - der Rivale ist automatisch die
   jeweils andere Figur, gleicher Kampfverlauf, nur Name/Sprite wechseln). Boss-Einträge nutzen
   dafür statt fixem name/sprite optionale nameByGender/spriteByGender-Objekte; hier zentral in
   currentGame() aufgelöst (statt an jeder einzelnen currentGame().bosses-Stelle im Code), damit
   jede bestehende Nutzung von boss.name/boss.sprite unverändert weiterfunktioniert. */
function resolveBossGender(boss){
  if(!boss.nameByGender && !boss.spriteByGender) return boss;
  /* nameByGender/spriteByGender sind nach der EIGENEN Identität des jeweiligen Charakters benannt
     (male:"Kalem", female:"Serena") - der Rivale ist aber immer die JEWEILS ANDERE Figur als die
     eigene Spielfigur, deshalb hier bewusst mit der Gegen-Gender aufgelöst. */
  const own = state.playerGender || "female";
  const rivalGender = own==="male" ? "female" : "male";
  const resolved = { ...boss };
  if(boss.nameByGender) resolved.name = boss.nameByGender[rivalGender] || boss.nameByGender.female;
  if(boss.spriteByGender) resolved.sprite = boss.spriteByGender[rivalGender] || boss.spriteByGender.female;
  return resolved;
}
function currentGame(){
  const game = GAMES[state.edition] || GAMES.hgss;
  if(!game.bosses.some(b=>b.nameByGender || b.spriteByGender)) return game;
  return { ...game, bosses: game.bosses.map(resolveBossGender) };
}
function bossById(id){ return currentGame().bosses.find(b=>b.id===id); }

/* Manche Bosse (aktuell nur das Orion-City-Geschwister-Trio in Schwarz/Weiß) gibt es nur EINEN von
   mehreren möglichen - welcher tatsächlich antritt, hängt vom gewählten Starter ab (siehe
   requiresStarter bei EINALL_BW_BOSSES). Ist der Starter noch nicht gewählt (starterChoice ist
   null), wird bewusst NICHT gefiltert - lieber vorübergehend alle Möglichkeiten zeigen, als
   fälschlich den einzig relevanten Bosskampf zu verstecken. */
function bossRequiresOtherStarter(boss, starterChoice){
  return !!(boss.requiresStarter && starterChoice && boss.requiresStarter !== starterChoice);
}

function spriteFor(speciesName){
  if(!speciesName) return null;
  const dex = SPECIES_LOOKUP.get(String(speciesName).trim().toLowerCase());
  if(!dex) return null;
  /* Arten ab Dex #650 (Kalos+) und Mega-Entwicklungen hatten nie einen alten Pixel-Sprite -
     SPRITES[dex] existiert fuer sie schlicht nicht, deshalb auch in Gen1-5-Editionen auf
     SPRITES_MODERN zurueckfallen (kann z.B. bei einem Randomizer-Fang vorkommen, der laut
     SPECIES_LOOKUP gueltig, aber juenger als die Edition selbst ist). */
  if(currentGame().generation>=6) return SPRITES_MODERN[dex] || null;
  return SPRITES[dex] || SPRITES_MODERN[dex] || null;
}
/* true nur, wenn spriteFor() gerade tatsaechlich den alten, echten Pixel-Sprite liefert (nicht
   den modernen Fallback fuer Kalos+/Mega-Arten in einer Gen1-5-Edition) - steuert, ob das harte
   Nearest-Neighbor-Scaling (Klasse "sprite-legacy") angewendet wird, siehe CSS-Kommentar bei
   .mon-sprite. */
function isLegacyPixelSprite(speciesName){
  if(!speciesName) return false;
  const dex = SPECIES_LOOKUP.get(String(speciesName).trim().toLowerCase());
  if(!dex) return false;
  return currentGame().generation<6 && !!SPRITES[dex];
}
/* Gemeinsamer Baustein fuer die kleinen 70x70-Sprite-Vorschauen (Fangen-Formular, Bosskampf-
   Gegnerteam, finales Duell-Team) - vermeidet, dieselbe src/Klassen-Logik an mehreren Stellen zu
   duplizieren. */
function previewImgHtml(speciesName){
  const src = spriteFor(speciesName);
  if(!src) return `<span>?</span>`;
  const cls = isLegacyPixelSprite(speciesName) ? ' class="sprite-legacy"' : "";
  return `<img${cls} src="${src}" width="70" height="70" alt="" />`;
}

/* Rückwirkende Fee-Typisierung ab Generation 6 (siehe Kommentar bei SPECIES_TYPES): dieselbe Art
   hat je nach Edition unterschiedliche Typen - in Gen1-5-Editionen bleibt SPECIES_TYPES exakt wie
   damals im Spiel, ab Gen6-Editionen überschreibt diese schlanke, nur die betroffenen ~20 Arten
   enthaltende Map (Dex-Nr. -> neuer Typ-String) gezielt den Basiswert, statt die 649er-Tabelle zu
   duplizieren. Quelle/Auswahl gegen Bulbapedia "Fairy (type)"-Retcon-Liste geprüft. */
const POST_FAIRY_TYPES = {
  35:"Fee", 36:"Fee", 39:"Normal/Fee", 40:"Normal/Fee", 122:"Psycho/Fee",
  174:"Normal/Fee", 175:"Fee", 176:"Fee/Flug", 183:"Wasser/Fee", 184:"Wasser/Fee",
  209:"Fee", 210:"Fee", 280:"Psycho/Fee", 281:"Psycho/Fee", 282:"Psycho/Fee",
  298:"Normal/Fee", 303:"Stahl/Fee", 439:"Psycho/Fee", 468:"Fee/Flug",
  546:"Pflanze/Fee", 547:"Pflanze/Fee"
};

function typesFor(speciesName){
  if(!speciesName) return [];
  const dex = SPECIES_LOOKUP.get(String(speciesName).trim().toLowerCase());
  if(!dex || !SPECIES_TYPES[dex-1]) return [];
  const raw = (currentGame().generation>=6 && POST_FAIRY_TYPES[dex]) ? POST_FAIRY_TYPES[dex] : SPECIES_TYPES[dex-1];
  return raw.split("/");
}

/* Typ-Effektivität für die Generationen 1-5 (17 Typen, kein Fee) - je Verteidiger-Typ, welche
   Angriffstypen 2x/0,5x/0x treffen. Stahl behält hier bewusst seine damalige Resistenz gegen
   Geist UND Unlicht (siehe SPECIES_TYPES-Kommentar), die erst mit Einführung von Fee in
   Generation 6 entfernt wurde - für die hier abgedeckten Editionen ist das der korrekte Stand. */
const TYPE_DEFENSE_PRE6 = {
  Normal:   { weak:["Kampf"], resist:[], immune:["Geist"] },
  Feuer:    { weak:["Wasser","Boden","Gestein"], resist:["Feuer","Pflanze","Eis","Käfer","Stahl"], immune:[] },
  Wasser:   { weak:["Elektro","Pflanze"], resist:["Feuer","Wasser","Eis","Stahl"], immune:[] },
  Elektro:  { weak:["Boden"], resist:["Elektro","Flug","Stahl"], immune:[] },
  Pflanze:  { weak:["Feuer","Eis","Gift","Flug","Käfer"], resist:["Wasser","Elektro","Pflanze","Boden"], immune:[] },
  Eis:      { weak:["Feuer","Kampf","Gestein","Stahl"], resist:["Eis"], immune:[] },
  Kampf:    { weak:["Flug","Psycho"], resist:["Käfer","Gestein","Unlicht"], immune:[] },
  Gift:     { weak:["Boden","Psycho"], resist:["Pflanze","Kampf","Gift","Käfer"], immune:[] },
  Boden:    { weak:["Wasser","Pflanze","Eis"], resist:["Gift","Gestein"], immune:["Elektro"] },
  Flug:     { weak:["Elektro","Eis","Gestein"], resist:["Pflanze","Kampf","Käfer"], immune:["Boden"] },
  Psycho:   { weak:["Käfer","Geist","Unlicht"], resist:["Kampf","Psycho"], immune:[] },
  Käfer:    { weak:["Feuer","Flug","Gestein"], resist:["Pflanze","Kampf","Boden"], immune:[] },
  Gestein:  { weak:["Wasser","Pflanze","Kampf","Boden","Stahl"], resist:["Normal","Feuer","Gift","Flug"], immune:[] },
  Geist:    { weak:["Geist","Unlicht"], resist:["Gift","Käfer"], immune:["Normal","Kampf"] },
  Drache:   { weak:["Eis","Drache"], resist:["Feuer","Wasser","Elektro","Pflanze"], immune:[] },
  Unlicht:  { weak:["Kampf","Käfer"], resist:["Geist","Unlicht"], immune:["Psycho"] },
  Stahl:    { weak:["Feuer","Kampf","Boden"], resist:["Normal","Pflanze","Eis","Flug","Psycho","Käfer","Gestein","Drache","Stahl","Geist","Unlicht"], immune:["Gift"] }
};
/* Typ-Effektivität ab Generation 6: identisch zu TYPE_DEFENSE_PRE6, plus der neue Fee-Typ und die
   damit verbundenen Änderungen an bestehenden Typen (Kampf/Drache/Unlicht neu schwach gegen Fee,
   Stahl neu resistent gegen Fee, Stahl verliert dafür seine alte Resistenz gegen Geist/Unlicht). */
const TYPE_DEFENSE_POST6 = {
  ...TYPE_DEFENSE_PRE6,
  Kampf:   { weak:["Flug","Psycho","Fee"], resist:["Käfer","Gestein","Unlicht"], immune:[] },
  Gift:    { weak:["Boden","Psycho"], resist:["Pflanze","Kampf","Gift","Käfer","Fee"], immune:[] },
  Feuer:   { weak:["Wasser","Boden","Gestein"], resist:["Feuer","Pflanze","Eis","Käfer","Stahl","Fee"], immune:[] },
  Drache:  { weak:["Eis","Drache","Fee"], resist:["Feuer","Wasser","Elektro","Pflanze"], immune:[] },
  Unlicht: { weak:["Kampf","Käfer","Fee"], resist:["Geist","Unlicht"], immune:["Psycho"] },
  Stahl:   { weak:["Feuer","Kampf","Boden"], resist:["Normal","Pflanze","Eis","Flug","Psycho","Käfer","Gestein","Drache","Stahl","Fee"], immune:["Gift"] },
  Fee:     { weak:["Gift","Stahl"], resist:["Kampf","Käfer","Unlicht"], immune:["Drache"] }
};
function currentTypeDefense(){ return currentGame().generation>=6 ? TYPE_DEFENSE_POST6 : TYPE_DEFENSE_PRE6; }
function currentAllTypes(){ return Object.keys(currentTypeDefense()); }
const ALL_TYPES = Object.keys(TYPE_DEFENSE_PRE6);
const TYPE_COLORS = {
  Normal:"#A8A878", Feuer:"#F08030", Wasser:"#6890F0", Elektro:"#F8D030", Pflanze:"#78C850",
  Eis:"#98D8D8", Kampf:"#C03028", Gift:"#A040A0", Boden:"#E0C068", Flug:"#A890F0",
  Psycho:"#F85888", Käfer:"#A8B820", Gestein:"#B8A038", Geist:"#705898", Drache:"#7038F8",
  Unlicht:"#705848", Stahl:"#B8B8D0", Fee:"#EE99AC"
};

function hexToRgba(hex, alpha){
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* EXPERIMENTELL: Team-Kachel je nach Typ(en) einfärben (z.B. Pikachu gelb-elektrisch, Glurak
   Feuer/Flug-Verlauf) - probeweise, ob das eher cool oder überladen wirkt. Bewusst nur ein
   dezenter Verlauf im Hintergrund + eingefärbter Rand, damit Sprite/Text weiter lesbar bleiben. */
function typeGradientStyle(types){
  if(!types || !types.length) return "";
  const colors = types.map(t=>TYPE_COLORS[t]).filter(Boolean);
  if(!colors.length) return "";
  if(colors.length===1){
    return `background:linear-gradient(160deg, ${hexToRgba(colors[0],0.38)}, ${hexToRgba(colors[0],0.08)} 65%, var(--surface) 100%); border-color:${colors[0]};`;
  }
  /* Klare zwei Zonen statt eines durchgehenden Verlaufs, der bei Dual-Typen sonst zu einem
     matschigen Mischton in der Mitte verläuft - so bleibt jeder Typ als eigener Farbblock
     erkennbar, nur ein schmaler Übergang dazwischen. */
  return `background:linear-gradient(135deg, ${hexToRgba(colors[0],0.5)} 0%, ${hexToRgba(colors[0],0.5)} 42%, ${hexToRgba(colors[1],0.5)} 58%, ${hexToRgba(colors[1],0.5)} 100%); border-color:${colors[0]};`;
}

function typeMultiplier(attackType, defendTypes){
  const defense = currentTypeDefense();
  let mult = 1;
  defendTypes.forEach(dt=>{
    const info = defense[dt];
    if(!info) return;
    if(info.immune.includes(attackType)) mult *= 0;
    else if(info.weak.includes(attackType)) mult *= 2;
    else if(info.resist.includes(attackType)) mult *= 0.5;
  });
  return mult;
}

function typeChipHtml(type, muted){
  const color = TYPE_COLORS[type] || "#999";
  const style = muted
    ? `background:var(--surface-alt); color:var(--ink-soft);`
    : `background:${color}; color:#fff;`;

/* Typabdeckungs-Analyse: offensiv wird die eigene Art als STAB-Näherung verwendet, da die App
   keine echten Attacken pro Pokémon erfasst (nur Fangort/Status/Team) - eine bewusste, im
   Backlog so vermerkte Vereinfachung statt eines vollen Moveset-Trackers. Defensiv ist die
   Berechnung exakt (Dual-Typ-Multiplikation über TYPE_DEFENSE). */
function teamTypeAnalysis(){
  const allTypes = currentAllTypes();
  const defense = currentTypeDefense();
  const members = orderedTeamLocs().map(l=>({ label: l.mon.nickname||l.mon.species, species: l.mon.species, types: typesFor(l.mon.species) }));
  const known = members.filter(m=>m.types.length);
  const covered = new Set();
  known.forEach(m=>{
    m.types.forEach(attackType=>{
      allTypes.forEach(defendType=>{
        if(defense[defendType].weak.includes(attackType)) covered.add(defendType);
      });
    });
  });
  const gaps = allTypes.filter(t=>!covered.has(t));
  const weaknesses = allTypes.map(attackType=>{
    const weakMembers = known.filter(m=>typeMultiplier(attackType, m.types) >= 2);
    return { type: attackType, count: weakMembers.length, names: weakMembers.map(m=>m.label) };
  }).filter(w=>w.count>=2).sort((a,b)=>b.count-a.count);
  return { members, known, covered, gaps, weaknesses };
}

function openTypeCoverageSheet(){
  const a = teamTypeAnalysis();
  if(!a.members.length){
    openSheet(`
      <h3>Typabdeckung</h3>
      <div class="loc-sub" style="margin-bottom:14px;">Noch kein Team zusammengestellt.</div>
      <div class="sheet-footer"><button class="btn btn-primary btn-block" data-act="close-sheet">Schließen</button></div>
    `);
    return;
  }
  const unknownCount = a.members.length - a.known.length;
  const coverageGrid = currentAllTypes().map(t=>typeChipHtml(t, !a.covered.has(t))).join(" ");
  const weaknessRows = a.weaknesses.length
    ? a.weaknesses.map(w=>`<div class="type-weak-row">${typeChipHtml(w.type, false)} <span class="loc-sub">${w.count} schwach - ${escapeHtml(w.names.join(", "))}</span></div>`).join("")
    : `<div class="loc-sub">Keine geteilten Schwächen im Team.</div>`;
  openSheet(`
    <h3>Typabdeckung</h3>
    <div class="loc-sub" style="margin-bottom:14px;">Näherung über die eigenen Typen der Team-Pokémon (kein Moveset-Tracking) - Team: ${escapeHtml(a.members.map(m=>m.label).join(", "))}.${unknownCount ? ` ${unknownCount} Art${unknownCount===1?"":"en"} ohne bekannte Typdaten wurde${unknownCount===1?"":"n"} ausgelassen.` : ""}</div>
    <div class="loc-sub" style="font-weight:700; margin-bottom:8px;">Offensive Abdeckung</div>
    <div class="type-chip-grid">${coverageGrid}</div>
    <div class="loc-sub" style="margin-top:10px;">${a.gaps.length ? `Keine Abdeckung gegen: ${escapeHtml(a.gaps.join(", "))}.` : "Alle Typen offensiv abgedeckt."}</div>
    <div class="loc-sub" style="font-weight:700; margin:16px 0 8px;">Gemeinsame Schwächen</div>
    ${weaknessRows}
    <div class="sheet-footer" style="margin-top:16px;">
      <button class="btn btn-primary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

/* Sanftes Fade-in statt hartem Pop-in, aber NUR beim allerersten Rendern eines bestimmten
   Sprites in dieser Sitzung - ein Set merkt sich bereits gesehene src-Werte. Ohne diesen Cache
   würde jedes erneute render() (z.B. nach jedem Fang/jeder Aktion im Team-Tab) dieselben, längst
   sichtbaren Sprites erneut kurz ausblenden und wieder einblenden lassen, was mehr flackert als
   der ursprüngliche harte Pop-in. */
const loadedSpriteSrcs = new Set();
function markSpriteLoaded(src){ loadedSpriteSrcs.add(src); }
function spriteImgHtml(speciesName, size, flash){
  size = size || 64;
  const src = spriteFor(speciesName);
  if(!src) return `<div class="mon-sprite-placeholder" style="width:${size}px;height:${size}px;">?</div>`;
  const legacyCls = isLegacyPixelSprite(speciesName) ? " sprite-legacy" : "";
  const baseCls = (flash ? "mon-sprite evolve-flash" : "mon-sprite") + legacyCls;
  if(loadedSpriteSrcs.has(src)) return `<img class="${baseCls}" src="${src}" width="${size}" height="${size}" alt="" />`;
  return `<img class="${baseCls} sprite-fade" src="${src}" width="${size}" height="${size}" alt="" onload="this.classList.add('loaded'); markSpriteLoaded(this.src)" onerror="this.classList.add('loaded')" />`;
}

function speciesMatches(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const starts = [], contains = [];
  SPECIES.forEach(s=>{
    const low = s.toLowerCase();
    if(low.startsWith(q)) starts.push(s);
    else if(low.includes(q)) contains.push(s);
  });
  return starts.concat(contains).slice(0,40);
}

function wireSpeciesPicker(inputId, resultsId, onSelect){
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  if(!input || !results) return;
  const renderResults = ()=>{
    const matches = speciesMatches(input.value);
    if(!matches.length){ results.classList.remove("open"); results.innerHTML=""; return; }
    results.innerHTML = matches.map(s=>{
      const src = spriteFor(s);
      const cls = isLegacyPixelSprite(s) ? ' class="sprite-legacy"' : "";
      return `<button type="button" class="species-result" data-species="${escapeHtml(s)}">${src?`<img${cls} src="${src}" alt="" />`:""}<span>${escapeHtml(s)}</span></button>`;
    }).join("");
    results.classList.add("open");
  };
  input.addEventListener("input", renderResults);
  input.addEventListener("focus", renderResults);
  input.addEventListener("blur", ()=>{ setTimeout(()=>{ results.classList.remove("open"); }, 150); });
  results.addEventListener("mousedown", e=>{
    const btn = e.target.closest(".species-result");
    if(!btn) return;
    e.preventDefault();
    const species = btn.dataset.species;
    input.value = species;
    results.classList.remove("open"); results.innerHTML="";
    onSelect(species);
  });
}

/* Region gilt als abgeschlossen, wenn jeder fangbare (nicht noCatch) Standort dort einen Fangversuch
   hat - Bosse zählen bewusst nicht mit rein, das Ausblenden bezieht sich nur auf die Routen-Liste. */
function isRegionFullyCaught(region){
  const locs = state.locations.filter(l=>l.region===region && !l.noCatch);
  return locs.length>0 && locs.every(l=>l.status!=="pending");
}

/* Proaktiver Hinweis, sobald eine Region durch die gerade eingetragene Aktion GERADE JETZT komplett
   wurde (nicht bei jedem erneuten Render) - nutzt die bereits bestehende Regionen-ausblenden-Funktion
   aus den Einstellungen. Nur bei mehrreigigen Editionen sinnvoll und nur, wenn nicht schon versteckt. */
function maybeOfferHideRegion(region){
  if(currentGame().regions.length <= 1) return;
  if((state.hiddenRegions||[]).includes(region)) return;
  if(!isRegionFullyCaught(region)) return;
  openSheet(`
    <h3>Region abgeschlossen</h3>
    <div class="loc-sub" style="margin-bottom:14px;">„${escapeHtml(region)}" ist jetzt komplett abgeschlossen. Aus der Routen-Liste ausblenden, um sie übersichtlicher zu halten? Der Fortschritt bleibt erhalten, jederzeit über Einstellungen → Regionen wieder einblendbar.</div>
    <div class="sheet-footer">
      <button class="btn btn-secondary btn-block" data-act="close-sheet">Sichtbar lassen</button>
      <button class="btn btn-primary btn-block" data-act="toggle-region-visibility" data-id="${escapeHtml(region)}">Ausblenden</button>
    </div>
  `);
}

function performCatch(id, species, nick){
  const loc = findLoc(id);
  const wasComplete = isRegionFullyCaught(loc.region);
  loc.status="caught";
  /* Wie im Original: ist im Team noch Platz, tritt ein frisch gefangenes Pokémon automatisch bei,
     statt erst in der Box zu landen. */
  const joinsTeam = teamCount()<6;
  loc.mon={ species, nickname:nick, inTeam:joinsTeam, dead:false, caughtAt:Date.now() };
  logEvent("catch", `${nick ? `${nick} (${species})` : species} auf ${loc.name} gefangen`);
  if(joinsTeam) logEvent("team", `${nick || species} kam ins Team`);
  vibrateFeedback(35);
  saveState(); render();
  /* Team ist beim Fangen bereits voll - statt den Fang stillschweigend in der Box zu versenken,
     direkt fragen: ins Team (dann Ersatz wählen wie beim manuellen "Ins Team aufnehmen") oder
     bewusst auf die Bank. Der Region-Hinweis hat hier Vorrang, falls beides zuträfe - "Team voll"
     ist die seltenere, dringendere Entscheidung. */
  if(!joinsTeam) openCatchTeamFullSheet(id);
  else if(!wasComplete && isRegionFullyCaught(loc.region)) maybeOfferHideRegion(loc.region);

/* Global gilt für alle Spielstände (unabhängig vom pro-Save-Feld state.runTitle) - dient als
   Fallback im Header, wenn der jeweilige Spielstand keinen eigenen Titel gesetzt hat. Muss vor
   bootstrapActiveSave() initialisiert sein, da createSave()/writeSave() beim allerersten Start
   bereits effectiveRunTitle() aufrufen. */
let globalUsername = "";
try{ globalUsername = localStorage.getItem(USERNAME_KEY) || ""; }catch(e){}
function setGlobalUsername(v){
  globalUsername = (v||"").trim();
  try{ if(globalUsername) localStorage.setItem(USERNAME_KEY, globalUsername); else localStorage.removeItem(USERNAME_KEY); }catch(e){}
}
function effectiveRunTitle(t){
  const trimmed = (t||"").trim();
  /* Vor v1.8.57 bekam jeder neue Spielstand automatisch den Literal-Text "Nuzlocke" als eigenen
     Titel gespeichert - bei solchen (weiterhin bestehenden) Altspielständen blockierte dieser
     nie bewusst gewählte Platzhaltertext seither dauerhaft den globalen Anzeigenamen-Fallback
     unten, obwohl der Spielstand eigentlich gar keinen eigenen Titel gesetzt hat. Wird hier wie
     ein leeres Feld behandelt, damit z.B. ein in Cloud-Sync eingetragener Anzeigename ("Andi")
     auch bei solchen Altspielständen tatsächlich im Header ankommt. */
  if(trimmed && trimmed!=="Nuzlocke") return t;
  if(globalUsername) return globalUsername;
  return "Nuzlocke";
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

/* Ein Standort-Eintrag ist entweder ein reiner Name (Standardfall) oder ein Objekt
   {name, note, noCatch} für Orte mit besonderer Fangmethode (Angel, Surfen, Geschenk, …)
   oder ganz ohne wilde Pokémon (noCatch:true). */
function parseLocationEntry(region, entry){
  const name = typeof entry === "string" ? entry : entry.name;
  const note = typeof entry === "string" ? null : (entry.note || null);
  const noCatch = typeof entry === "object" && !!entry.noCatch;
  return {
    id: slug(region+"-"+name),
    name, region, custom:false, note, noCatch,
    status:"pending", // pending | failed | caught
    mon: null // {species, nickname, inTeam, dead}
  };
}

function freshState(editionId, soloMode){
  const edition = GAMES[editionId] ? editionId : "hgss";
  const locations = [];
  GAMES[edition].regions.forEach(([region, names])=>{
    names.forEach(entry=>{ locations.push(parseLocationEntry(region, entry)); });
  });
  const gameStarters = GAMES[edition].starters || { grass:"", fire:"", water:"" };
  return { edition, runTitle:"", soloMode:!!soloMode, locations, bossBoosts:{}, bossDefeated:{}, rivalNickname:"", duelPartnerName:"", dupesWarning:true, lastExportAt:null, evolutionCount:0, lossCount:0, nicknameRequired:false, pvp:{}, hallOfFame:{ rivalTeam:[], playerTeam:[], defeatedAt:null, result:null }, starterNames:{ ...gameStarters }, starterChoice:null, playerGender:null, currentLocId:null, eventLog:[], hiddenRegions:[], achievements:{}, activeTitle:null, dupesIgnoredCount:0, bossLossIds:{}, cleanBossWins:{}, bossNotes:{}, randomizerSeed:"", vibrationEnabled:true, bossWinTeams:{}, hidePostgame:false, trackBossTeams:false, bossOpponentTeams:{}, trackDeathCause:false, colorBlindSafeMode:false, teamOrder:[], syncCode:null, lastSyncedAt:null, keyItemsChecked:{}, houseRules:{ setMode:true, speciesClause:true, noItems:true, levelCap:true }, duoCode:null, soulLinkMode:false, manualCollapsedLocs:[] };
}

/* Ergänzt neu hinzugekommene Standorte (z.B. nachträglich eingefügte Städte) in einen bereits
   laufenden, gespeicherten Run - ohne den Fortschritt an bestehenden Standorten zu verlieren. */
function syncLocations(parsed){
  const game = GAMES[parsed.edition];
  if(!game || !Array.isArray(parsed.locations)) return;
  const byId = new Map(parsed.locations.filter(l=>!l.custom && !l.starter).map(l=>[l.id, l]));
  const rebuilt = [];
  game.regions.forEach(([region, names])=>{
    names.forEach(entry=>{
      const fresh = parseLocationEntry(region, entry);
      const existing = byId.get(fresh.id);
      if(existing){ existing.note = fresh.note; existing.noCatch = fresh.noCatch; rebuilt.push(existing); }
      else rebuilt.push(fresh);
    });
  });
  const extras = parsed.locations.filter(l=>l.custom || l.starter);
  parsed.locations = rebuilt.concat(extras);
}

/* Migration für Bestandsspielstände: Platin-Bosse liefen bis v1.9.34 über buildVersionGames() mit
   ids wie "platin-roark" (Präfix aus der Versions-ID). Seit v1.9.35 hat Platin ein eigenes
   PLATIN_BOSSES-Array mit denselben unpräfixierten ids wie Diamant/Perl/BDSP (siehe Kommentar bei
   PLATIN_LEVEL_ACE_OVERRIDES weiter unten) - ohne diese Migration würden bestehende Platin-
   Spielstände ihren kompletten Bosskampf-Fortschritt (Siege, Notizen, Level-Boosts, ...) verlieren. */
function migrateLegacyPlatinBossIds(parsed){
  if(parsed.edition !== "platin") return;
  const stripPrefix = obj=>{
    if(!obj) return;
    Object.keys(obj).forEach(key=>{
      if(key.startsWith("platin-")){
        const newKey = key.slice("platin-".length);
        if(!(newKey in obj)) obj[newKey] = obj[key];
        delete obj[key];
      }
    });
  };
  [parsed.bossDefeated, parsed.bossBoosts, parsed.bossLossIds, parsed.cleanBossWins, parsed.bossNotes, parsed.bossWinTeams, parsed.bossOpponentTeams].forEach(stripPrefix);
  if(parsed.pvp){
    Object.keys(parsed.pvp).forEach(key=>{
      if(key.startsWith("pvp-platin-")){
        const newKey = "pvp-"+key.slice("pvp-platin-".length);
        if(!(newKey in parsed.pvp)) parsed.pvp[newKey] = parsed.pvp[key];
        delete parsed.pvp[key];
      }
    });
  }
}

function normalizeState(parsed){
  if(typeof parsed.soloMode !== "boolean") parsed.soloMode = false;
  if(!parsed.bossBoosts) parsed.bossBoosts = {};
  if(!parsed.bossDefeated) parsed.bossDefeated = {};
  if(typeof parsed.rivalNickname !== "string") parsed.rivalNickname = "";
  if(typeof parsed.duelPartnerName !== "string") parsed.duelPartnerName = "";
  if(typeof parsed.dupesWarning !== "boolean") parsed.dupesWarning = true;
  if(typeof parsed.lastExportAt !== "number") parsed.lastExportAt = null;
  if(typeof parsed.evolutionCount !== "number") parsed.evolutionCount = 0;
  if(typeof parsed.lossCount !== "number") parsed.lossCount = 0;
  if(typeof parsed.nicknameRequired !== "boolean") parsed.nicknameRequired = false;
  if(!parsed.pvp) parsed.pvp = {};
  if(typeof parsed.edition !== "string" || !GAMES[parsed.edition]) parsed.edition = "hgss";
  if(!parsed.hallOfFame) parsed.hallOfFame = { rivalTeam:[], playerTeam:[], defeatedAt:null, result:null };
  else if(typeof parsed.hallOfFame.result === "undefined") parsed.hallOfFame.result = null;
  if(!parsed.starterNames) parsed.starterNames = { ...(GAMES[parsed.edition].starters || { grass:"", fire:"", water:"" }) };
  if(typeof parsed.starterChoice === "undefined") parsed.starterChoice = null;
  if(typeof parsed.playerGender === "undefined") parsed.playerGender = null;
  if(typeof parsed.currentLocId === "undefined") parsed.currentLocId = null;
  if(!Array.isArray(parsed.eventLog)) parsed.eventLog = [];
  if(!Array.isArray(parsed.hiddenRegions)) parsed.hiddenRegions = [];
  if(!parsed.achievements) parsed.achievements = {};
  if(typeof parsed.activeTitle === "undefined") parsed.activeTitle = null;
  if(typeof parsed.dupesIgnoredCount !== "number") parsed.dupesIgnoredCount = 0;
  if(!parsed.bossLossIds) parsed.bossLossIds = {};
  if(!parsed.cleanBossWins) parsed.cleanBossWins = {};
  if(!parsed.bossNotes) parsed.bossNotes = {};
  if(typeof parsed.randomizerSeed !== "string") parsed.randomizerSeed = "";
  if(typeof parsed.vibrationEnabled !== "boolean") parsed.vibrationEnabled = true;
  if(!parsed.bossWinTeams) parsed.bossWinTeams = {};
  if(typeof parsed.hidePostgame !== "boolean") parsed.hidePostgame = false;
  if(typeof parsed.trackBossTeams !== "boolean") parsed.trackBossTeams = false;
  if(!parsed.bossOpponentTeams) parsed.bossOpponentTeams = {};
  if(typeof parsed.trackDeathCause !== "boolean") parsed.trackDeathCause = false;
  if(typeof parsed.colorBlindSafeMode !== "boolean") parsed.colorBlindSafeMode = false;
  if(!Array.isArray(parsed.teamOrder)) parsed.teamOrder = [];
  if(typeof parsed.syncCode !== "string") parsed.syncCode = null;
  if(typeof parsed.lastSyncedAt !== "number") parsed.lastSyncedAt = null;
  if(!parsed.keyItemsChecked) parsed.keyItemsChecked = {};
  if(!parsed.houseRules) parsed.houseRules = { setMode:true, speciesClause:true, noItems:true, levelCap:true };
  if(typeof parsed.duoCode !== "string") parsed.duoCode = null;
  if(typeof parsed.soulLinkMode !== "boolean") parsed.soulLinkMode = false;
  if(!Array.isArray(parsed.manualCollapsedLocs)) parsed.manualCollapsedLocs = [];
  migrateLegacyPlatinBossIds(parsed);
  syncLocations(parsed);
  return parsed;
}

/* ---------- Mehrere Spielstände ----------
   Bis Version 1.1 gab es genau einen state unter LEGACY_STORAGE_KEY - ein Editionswechsel
   überschrieb ihn komplett (freshState(id)), man konnte den alten Run nur durch vorheriges
   manuelles JSON-Exportieren retten. Jetzt lebt jeder Run als eigener Spielstand unter einem
   eigenen localStorage-Key, dazu ein schlanker Index (Titel/Edition/Zeitstempel, ohne die vollen
   Standort-Daten) für die Spielstände-Übersicht, damit die nicht bei jedem Rendern alle Spielstände
   komplett einlesen muss. Ein Wechsel lädt einfach einen anderen bereits gespeicherten Spielstand,
   statt den aktuellen zu ersetzen - nichts geht mehr verloren, unabhängig vom JSON-Export. */
function saveStorageKey(id){ return "nuzlocke-save-"+id; }
function newSaveId(){ return "save-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadSavesIndex(){
  try{
    const raw = localStorage.getItem(SAVES_INDEX_KEY);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch(e){}
  return [];
}
function persistSavesIndex(index){ try{ localStorage.setItem(SAVES_INDEX_KEY, JSON.stringify(index)); }catch(e){ warnOnSaveFailure(); } }

function loadSaveState(id){
  try{
    const raw = localStorage.getItem(saveStorageKey(id));
    if(raw) return normalizeState(JSON.parse(raw));
  }catch(e){}
  return null;
}

/* Bestenliste über alle Spielstände: bewusst EIGENE, parametrisierte Kennzahlen-Berechnung statt
   Wiederverwendung von completionPercent()/survivalRate()/aliveCount() & co. - die lesen alle
   implizit die globale `state`-Variable, ein Umschalten auf einen fremden Spielstand nur zum
   Berechnen (und zurück) wäre unnötig riskant für den gerade aktiven Spielstand. */
function statsForSave(save){
  const game = GAMES[save.edition];
  const bosses = game ? game.bosses.filter(b=>!(b.final && save.soloMode) && !bossRequiresOtherStarter(b, save.starterChoice)) : [];
  const bossesDone = bosses.filter(b=>!!save.bossDefeated[b.id]).length;
  const catchable = save.locations.filter(l=>!l.noCatch);
  const locsDone = catchable.filter(l=>l.status!=="pending").length;
  const totalItems = catchable.length + bosses.length;
  const completionPct = totalItems ? Math.round((locsDone+bossesDone)/totalItems*100) : 0;
  const relevant = save.locations.filter(l=>l.mon && !l.mon.given);
  const survival = relevant.length ? Math.round(relevant.filter(l=>!l.mon.dead).length/relevant.length*100) : null;
  const firstTs = save.eventLog && save.eventLog.length ? save.eventLog[0].ts : null;
  return {
    title: effectiveRunTitle(save.runTitle),
    editionLabel: game ? game.shortLabel : save.edition,
    completionPct, survival, bossesDone, bossesTotal: bosses.length,
    durationDays: firstTs ? Math.max(0, Math.floor((Date.now()-firstTs)/(1000*60*60*24))) : null
  };
}
/* Für's Archivieren: ein Run gilt als "abgeschlossen", sobald er ein Ergebnis hat - erfolgreich
   (Champion/finales Duell gewonnen, hallOfFame.result==="win") oder gescheitert (kompletter
   Team-Wipe, siehe checkGameOver(), oder ein verlorenes finales Duell ohne Wipe). Ein bereits
   gefeierter Sieg zählt auch dann noch als "erfolgreich", wenn danach im Postgame doch noch alles
   ausstirbt - das Ziel wurde ja schon erreicht, deshalb wird zuerst auf hallOfFame.result==="win"
   geprüft. Laufende Runs ohne Ergebnis liefern null und lassen sich nicht archivieren. */
function saveOutcome(save){
  if(save.hallOfFame && save.hallOfFame.result==="win") return "win";
  const alive = save.locations.filter(l=>l.mon && !l.mon.dead).length;
  const dead = save.locations.filter(l=>l.mon && l.mon.dead).length;
  if(alive+dead>0 && alive===0) return "loss";
  if(save.hallOfFame && save.hallOfFame.result==="loss") return "loss";
  return null;
}
function allSavesStats(){
  return loadSavesIndex().map(meta=>{
    const save = loadSaveState(meta.id);
    if(!save) return null;
    return { id: meta.id, isActive: meta.id===activeSaveId, ...statsForSave(save) };
  }).filter(Boolean).sort((a,b)=> b.completionPct - a.completionPct);
}
function openLeaderboardSheet(){
  const rows = allSavesStats();
  const rowsHtml = rows.map(r=>`
    <div class="leaderboard-row${r.isActive?" active":""}">
      <div class="leaderboard-main">
        <div class="leaderboard-title">${escapeHtml(r.title)}${r.isActive?' <span class="leaderboard-tag">aktuell</span>':""}</div>
        <div class="leaderboard-sub">${escapeHtml(r.editionLabel)} · ${r.durationDays===null?"–":(r.durationDays<1?"<1 Tag":r.durationDays===1?"1 Tag":r.durationDays+" Tage")}</div>
      </div>
      <div class="leaderboard-stats">
        <div><span>${r.completionPct}%</span><label>Abschluss</label></div>
        <div><span>${r.survival===null?"–":r.survival+"%"}</span><label>Überlebt</label></div>
        <div><span>${r.bossesDone}/${r.bossesTotal}</span><label>Bosse</label></div>
      </div>
    </div>
  `).join("") || `<div class="loc-sub">Noch keine Spielstände vorhanden.</div>`;
  openSheet(`
    <h3>Bestenliste</h3>
    <div class="loc-sub" style="margin-bottom:14px;">Alle Spielstände nach Gesamtabschluss sortiert.</div>
    <div class="leaderboard-list">${rowsHtml}</div>
    <div class="sheet-footer" style="margin-top:14px;">
      <button class="btn btn-primary btn-block" data-act="close-sheet">Schließen</button>
    </div>
  `);
}

/* Schlägt localStorage.setItem fehl (voller Speicher, Safari-Privatmodus o.ä.), fingen writeSave()/
   persistSavesIndex() das bisher lautlos ab - man hätte munter weitergespielt, ohne dass je wieder
   etwas gesichert wird, und es erst beim nächsten App-Start gemerkt (alte Daten). warnOnSaveFailure()
   zeigt das jetzt einmal pro Sitzung sichtbar an, statt bei jedem weiteren fehlgeschlagenen Schreiben
   erneut zu nerven. */
let storageWarnShown = false;
function warnOnSaveFailure(){
  if(storageWarnShown) return;
  storageWarnShown = true;
  showStorageWarnToast();
}
function writeSave(id, saveData){
  try{ localStorage.setItem(saveStorageKey(id), JSON.stringify(saveData)); }catch(e){ warnOnSaveFailure(); }
  const index = loadSavesIndex();
  const meta = { id, title: effectiveRunTitle(saveData.runTitle), edition: saveData.edition, updatedAt: Date.now() };
  const entry = index.find(s=>s.id===id);
  if(entry) Object.assign(entry, meta); else index.push(meta);
  persistSavesIndex(index);
}

function createSave(editionId, soloMode){
  const id = newSaveId();
  writeSave(id, freshState(editionId, soloMode));
  return id;
}

/* Archivieren ist rein organisatorisch (blendet den Run in der Hauptliste des Spielstände-Sheets
   aus, siehe openSavesSheet) - der Spielstand bleibt vollständig nutzbar und wechselbar, nur eben
   nicht mehr im Weg, wenn man zwischen laufenden Runs wählt. Das Flag lebt bewusst nur im Index
   (nicht im vollen state), da writeSave() beim Speichern nur title/edition/updatedAt überschreibt
   und alle anderen Index-Felder unangetastet lässt. */
function setSaveArchived(id, archived){
  const index = loadSavesIndex();
  const entry = index.find(s=>s.id===id);
  if(!entry) return;
  entry.archived = archived;
  persistSavesIndex(index);
}

function deleteSave(id){
  let index = loadSavesIndex().filter(s=>s.id!==id);
  localStorage.removeItem(saveStorageKey(id));
  persistSavesIndex(index);
  if(id===activeSaveId){
    const nextId = index.length ? index[0].id : createSave("hgss");
    switchToSave(nextId);
  }
}

function switchToSave(id){
  const loaded = loadSaveState(id);
  if(!loaded) return false;
  activeSaveId = id;
  try{ localStorage.setItem(ACTIVE_SAVE_KEY, id); }catch(e){}
  state = loaded;
  return true;
}

/* Einmalige Migration: existiert noch kein Spielstände-Index, aber ein alter Einzel-state -
   diesen als ersten Spielstand übernehmen statt ihn stillschweigend zu verwerfen. */
function migrateLegacyStateIfNeeded(){
  if(loadSavesIndex().length) return;
  let legacy = null;
  try{
    const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(raw) legacy = normalizeState(JSON.parse(raw));
  }catch(e){}
  const id = newSaveId();
  writeSave(id, legacy || freshState("hgss"));
  try{ localStorage.setItem(ACTIVE_SAVE_KEY, id); }catch(e){}
  if(legacy) try{ localStorage.removeItem(LEGACY_STORAGE_KEY); }catch(e){}
}

function bootstrapActiveSave(){
  migrateLegacyStateIfNeeded();
  const index = loadSavesIndex();
  let id = null;
  try{ id = localStorage.getItem(ACTIVE_SAVE_KEY); }catch(e){}
  if(!id || !index.some(s=>s.id===id)) id = index[0] ? index[0].id : null;
  const loaded = id ? loadSaveState(id) : null;
  if(loaded){ activeSaveId = id; try{ localStorage.setItem(ACTIVE_SAVE_KEY, id); }catch(e){} state = loaded; return; }
  // Index leer oder Spielstand-Daten defekt/verschwunden -> sauberen neuen Spielstand anlegen
  activeSaveId = createSave("hgss");
  try{ localStorage.setItem(ACTIVE_SAVE_KEY, activeSaveId); }catch(e){}
  state = loadSaveState(activeSaveId);
}

function saveState(){ writeSave(activeSaveId, state); }

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');

/* Baut aus obiger Bibliothek eine eigenstaendige Inline-SVG (kein <img>/Data-URI noetig) - bewusst
   IMMER schwarz auf weiss (nicht an --ink/--bg gekoppelt), da ein QR-Code fuer zuverlaessiges Scannen
   echten Kontrast braucht, unabhaengig vom aktuell aktiven Hell-/Dunkel-Theme der App. */
function qrCodeSvg(text, cellSize){
  cellSize = cellSize || 5;
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const size = count * cellSize;
  let rects = "";
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(qr.isDark(r,c)) rects += `<rect x="${c*cellSize}" y="${r*cellSize}" width="${cellSize}" height="${cellSize}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="background:#fff; border-radius:10px; display:block; margin:0 auto;" role="img" aria-label="QR-Code zum Verknuepfen">
    <rect width="${size}" height="${size}" fill="#fff"/>
    <g fill="#000">${rects}</g>
  </svg>`;
}

   Bewusst OHNE Login/Konto - ein zufälliger, hochentropischer Sync-Code (50 Bit, wie ein "Wer den
   Link/Code kennt, kommt rein"-Share) verknüpft einen Spielstand mit einer Zeile in Supabase.
   Der direkte Tabellenzugriff ist per RLS komplett gesperrt; anon darf nur die beiden RPC-
   Funktionen nuzlocke_get_save/nuzlocke_put_save aufrufen, die serverseitig fest nach genau
   diesem Code filtern - ein Enumerieren fremder Spielstände über die REST-API ist damit nicht
   möglich, nur wer den eigenen Code kennt kommt an die eigene Zeile. Bewusst ohne die Supabase-
   JS-SDK (per CDN) eingebunden, um die App als reine Single-File ohne externe Skript-Abhängigkeit
   zu erhalten - die paar REST-Aufrufe reichen über fetch() völlig aus. */
const SUPABASE_URL = "https://cyaanqljqxzsqlzeaaev.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5YWFucWxqcXh6c3FsemVhYWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzcwODEsImV4cCI6MjEwMzI1MzA4MX0.XxPP3X0vpOZ5DtYJvjPeyV3JaVE2uO0FhQE64vIowi4";

function generateSyncCode(){
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // ohne 0/O, 1/I/L - beim Abtippen verwechselbar
  const bytes = new Uint8Array(10);
  crypto.getRandomValues(bytes);
  let code = "";
  bytes.forEach(b=>{ code += alphabet[b % alphabet.length]; });
  return code;
}

async function supabaseRpc(fnName, payload){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error(`Supabase-Fehler (${res.status})`);
  return res.json();
}

/* Liefert {data, updated_at} der Cloud-Zeile zu diesem Code, oder null wenn (noch) keine existiert. */
async function pullCloudSave(code){
  const rows = await supabaseRpc("nuzlocke_get_save", { p_code: code });
  return (rows && rows[0]) ? rows[0] : null;
}
/* Schreibt den kompletten aktuellen state als JSON in die Cloud-Zeile (Insert-or-Update über den
   Code als Primärschlüssel), liefert den serverseitigen updated_at-Zeitstempel zurück. */
async function pushCloudSave(code, dataObj){
  const rows = await supabaseRpc("nuzlocke_put_save", { p_code: code, p_data: dataObj });
  return (rows && rows[0]) ? rows[0].updated_at : null;
}

/* Grobe, editionsunabhängige Kennzahlen für den Konflikt-Vergleich - bewusst NICHT über die
   bestehenden aliveCount()/deadCount()/activeBosses()-Helfer, die alle fest auf den globalen
   state zugreifen: hier muss dieselbe Zählung auch auf dem rohen Cloud-Datensatz laufen, ohne
   den globalen state dafür umzuschalten. */
function progressSummary(s){
  const locs = Array.isArray(s.locations) ? s.locations : [];
  const caught = locs.filter(l=>l.mon && !l.mon.dead).length;
  const dead = locs.filter(l=>l.mon && l.mon.dead).length;
  const bossesDefeated = Object.keys(s.bossDefeated||{}).length;
  return `${caught} gefangen · ${dead} gestorben · ${bossesDefeated} Bosse besiegt`;
}

function openSyncConflictSheet(remote){

    <div class="loc-sub" style="margin-bottom:4px;"><strong>Cloud:</strong> ${escapeHtml(progressSummary(remote.data||{}))}</div>
    <div class="loc-sub" style="margin-bottom:14px;"><strong>Lokal:</strong> ${escapeHtml(progressSummary(state))}</div>
    <div class="sheet-footer" style="flex-direction:column; gap:10px;">
      <button class="btn btn-primary btn-block" data-act="use-cloud-save">Cloud-Version übernehmen</button>
      <button class="btn btn-secondary btn-block" data-act="use-local-save">Lokale Version behalten (Cloud überschreiben)</button>
      <button class="btn btn-ghost btn-block" data-act="close-sheet">Abbrechen</button>

/* Manuelles "Jetzt synchronisieren": zieht zuerst den Cloud-Stand, um zu prüfen, ob der seit dem
   letzten bekannten Sync-Zeitpunkt von einem anderen Gerät verändert wurde (echter Konflikt) -
   nur dann wird nachgefragt, statt eine Seite stillschweigend zu überschreiben. Ohne Konflikt
   (kein Cloud-Stand oder unverändert seit dem letzten Sync) wird der lokale Stand einfach
   hochgeladen, das ist der Normalfall bei nur einem aktiv genutzten Gerät. */
async function runSyncFlow(){
  if(!state.syncCode || syncInProgress) return;
  syncInProgress = true; render();
  try{
    const remote = await pullCloudSave(state.syncCode);
    if(remote && (!state.lastSyncedAt || new Date(remote.updated_at).getTime() > state.lastSyncedAt + 2000)){
      syncInProgress = false; render();
      openSyncConflictSheet(remote);
      return;
    }
    const updatedAt = await pushCloudSave(state.syncCode, state);
    state.lastSyncedAt = new Date(updatedAt).getTime();
    saveState();
    syncInProgress = false; render();
    openSyncResultSheet("Synchronisiert", "Dein Spielstand ist jetzt aktuell in der Cloud.");
  }catch(e){
    syncInProgress = false; render();
    openSyncResultSheet("Synchronisierung fehlgeschlagen", "Keine Verbindung zur Cloud möglich - prüfe deine Internetverbindung und versuch es erneut.");
  }
}

async function createSyncCode(){
  const code = generateSyncCode();
  state.syncCode = code;
  saveState(); render();
  try{
    const updatedAt = await pushCloudSave(code, state);
    state.lastSyncedAt = new Date(updatedAt).getTime();
    saveState(); render();
    openSyncActivatedSheet(code);
  }catch(e){
    render();
    openSyncResultSheet("Cloud nicht erreichbar", `Der Code ${code} wurde lokal gespeichert, aber noch nicht hochgeladen - „Jetzt synchronisieren" versucht es erneut, sobald wieder eine Verbindung besteht.`);
  }
}

async function confirmLinkSyncCode(){
  const input = document.getElementById("inSyncCode");
  const raw = (input?.value||"").trim();
  if(!raw) return;
  closeSheet();
  try{
    /* Eine rein 6-stellige Eingabe wird als Kurz-PIN behandelt (siehe showPairingPin()) und zuerst
       serverseitig auf den echten, langen Sync-Code aufgelöst - alles andere (10-stelliger Code)
       geht direkt durch. So braucht das Eingabefeld keinen eigenen Umschalter zwischen "Code"/"PIN". */
    let code = raw.toUpperCase();
    if(/^\d{6}$/.test(raw)){
      const pinRows = await supabaseRpc("nuzlocke_resolve_pairing_pin", { p_pin: raw });
      const resolved = pinRows && pinRows[0] && pinRows[0].sync_code;
      if(!resolved){
        openSyncResultSheet("PIN ungültig oder abgelaufen", `Der PIN wurde nicht gefunden oder ist nach 10 Minuten abgelaufen - auf dem anderen Gerät unter „Kurzen PIN anzeigen" einen neuen erzeugen und erneut versuchen.`);
        return;
      }
      code = resolved;
    }
    const remote = await pullCloudSave(code);
    if(!remote){
      openSyncResultSheet("Code nicht gefunden", `Zu ${code} existiert noch kein Cloud-Spielstand. Nutze stattdessen „Speichern", wenn du diesen Spielstand erstmalig hochladen willst.`);
      return;
    }
    const remoteData = normalizeState(remote.data);
    remoteData.syncCode = code;
    remoteData.lastSyncedAt = new Date(remote.updated_at).getTime();
    state = remoteData;
    saveState(); render();
    openSyncResultSheet("Verknüpft", "Der Cloud-Spielstand wurde geladen.");
  }catch(e){
    openSyncResultSheet("Cloud nicht erreichbar", "Keine Verbindung möglich - versuch es später erneut.");
  }
}

   Sheet, nie automatisch beim bloßen Öffnen des Links. */
function syncShareUrl(code){

}

/* Eigene Funktion statt nur inline im Klick-Handler, da sie zweifach gebraucht wird: direkt über
   "Kopieren" und als Fallback, falls das native Teilen-Menü (navigator.share) fehlschlägt. */
function copySyncCode(code){
  const done = ()=>{
    openSheet(`
      <h3>Kopiert</h3>

      <div class="sheet-footer"><button class="btn btn-primary btn-block" data-act="close-sheet">OK</button></div>
    `);
  };
  const failed = ()=>{
    openSheet(`
      <h3>Kopieren nicht möglich</h3>
      <div class="loc-sub" style="margin-bottom:14px;">Der Browser hat den Zugriff auf die Zwischenablage verweigert. Code zum manuellen Abtippen:</div>
      <div class="loc-sub" style="font-family:var(--font-mono); font-size:1.3rem; letter-spacing:.08em; text-align:center;">${escapeHtml(code)}</div>
      <div class="sheet-footer" style="margin-top:14px;"><button class="btn btn-primary btn-block" data-act="close-sheet">Schließen</button></div>

function shareSyncCode(code){
  if(!navigator.share){ copySyncCode(code); return; }
  navigator.share({ title: "Nuzlocke Cloud-Sync", text: `Sync-Code für meinen Nuzlocke-Spielstand: ${code}`, url: syncShareUrl(code) }).catch(err=>{
    if(err && err.name === "AbortError") return;
    copySyncCode(code);
  });
}

/* Liefert die Standorte, an denen genau eine Seite (ich oder Partner) das dortige Pokémon verloren
   hat, die andere aber noch nicht - also der klassische Soul-Link-Fall "eine Seite muss noch
   nachziehen". Standort-IDs werden rein aus dem Text "Region-Name" gebildet (siehe
   parseLocationEntry) - unabhängig von der Editions-ID selbst matchen sie deshalb automatisch
   überall dort, wo zwei Editionen dieselben Standortnamen verwenden (z.B. Partnerversionen wie
   Schwarz/Weiß oder Rubin/Saphir, die intern denselben Standort-Datensatz nutzen). Ein starrer
   Editions-Gleichheits-Check wäre daher zu streng und würde genau den klassischen Soul-Link-Fall
   (zwei verschiedene, aber routenidentische Partnerversionen) blockieren. null statt eines (ggf.
   leeren) Arrays signalisiert "keine gemeinsamen Standorte gefunden", weil die Editionen strukturell
   zu unterschiedlich sind (z.B. Kanto vs. Johto). */
function soulLinkMismatches(partnerSave){
  if(!partnerSave) return null;
  const partnerLocs = new Map((partnerSave.locations||[]).map(l=>[l.id, l]));
  const anyShared = state.locations.some(l=>partnerLocs.has(l.id));
  if(!anyShared) return null;
  const mismatches = [];
  state.locations.forEach(loc=>{
    if(!loc.mon) return;
    const theirs = partnerLocs.get(loc.id);
    if(!theirs || !theirs.mon) return;
    const mineDead = !!loc.mon.dead, theirsDead = !!theirs.mon.dead;
    if(mineDead !== theirsDead) mismatches.push({ name: loc.name, needsAction: mineDead ? "partner" : "du" });
  });
  return mismatches;
}

function soulLinkSectionHtml(partnerSave){
  if(!state.soulLinkMode) return "";
  const mismatches = soulLinkMismatches(partnerSave);
  if(mismatches === null){
    const partnerEdition = GAMES[partnerSave.edition] ? GAMES[partnerSave.edition].shortLabel : partnerSave.edition;
    return `<div class="loc-sub" style="margin-top:14px;">Soul-Link: keine gemeinsamen Standorte zwischen deiner Edition (${escapeHtml(currentGame().shortLabel)}) und der deines Partners (${escapeHtml(partnerEdition)}) gefunden.</div>`;
  }
  if(!mismatches.length) return `<div class="loc-sub" style="margin-top:14px;">Soul-Link: keine offenen Diskrepanzen.</div>`;
  return `<div class="loc-name" style="margin-top:14px;">Soul-Link-Hinweise (${mismatches.length})</div>
    <ul style="margin:6px 0 0; padding-left:20px; color:var(--ink-soft); font-size:.92rem; line-height:1.6;">

    </ul>`;
}

/* Proaktiver Soul-Link-Hinweis direkt beim Sterben (Pendant zu maybeOfferHideRegion()): zieht
   frisch den Partner-Stand (keine eigene Zwischenspeicherung, um keine veralteten Stände zu
   zeigen) und meldet sich nur, wenn an DERSELBEN Stelle das Partner-Pokémon laut letztem Abgleich
   noch lebt. Bewusst NICHT bei einem gerade ausgelösten Game-Over/Champion-Overlay (aliveCount()
   bzw. isChamp-Gewinn) - zwei sich überlappende Overlays gleichzeitig wären verwirrend, der
   Hinweis taucht dann eben erst beim nächsten Öffnen der Duo-Vergleichsansicht auf. */
async function checkSoulLinkAfterDeath(deadLocIds){
  if(!state.soulLinkMode || !state.duoCode || !deadLocIds || !deadLocIds.length) return;
  try{
    const remote = await pullCloudSave(state.duoCode);
    if(!remote) return;
    const partnerSave = normalizeState(remote.data);
    const partnerLocs = new Map((partnerSave.locations||[]).map(l=>[l.id, l]));
    const hints = [];
    deadLocIds.forEach(locId=>{
      const mine = findLoc(locId);
      const theirs = partnerLocs.get(locId);
      if(mine && theirs && theirs.mon && !theirs.mon.dead) hints.push({ name: mine.name, mon: theirs.mon.nickname || theirs.mon.species });
    });
    if(hints.length) openSoulLinkHintSheet(hints);
  }catch(e){}
}

function openSoulLinkHintSheet(hints){
  const list = hints.map(h=>`<li><strong>${escapeHtml(h.name)}:</strong> ${escapeHtml(h.mon)} lebt beim Partner laut letztem Abgleich noch</li>`).join("");
  openSheet(`
    <h3>Soul-Link-Hinweis</h3>
    <div class="loc-sub" style="margin-bottom:10px;">Dein Duo-Partner sollte jetzt ebenfalls aufgeben:</div>
    <ul style="margin:0 0 14px; padding-left:20px; color:var(--ink-soft); font-size:.92rem; line-height:1.6;">${list}</ul>
    <div class="sheet-footer"><button class="btn btn-primary btn-block" data-act="close-sheet">OK</button></div>
  `);
}

      return;
